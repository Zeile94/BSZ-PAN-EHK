  formulaCleanups.clear();
  messagesDiv.replaceChildren();

  const quizMessages =
    getQuizMessages(person);

  quizNavigation.index = Math.min(
    Math.max(0, quizNavigation.index),
    Math.max(0, quizMessages.length - 1)
  );

  let previousDate = null;

  for (const message of histories[person]) {
    const key = dateKey(message.timestamp);

    if (key !== previousDate) {
      const pill = document.createElement("div");
      pill.className = "wa-date-pill";
      pill.textContent = dateLabel(message.timestamp);

      messagesDiv.appendChild(pill);
      previousDate = key;
    }

    const bubble = document.createElement("div");

    bubble.className =
      `wa-msg-bubble ${message.who}` +
      (message.isError ? " error" : "");

    if (message.isHakanWelcome) {
      bubble.classList.add("hakan-welcome");
    }

    if (message.quiz) {
      const position =
        quizMessages.indexOf(message);

      if (position !== quizNavigation.index) {
        continue;
      }

      bubble.classList.add("learning-bubble");

      bubble.appendChild(
        renderQuizCard(
          message,
          person,
          position,
          quizMessages.length
        )
      );
    } else if (message.flashcards) {
      bubble.classList.add("learning-bubble");

      bubble.appendChild(
        renderFlashcards(message)
      );
    } else if (message.type === "text") {
      const text = document.createElement("div");
      text.className = "wa-msg-text";

      renderContent(
        text,
        message.text,
        message.sources || []
      );

      bubble.appendChild(text);
    } else if (message.type === "image") {
      const image = document.createElement("img");
      image.className = "wa-img-preview";
      image.src = message.imageSrc;
      image.alt = message.fileName || "Bild";

      bubble.appendChild(image);
    } else {
      const row = document.createElement("div");
      row.className = "wa-doc-row";

      const icon = document.createElement("span");
      icon.className = "wa-doc-icon";
      icon.textContent = "📄";

      const name = document.createElement("span");
      name.textContent = message.fileName;

      row.append(icon, name);
      bubble.appendChild(row);
    }

    if (message.isHakanWelcome) {
      appendHakanActions(bubble);
    }

    if (message.learningRetry) {
      const retryActions = document.createElement("div");
      retryActions.className = "learning-actions";

      const retry = learningButton(
        message.learningRetry.code === "TOPIC_CLARIFICATION" ||
        message.learningRetry.code === "TOPIC_OUTSIDE_SCOPE"
          ? "Thema und Zusammenhang ergänzen"
          : "Thema oder Kartenanzahl anpassen",

        () => {
          openLearningDialog(
            message.learningRetry.mode,
            {
              topic: message.learningRetry.topic,
              count: message.learningRetry.count,
              feedback: message.text
            }
          );
        }
      );

      retryActions.appendChild(retry);
      bubble.appendChild(retryActions);
    }

    if (!(message.quiz || message.flashcards)) {
      appendSources(
        bubble,
        message.sources || []
      );
    }

    if (message.warnings?.length) {
      const warning = document.createElement("div");
      warning.className = "technical-warning";

      warning.textContent = message.warnings
        .map(value => `ℹ️ ${value}`)
        .join("\n");

      bubble.appendChild(warning);
    }

    const meta = document.createElement("div");
    meta.className = "wa-msg-meta";
    meta.textContent = timeLabel(message.timestamp);

    if (message.who === "user") {
      const ticks = document.createElement("span");
      ticks.className = "wa-blue-check";
      ticks.innerHTML = ticksSvg;
      meta.appendChild(ticks);
    }

    bubble.appendChild(meta);
    messagesDiv.appendChild(bubble);
  }

  if (
    pending.has(person) ||
    autoGreetingTimers.has(person)
  ) {
    const status = pendingStatus[person];

    if (status) {
      const statusBubble =
        document.createElement("div");

      statusBubble.className = "wa-msg-bubble bot";

      const statusText =
        document.createElement("div");

      statusText.className = "wa-msg-text";
      statusText.setAttribute("role", "status");
      statusText.textContent = status;

      statusBubble.appendChild(statusText);

      const statusMeta =
        document.createElement("div");

      statusMeta.className = "wa-msg-meta";
      statusMeta.textContent =
        timeLabel(new Date());

      statusBubble.appendChild(statusMeta);

      messagesDiv.appendChild(statusBubble);
    }

    const typing = document.createElement("div");
    typing.className = "wa-typing";

    typing.setAttribute(
      "aria-label",
      `${profiles[person].name} schreibt gerade`
    );

    const typingRow = document.createElement("div");
    typingRow.className = "wa-typing-row";

    for (let index = 0; index < 3; index++) {
      const dot = document.createElement("div");
      dot.className = "wa-typing-dot";
      typingRow.appendChild(dot);
    }

    typing.appendChild(typingRow);
    messagesDiv.appendChild(typing);
  }

  scheduleViewport();
  toBottom();
}

function updatePreview(person, text, timestamp) {
  const latestMessage =
    histories[person][histories[person].length - 1];

  if (
    latestMessage &&
    !latestMessage.isError &&
    !latestMessage.isStatus &&
    !latestMessage.excludeFromModel
  ) {
    rememberBotInteraction(
      person,
      timestamp
    );
  }

  $(`preview-${person}`).textContent = text;

  $(`time-${person}`).textContent =
    timeLabel(timestamp);

  $(`ticks-${person}`)
    .classList.remove("hidden-element");

  const item = items.querySelector(
    `[data-person="${person}"]`
  );

  if (item) {
    items.prepend(item);
  }
}

function updateComposer() {
  const busy = currentPerson
    ? pending.has(currentPerson)
    : false;

  const hasText = (
    recording || speechStarting
      ? speechDraft
      : input.innerText
  ).trim().length > 0;

  micButton.disabled =
    busy || !currentPerson;

  sendButton.disabled =
    busy || !currentPerson || !hasText;

  uploadButton.disabled =
    busy || !currentPerson;

  fileInput.disabled =
    busy || !currentPerson;

  micButton.classList.toggle(
    "recording",
    recording || speechStarting
  );

  micButton.setAttribute(
    "aria-label",
    recording || speechStarting
      ? "Spracheingabe beenden"
      : "Spracheingabe starten oder ergänzen"
  );

  messagesDiv
    .querySelectorAll(".learning-entry-button")
    .forEach(button => {
      button.disabled =
        currentPerson !== "hakan" ||
        pending.has("hakan") ||
        !contentVisible;
    });
}

function schedulePendingStatus(
  person,
  text
) {
  clearPendingStatus(person);

  const timer = setTimeout(() => {
    pendingStatusTimers.delete(person);

    if (!pending.has(person)) return;

    addStatusMessage(person, text);

    if (currentPerson === person) {
      renderMessages(person);
    }
  }, PENDING_STATUS_DELAY_MS);

  pendingStatusTimers.set(person, timer);
}

function clearPendingStatus(person) {
  const timer =
    pendingStatusTimers.get(person);

  if (timer) {
    clearTimeout(timer);
    pendingStatusTimers.delete(person);
  }

  pendingStatus[person] = "";
}

function blurActive() {
  document.activeElement?.blur?.();
}

function showContent() {
  contentVisible = true;

  setPanelVisible(
    $("passwordPrompt"),
    false
  );

  setPanelVisible(
    $("studentPrompt"),
    false
  );

  setPanelVisible(messagesDiv, true);
  setPanelVisible(composer, true);

  syncComposerVisibility();
  renderMessages(currentPerson);
    updateComposer();
  settleViewport();

  if (navigationState === "chat") {
    startAutoGreeting(currentPerson);
  }
}
function hideChatContent() {
  contentVisible = false;

  setPanelVisible(
    $("passwordPrompt"),
    false
  );

  setPanelVisible(
    $("studentPrompt"),
    false
  );

  setPanelVisible(messagesDiv, false);
  setPanelVisible(composer, false);

  syncComposerVisibility();
}

function clearNavigationTimers() {
  clearTimeout(startTimer);
  clearTimeout(finishTimer);
}

function clearSelection() {
  items
    .querySelectorAll(".selected-tap")
    .forEach(item => {
      item.classList.remove("selected-tap");
    });
}

function highlightPerson(person) {
  clearTimeout(selectionTimer);
  clearSelection();

  if (person) {
    items.querySelector(
      `[data-person="${person}"]`
    )?.classList.add("selected-tap");
  }
}

function startSelectionTimer(token, duration) {
  clearTimeout(selectionTimer);

  selectionTimer = setTimeout(() => {
    if (token === navigationToken) {
      clearSelection();
    }
  }, reducedMotion.matches ? 0 : duration);
}

function clearSwipeStyles() {
  for (const element of [
    chatView,
    listView,
    composer
  ]) {
    element.style.removeProperty("transition");
    element.style.removeProperty("transform");
  }

  listView.style.removeProperty("opacity");
}

function finishOpen(token) {
  if (
    token !== navigationToken ||
    navigationState !== "opening"
  ) {
    return;
  }

  clearTimeout(finishTimer);

  navigationState = "chat";

  syncComposerVisibility();

  startAutoGreeting(currentPerson);
}

function finishClose(token) {
  if (
    token !== navigationToken ||
    navigationState !== "closing"
  ) return;

  clearTimeout(finishTimer);

  chatView.classList.remove("is-visible");
  chatView.setAttribute("aria-hidden", "true");
  chatView.setAttribute("inert", "");

  listView.removeAttribute("inert");
  listView.setAttribute("aria-hidden", "false");

  navigationState = "list";

  clearSwipeStyles();
  setPanelVisible(composer, false);
  syncComposerVisibility();
}

function openChat(person) {
  if (navigationState !== "list") return;

  clearNavigationTimers();
  clearTimeout(selectionTimer);
  clearSwipeStyles();
  setNavigationDuration(NAV_OPEN_MS);

  const token = ++navigationToken;
  navigationState = "opening";

  blurActive();
  currentPerson = person;
  highlightPerson(person);

  $("chatName").textContent =
    profiles[person].name;

  $("chatRole").textContent =
    profiles[person].role;

  $("chatAvatar").src =
    profiles[person].avatar;

  hideChatContent();

  input.textContent = drafts[person];
  loadProfile();

  if (
    person === "frank" &&
    !frankUnlocked
  ) {
    setPanelVisible(
      $("passwordPrompt"),
      true
    );

    $("passwordInput").value = "";

    $("passwordError")
      .classList.add("hidden-element");

    $("frankNameFields").classList.toggle(
      "hidden-element",
      Boolean(userProfile)
    );
  } else if (
    person !== "frank" &&
    !userProfile?.class &&
    !frankUnlocked
  ) {
    setPanelVisible(
      $("studentPrompt"),
      true
    );

    $("studentFirstNameInput").value =
      userProfile?.firstName || "";

    $("studentLastNameInput").value =
      userProfile?.lastName || "";

    $("studentClassSelect").value = "";

    $("studentError")
      .classList.add("hidden-element");
  } else {
    showContent();
  }

  searchInput.disabled = true;

  chatView.removeAttribute("inert");
  chatView.classList.add("is-visible");
  chatView.setAttribute("aria-hidden", "false");

  followBottom = true;

  updateComposer();
  settleViewport();

  void chatView.offsetWidth;
  void composer.offsetWidth;

  startTimer = setTimeout(() => {
    if (
      token !== navigationToken ||
      navigationState !== "opening"
    ) return;

    clearSelection();

    listView.setAttribute("inert", "");
    listView.setAttribute("aria-hidden", "true");

    chatView.classList.add("active-chat");
    listView.classList.add("in-background");

    syncComposerVisibility();

    if (reducedMotion.matches) {
      finishOpen(token);
    } else {
      finishTimer = setTimeout(
        () => finishOpen(token),
        NAV_OPEN_MS + 80
      );
    }
  }, reducedMotion.matches ? 0 : SELECT_OPEN_MS);
}

function beginClose({
  showSelection = true,
  selectionDuration = SELECT_CLOSE_MS
} = {}) {
  if (
    navigationState === "list" ||
    navigationState === "closing"
  ) return;

  clearNavigationTimers();
  clearTimeout(selectionTimer);

  const token = ++navigationToken;
  const leavingPerson = currentPerson;

  if (leavingPerson) {
    cancelAutoGreeting(leavingPerson);
  }

  stopRecording();

  if (leavingPerson) {
    drafts[leavingPerson] =
      input.innerText;
  }

  if (showSelection) {
    highlightPerson(leavingPerson);

    startSelectionTimer(
      token,
      selectionDuration
    );
  } else {
    clearSelection();
  }

  if (learningDialog.open) {
    learningDialog.close();
  }

  blurActive();

  navigationState = "closing";
  setNavigationDuration(NAV_CLOSE_MS);

  chatView.setAttribute("inert", "");
  composer.setAttribute("inert", "");

  chatView.classList.remove("active-chat");
  composer.classList.remove("composer-active");
  listView.classList.remove("in-background");

  clearSwipeStyles();

  searchInput.disabled = false;
  currentPerson = null;
  followBottom = false;

  updateComposer();
  settleViewport();

  if (reducedMotion.matches) {
    finishClose(token);
  } else {
    finishTimer = setTimeout(
      () => finishClose(token),
      NAV_CLOSE_MS + 80
    );
  }
}

function backToList() {
  beginClose({
    showSelection: true,
    selectionDuration: SELECT_CLOSE_MS
  });
}

chatView.addEventListener(
  "transitionend",
  event => {
    if (
      event.target !== chatView ||
      event.propertyName !== "transform"
    ) return;

    if (navigationState === "opening") {
      finishOpen(navigationToken);
    }

    if (navigationState === "closing") {
      finishClose(navigationToken);
    }
  }
);

function buildMessages(person) {
  return histories[person]
    .filter(message =>
      !message.isError &&
      !message.excludeFromModel
    )
    .map(message => {
      if (message.type === "image") {
        return {
          role: "user",

          content: [
            {
              type: "text",
              text: `[Bild: ${message.fileName}]`
            },
            {
              type: "image_url",

              image_url: {
                url: message.imageSrc
              }
            }
          ]
        };
      }

      if (message.type === "document") {
        return {
          role: "user",

          content:
            `[Dokument hochgeladen: ${message.fileName}]`
        };
      }

      return {
        role: message.who === "user"
          ? "user"
          : "assistant",

        content: message.text
      };
    });
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      resolve(reader.result);
    };

    reader.onerror = () => {
      reject(
        new Error(
          "Bild konnte nicht gelesen werden."
        )
      );
    };

    reader.readAsDataURL(file);
  });
}

async function sendMessage(file = null) {
  const person = currentPerson;

  if (
    !person ||
    pending.has(person)
  ) return;

  stopRecording();

  const text = input.innerText.trim();

  if (!text && !file) return;

  cancelAutoGreeting(person);

    if (person === "hakan" && text) {
    const createsQuiz =
      /\b(?:erstelle|erstellt|mach|mache|kannst du)\b[^.?!]*\bquiz\b/i.test(text) ||
      /\bquiz\b[^.?!]*\b(?:erstelle|erstellt|mach|mache)\b/i.test(text);

    const createsFlashcards =
      /\b(?:erstelle|erstellt|mach|mache|kannst du)\b[^.?!]*\blernkarten\b/i.test(text) ||
      /\blernkarten\b[^.?!]*\b(?:erstelle|erstellt|mach|mache)\b/i.test(text);

    if (createsQuiz || createsFlashcards) {
      const mode = createsQuiz
        ? "quiz"
        : "flashcards";

      const topicMatch = text.match(
        /(?:zum thema|über|zu)\s+(.+)$/i
      );

      const topic = topicMatch
        ? topicMatch[1]
            .replace(
              /[.!?]+$/,
              ""
            )
            .trim()
        : "";

      input.textContent = "";
      drafts[person] = "";

      updateComposer();

      openLearningDialog(mode, {
        topic
      });

      return;
    }
  }

  if (
    file &&
    file.size > 15 * 1024 * 1024
  ) {
    alert(
      "Bitte eine Datei unter 15 MB verwenden."
    );
    return;
  }

  const timestamp = new Date();

  const previousInteraction =
    lastInteraction[person];

  pending.add(person);

schedulePendingStatus(
  person,
  randomWaitingMessage(
    file ? "document" : "chat"
  )
);

  loadProfile();

  try {
    if (text) {
      histories[person].push({
        type: "text",
        text,
        who: "user",
        timestamp
      });
    }

    const apiHistory =
      buildMessages(person);

    input.textContent = "";
    drafts[person] = "";

    updateComposer();

    if (file) {
      const message = {
        type: file.type.startsWith("image/")
          ? "image"
          : "document",

        fileName: file.name,
        who: "user",
        timestamp
      };

      if (message.type === "image") {
        message.imageSrc =
          await readImage(file);
      }

      histories[person].push(message);
    }

    updatePreview(
      person,
      text || file.name,
      timestamp
    );

    renderMessages(person);

    const body = {
      person,
      frontendGreetingManaged: true,
      messages: apiHistory,
      documents: documents[person],
      firstName: userProfile?.firstName || "",
      lastName: userProfile?.lastName || "",
      studentClass: userProfile?.class || "",
      lastInteractionAt: previousInteraction
    };

    let options;

    if (file) {
      const form = new FormData();
      form.append("file", file);

      for (const [key, value] of Object.entries(body)) {
        form.append(
          key,

          typeof value === "string"
            ? value
            : JSON.stringify(value)
        );
      }

      options = {
        method: "POST",
        body: form
      };
    } else {
      options = {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(body)
      };
    }

    const response = await fetch(
      "/api/chat",
      options
    );

    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        `Unlesbare Serverantwort (HTTP ${response.status}).`
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    if (
      typeof data.message?.content !== "string"
    ) {
      throw new Error(
        data.error ||
        "Keine Textantwort erhalten."
      );
    }

    if (data.uploadedDocument) {
      documents[person] = [
        ...documents[person].filter(
          document =>
            document.id !==
            data.uploadedDocument.id
        ),

        data.uploadedDocument
      ].slice(-5);
    }

    const botTime = new Date();

    histories[person].push({
      type: "text",
      text: data.message.content,

      sources: normalizeSources(
        data.message.sources
      ),

      warnings: Array.isArray(data.warnings)
        ? data.warnings
        : [],

      who: "bot",
      timestamp: botTime
    });

    lastInteraction[person] =
      botTime.getTime();

    updatePreview(
      person,
      data.message.content,
      botTime
    );
  } catch (error) {
    console.error(
      "Chat-Anfrage:",
      error
    );

    const failedAt = new Date();

    histories[person].push({
      type: "text",

      text:
        "Die Antwort konnte nicht geladen werden.\n\n" +
        error.message,

      who: "bot",
      isError: true,
      timestamp: failedAt
    });

    updatePreview(
      person,
      "Antwort konnte nicht geladen werden.",
      failedAt
    );
  } finally {
    clearPendingStatus(person);
    pending.delete(person);

    if (currentPerson === person) {
      renderMessages(person);
      updateComposer();
      scheduleViewport();
    }
  }
}

function drawSpeech(
  spokenText,
  active = true
) {
  if (
    currentPerson !== recordingPerson
  ) return;

  const base = recordingBase
    ? recordingBase + (spokenText ? " " : "")
    : "";

  speechDraft = base + spokenText;

  input.replaceChildren();

  input.appendChild(
    document.createTextNode(base)
  );

  if (active && spokenText) {
    const characters =
      Array.from(spokenText);

    const before = characters
      .slice(
        0,
        Math.max(0, characters.length - 10)
      )
      .join("");

    const last = characters
      .slice(-10)
      .join("");

    input.appendChild(
      document.createTextNode(before)
    );

    const highlight =
      document.createElement("span");

    highlight.className =
      "drift-sparks-wrap";

    highlight.textContent = last;
    input.appendChild(highlight);

    const cursor =
      document.createElement("span");

    cursor.className = "voice-cursor";
    cursor.contentEditable = "false";
    cursor.setAttribute("aria-hidden", "true");

    input.appendChild(cursor);
  } else {
    input.appendChild(
      document.createTextNode(spokenText)
    );

    const mic =
      document.createElement("span");

    mic.className = "voice-inline-mic";
    mic.contentEditable = "false";

    mic.setAttribute(
      "aria-label",
      "Aufnahme läuft"
    );

    mic.innerHTML =
      `<svg viewBox="0 0 24 24">` +
      `<path d="${micPath}"/></svg>`;

    input.appendChild(mic);
  }

  input.scrollTop =
    input.scrollHeight;

  updateComposer();
  scheduleViewport();
}

function finishSpeechDraft() {
  clearTimeout(silenceTimer);

  if (
    recordingPerson &&
    currentPerson === recordingPerson
  ) {
    input.textContent = speechDraft;
    drafts[currentPerson] = speechDraft;
  }
}

function stopRecording() {
  if (
    !recognition &&
    !recording &&
    !speechStarting
  ) return;

  const instance = recognition;

  finishSpeechDraft();

  recognition = null;
  recording = false;
  speechStarting = false;
  recordingPerson = null;

  if (instance) {
    instance.onstart = null;
    instance.onresult = null;
    instance.onend = null;
    instance.onerror = null;

    try {
      instance.abort();
    } catch {}
  }

  updateComposer();
}

function focusInputAtEnd() {
  try {
    input.focus({
      preventScroll: true
    });
  } catch {
    input.focus();
  }

  const selection =
    window.getSelection();

  if (selection) {
    const range =
      document.createRange();

    range.selectNodeContents(input);
    range.collapse(false);

    selection.removeAllRanges();
    selection.addRange(range);
  }

  input.scrollTop =
    input.scrollHeight;

  settleViewport();
}

function handleInputDuringRecording(event) {
  if (
    !recognition &&
    !recording &&
    !speechStarting
  ) return;

  if (
    event.type === "pointerdown" &&
    event.button !== 0
  ) return;

  if (event.cancelable) {
    event.preventDefault();
  }

  stopRecording();
  focusInputAtEnd();
}

if ("PointerEvent" in window) {
  inputPill.addEventListener(
    "pointerdown",
    handleInputDuringRecording
  );
} else {
  inputPill.addEventListener(
    "touchstart",
    handleInputDuringRecording,
    { passive: false }
  );

  inputPill.addEventListener(
    "mousedown",
    handleInputDuringRecording
  );
}

function startRecording() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert(
      "Spracheingabe wird von diesem Browser nicht unterstützt."
    );
    return;
  }

  if (
    !currentPerson ||
    pending.has(currentPerson) ||
    recognition
  ) return;

  const instance =
    new Recognition();

  recognition = instance;
  recordingPerson = currentPerson;
  recordingBase = input.innerText.trim();
  speechDraft = recordingBase;
  speechStarting = true;

  instance.lang = "de-DE";
  instance.continuous = true;
  instance.interimResults = true;

  updateComposer();

  instance.onstart = () => {
    if (recognition !== instance) return;

    recording = true;
    speechStarting = false;

    drawSpeech("", false);
    updateComposer();
  };

  instance.onresult = event => {
    if (
      recognition !== instance ||
      currentPerson !== recordingPerson
    ) return;

    const parts = [];

    for (
      let index = 0;
      index < event.results.length;
      index++
    ) {
      parts.push(
        event.results[index][0]
          .transcript.trim()
      );
    }

    const spoken = parts
      .filter(Boolean)
      .join(" ");

    drawSpeech(spoken, true);
    clearTimeout(silenceTimer);

    silenceTimer = setTimeout(() => {
      if (
        recognition === instance &&
        recording
      ) {
        drawSpeech(spoken, false);
      }
    }, 1200);
  };

  const finish = () => {
    if (recognition !== instance) return;

    finishSpeechDraft();

    recognition = null;
    recording = false;
    speechStarting = false;
    recordingPerson = null;

    updateComposer();
  };

  instance.onend = finish;

  instance.onerror = event => {
    finish();

    if (event.error === "not-allowed") {
      alert(
        "Bitte den Mikrofonzugriff erlauben."
      );
    }
  };

  try {
    instance.start();
  } catch {
    finish();

    alert(
      "Spracheingabe konnte nicht gestartet werden."
    );
  }
}

function learningElement(
  tag,
  className,
  text
) {
  const element =
    document.createElement(tag);

  if (className) {
    element.className = className;
  }

  if (text !== undefined) {
    element.textContent = text;
  }

  return element;
}

function learningButton(
  text,
  action,
  className = ""
) {
  const button = learningElement(
    "button",
    `learning-button ${className}`.trim(),
    text
  );

  button.type = "button";
  button.addEventListener("click", action);

  return button;
}

function focusWithoutScroll(element) {
  if (!element) return;

  try {
    element.focus({
      preventScroll: true
    });
  } catch {
    element.focus();
  }
}

function shortTopic(topic) {
  return String(topic || "")
    .replace(/\s*\([^)]*\)/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function renderFlashcards(message) {
  const deck = message.flashcards;
  const state = message.flashState;

  const wrapper = learningElement(
    "section",
    "learning-card"
  );

  wrapper.setAttribute(
    "aria-label",
    "Lernkarten: " + deck.topic
  );

  function paint() {
    wrapper.replaceChildren();

    const topic = learningElement(
      "div",
      "learning-topic",
      `Lernkarten zum Thema „${shortTopic(deck.topic)}“`
    );

    const count = deck.cards.length;

    state.index = Math.min(
      count - 1,
      Math.max(0, state.index)
    );

    const card =
      deck.cards[state.index];

    const percent = Math.round(
      100 * (state.index + 1) / count
    );

    const top = learningElement(
      "div",
      "flash-topline"
    );

    top.append(
      learningElement(
        "span",
        "",
        `Lernkarte ${state.index + 1} von ${count}`
      ),

      learningElement(
        "span",
        "flash-percent",
        `${percent} %`
      )
    );

    const progress = learningElement(
      "progress",
      "flash-progress"
    );

    progress.max = count;
    progress.value = state.index + 1;

    progress.setAttribute(
      "aria-label",
      "Position im Lernkartensatz"
    );

    const face = learningElement(
      "div",
      "flash-face"
    );

    face.setAttribute(
      "aria-live",
      "polite"
    );

    face.setAttribute(
      "aria-atomic",
      "true"
    );

    const icon = learningElement(
      "div",
      "flash-icon"
    );

    icon.setAttribute(
      "aria-hidden",
      "true"
    );

    icon.innerHTML = state.answerVisible
      ? learningSolutionIcon
      : learningTaskIcon;

    const label = learningElement(
      "div",
      "flash-label",
      state.answerVisible
        ? "Lösung"
        : "Aufgabe"
    );

    const text = learningElement(
      "div",
      "flash-text"
    );

    renderContent(
      text,

      state.answerVisible
        ? card.answer
        : card.question
    );

    face.append(
      icon,
      label,
      text
    );

    const toggle = learningButton(
      state.answerVisible
        ? "Aufgabe anzeigen"
        : "Lösung anzeigen",

      () => {
        state.answerVisible =
          !state.answerVisible;

        paint();

        focusWithoutScroll(
          wrapper.querySelector(
            ".flash-toggle"
          )
        );
      },

      "primary flash-toggle"
    );

    const navigation = learningElement(
      "div",
      "flash-navigation"
    );

    const back = learningButton(
      "‹ Zurück",
      () => move(-1)
    );

    back.disabled =
      state.index === 0;

    const next = learningButton(
      "Weiter ›",
      () => move(1),
      "primary"
    );

    next.disabled =
      state.index === count - 1;

    navigation.append(
      back,
      next
    );

    const restart = learningButton(
      "↻ Von vorne beginnen",

      () => {
        state.index = 0;
        state.answerVisible = false;

        paint();

        focusWithoutScroll(
          wrapper.querySelector(
            ".flash-toggle"
          )
        );
      },

      "flash-restart"
    );

    wrapper.append(
      topic,
      top,
      progress,
      face,
      toggle,
      navigation,
      restart
    );

    scheduleViewport();
  }

  function move(delta) {
    state.index += delta;
    state.answerVisible = false;

    paint();

    focusWithoutScroll(
      wrapper.querySelector(
        ".flash-toggle"
      )
    );
  }

  paint();
  return wrapper;
}

function quizIsCorrect(
  quiz,
  selected
) {
  return (
    selected.length ===
      quiz.correctIds.length &&

    selected.every(id =>
      quiz.correctIds.includes(id)
    )
  );
}

function quizRetryText(
  quiz,
  selected
) {
  const wrongSelected =
    selected.filter(
      id =>
        !quiz.correctIds.includes(id)
    );

  const missingCorrect =
    quiz.correctIds.filter(
      id =>
        !selected.includes(id)
    );

  if (wrongSelected.length) {
    return "Mindestens eine ausgewählte Antwort ist falsch. Prüfe deine Auswahl und versuche es erneut.";
  }

  if (missingCorrect.length) {
    return "Deine Auswahl ist noch unvollständig. Prüfe, ob weitere Antworten richtig sind.";
  }

  return "Deine Auswahl ist noch nicht richtig. Versuche es erneut.";
}

function quizContextText(message) {
  const quiz = message.quiz;
  const state = message.quizState;

  let text =
    "Quizaufgabe: " +
    quiz.question +
    "\n" +

    quiz.options.map(option =>
      option.id + ") " + option.text
    ).join("\n");

  if (state.attempts) {
    text +=
      "\n\nFehlversuche: " +
      state.attempts;
  }

  if (state.solved) {
    text +=
      "\n\nErgebnis: richtig gelöst" +
      "\nRichtige Antworten: " +
      quiz.correctIds.join(", ") +
      "\nErklärung: " +
      quiz.explanation;
  } else if (state.skipped) {
    text +=
      "\n\nErgebnis: übersprungen" +
      "\nRichtige Antworten: " +
      quiz.correctIds.join(", ") +
      "\nErklärung: " +
      quiz.explanation;
  }

  return text;
}

function renderQuizCard(
  message,
  person,
  position,
  total
) {
  const quiz = message.quiz;
  const state = message.quizState;
  const isLatest = position === total - 1;

  const card = learningElement(
    "section",
    "learning-card" +
    (state.loadingNext
      ? " quiz-card-loading"
      : "")
  );

  card.setAttribute(
    "aria-label",
    "Quizaufgabe"
  );

  const topic = learningElement(
    "div",
    "learning-topic",
    `Quiz zum Thema „${shortTopic(quiz.topic)}“`
  );

  const heading = learningElement(
    "h3",
    "learning-card-title"
  );

  renderContent(
    heading,
    quiz.question
  );

  const hint = learningElement(
    "p",
    "learning-hint",

    quiz.mode === "single"
      ? "Single Choice: Genau eine Antwort ist richtig."
      : "Multiple Choice: Mehrere Antworten können richtig sein."
  );

  const options = learningElement(
    "fieldset",
    "quiz-options"
  );

  const actions = learningElement(
    "div",
    "learning-actions"
  );

  const feedback = learningElement(
    "div",
    "quiz-feedback"
  );

  feedback.setAttribute(
    "role",
    "status"
  );

  feedback.hidden =
    !state.solved &&
    !state.skipped &&
    !state.wrongFeedback;

  const inputElements = [];
  const optionLabels = [];

  const finished =
    state.solved || state.skipped;

  const check = learningButton(
    "Antworten überprüfen",

    () => {
      if (
        finished ||
        !state.selected.length
      ) return;

      if (
        quizIsCorrect(
          quiz,
          state.selected
        )
      ) {
        state.solved = true;
        state.wrongFeedback = "";
      } else {
        state.attempts++;
        state.wrongFeedback =
          quizRetryText(
            quiz,
            state.selected
          );
      }

      message.text =
        quizContextText(message);

      renderMessages(person);
    },

    "primary"
  );

  check.disabled =
    finished ||
    state.loadingNext ||
    !state.selected.length;

  const skip = learningButton(
    "Aufgabe überspringen",

    () => {
      if (finished) return;

      state.skipped = true;
      state.wrongFeedback = "";

      message.text =
        quizContextText(message);

      renderMessages(person);
    }
  );

  skip.disabled =
    finished ||
    state.loadingNext ||
    !isLatest;

  quiz.options.forEach(option => {
    const selected =
      state.selected.includes(option.id);

    const label = learningElement(
      "label",
      "quiz-option"
    );

    label.classList.toggle(
      "selected",
      selected
    );

    const control =
      document.createElement("input");

    control.type =
      quiz.mode === "single"
        ? "radio"
        : "checkbox";

    control.name =
      `quiz-${state.id}`;

    control.value = option.id;
    control.checked = selected;
    control.disabled =
      finished ||
      state.loadingNext;

    const content = learningElement(
      "span",
      "quiz-option-content"
    );

    renderContent(
      content,
      `${option.id}) ${option.text}`
    );

    control.addEventListener(
      "change",
      () => {
        state.selected = inputElements
          .filter(element =>
            element.checked
          )
          .map(element =>
            element.value
          );

        inputElements.forEach(
          (element, index) => {
            optionLabels[index]
              .classList.toggle(
                "selected",
                element.checked
              );
          }
        );

        check.disabled =
          state.loadingNext ||
          finished ||
          state.selected.length === 0;
      }
    );

    inputElements.push(control);
    optionLabels.push(label);

    label.append(
      control,
      content
    );

    if (finished) {
      label.classList.add("reviewed");

      const correct =
        quiz.correctIds.includes(
          option.id
        );

      if (correct) {
        label.classList.add("correct");
      } else if (
        state.solved &&
        selected
      ) {
        label.classList.add("incorrect");
      }

      if (state.solved) {
        let resultText;

        if (correct && selected) {
          resultText =
            "✓ Richtig ausgewählt";
        } else if (correct) {
          resultText =
            "✓ Richtige Antwort – nicht ausgewählt";
        } else if (selected) {
          resultText =
            "✗ Falsch ausgewählt";
        } else {
          resultText =
            "Nicht richtig – nicht ausgewählt";
        }

        content.appendChild(
          learningElement(
            "span",
            "quiz-result-label",
            resultText
          )
        );
      }
    }

    options.appendChild(label);
  });

  actions.appendChild(check);
  actions.appendChild(skip);

  const feedbackArea =
    learningElement("div");

  if (state.wrongFeedback) {
    feedbackArea.appendChild(
      learningElement(
        "div",
        "quiz-retry",
        state.wrongFeedback
      )
    );

    feedbackArea.appendChild(
      learningElement(
        "p",
        "learning-note",
        "Bitte passe deine Auswahl an und prüfe erneut."
      )
    );
  }

  if (state.solved) {
    feedbackArea.appendChild(
      learningElement(
        "div",
        "quiz-feedback-heading",
        "✓ Richtig gelöst!"
      )
    );

    const explanation = learningElement(
      "div",
      "wa-msg-text"
    );

    renderContent(
      explanation,
      quiz.explanation
    );

    feedbackArea.appendChild(
      explanation
    );
  }

  if (state.skipped) {
    feedbackArea.appendChild(
      learningElement(
        "div",
        "quiz-feedback-heading",
        "Aufgabe übersprungen."
      )
    );

    const explanation = learningElement(
      "div",
      "wa-msg-text"
    );

    renderContent(
      explanation,

      "Richtige Antworten: " +
      quiz.correctIds.join(", ") +
      "\n" +
      quiz.explanation
    );

    feedbackArea.appendChild(
      explanation
    );
  }

  feedback.hidden =
    !feedbackArea.childNodes.length;

  if (!feedback.hidden) {
    feedback.appendChild(feedbackArea);
  }

  const navigation = learningElement(
    "div",
    "quiz-navigation"
  );

  const back = learningButton(
    "‹ Zurück",

    () => {
      if (quizNavigation.index > 0) {
        quizNavigation.index--;
        renderMessages(person);
      }
    }
  );

  back.disabled =
    position === 0 ||
    state.loadingNext;

  const forward = learningButton(
    "Weiter ›",

    () => {
      if (
        quizNavigation.index <
        total - 1
      ) {
        quizNavigation.index++;
        renderMessages(person);
      }
    },

    "primary"
  );

  forward.disabled =
    isLatest ||
    state.loadingNext;

  navigation.append(
    back,
    forward
  );

  card.append(
    topic,
    heading,
    hint,
    options,
    actions,
    feedback,
    navigation
  );

  if (isLatest && finished) {
    const next = learningButton(
      "Nächste Aufgabe",

      async () => {
        if (state.loadingNext) return;

        state.loadingNext = true;
        next.disabled = true;

        renderMessages(person);

        const success =
          await useQuizPrefetch(
            quiz.topic,
            person,
            message
          );

        state.loadingNext = false;

        if (!success) {
          const directSuccess =
            await requestLearning(
              "quiz",
              quiz.topic,
              1,
              {
                replaceCurrentQuiz: true,
                currentQuizMessage: message
              }
            );

          if (directSuccess) {
            state.continued = true;
          }
        }

        if (
          currentPerson === person
        ) {
          renderMessages(person);
        }
      },

      "primary"
    );

    next.disabled =
      pending.has(person) ||
      state.loadingNext ||
      Boolean(state.continued);

    actions.appendChild(next);
  }

  if (state.loadingNext) {
    const overlay =
      document.createElement("div");

    overlay.className =
      "quiz-loading-overlay";

    const inner =
      document.createElement("div");

    inner.className =
      "quiz-loading-overlay-inner";

    const spinner =
      document.createElement("span");

    spinner.className = "quiz-spinner";
    spinner.setAttribute(
      "aria-hidden",
      "true"
    );

    const text = learningElement(
      "span",
      "",
      "Hakan erstellt die nächste Aufgabe …"
    );

    inner.append(spinner, text);
    overlay.appendChild(inner);
    card.appendChild(overlay);
  }

  return card;
}

function validLearningQuiz(quiz) {
  const answerIds = [
    "A",
    "B",
    "C",
    "D"
  ];

  if (
    !quiz ||
    typeof quiz.topic !== "string" ||
    !quiz.topic.trim() ||
    typeof quiz.question !== "string" ||
    !quiz.question.trim() ||
    typeof quiz.explanation !== "string" ||
    !quiz.explanation.trim() ||
    !["single", "multiple"].includes(
      quiz.mode
    )
  ) {
    return false;
  }

  if (
    !Array.isArray(quiz.options) ||
    quiz.options.length !== 4 ||
    !quiz.options.every((option, index) =>
      option &&
      option.id === answerIds[index] &&
      typeof option.text === "string" &&
      option.text.trim().length > 0
    )
  ) {
    return false;
  }

  if (
    !Array.isArray(quiz.correctIds) ||
    new Set(quiz.correctIds).size !==
      quiz.correctIds.length ||
    !quiz.correctIds.every(id =>
      answerIds.includes(id)
    )
  ) {
    return false;
  }

  return quiz.mode === "single"
    ? quiz.correctIds.length === 1
    : (
        quiz.correctIds.length >= 2 &&
        quiz.correctIds.length <= 3
      );
}

function validLearningDeck(
  deck,
  count
) {
  return (
    deck &&
    typeof deck.topic === "string" &&
    deck.topic.trim().length > 0 &&
    Array.isArray(deck.cards) &&
    deck.cards.length === count &&
    deck.cards.every(card =>
      card &&
      typeof card.question === "string" &&
      card.question.trim().length > 0 &&
      typeof card.answer === "string" &&
      card.answer.trim().length > 0
    )
  );
}

function isLearningNoticeCode(code) {
  return [
    "TOPIC_CLARIFICATION",
    "TOPIC_OUTSIDE_SCOPE",
    "INSUFFICIENT_EVIDENCE",
    "WEB_RESEARCH_UNAVAILABLE"
  ].includes(code);
}

function createLearningRequestError(
  message,
  code
) {
  const error = new Error(message);
  error.code = code || "";
  return error;
}

function createQuizMessage(
  data,
  timestamp
) {
  const context =
    normalizeMaterialContext(
      data.materialContext
    );

  const sources = normalizeSources(
    Array.isArray(data.sources) &&
    data.sources.length
      ? data.sources
      : context?.sources
  );

  const message = {
    type: "text",
    who: "bot",
    timestamp,
    text: "",

    quiz: data.quiz,

    quizState: {
      id: ++learningSequence,
      selected: [],
      attempts: 0,
      solved: false,
      skipped: false,
      continued: false,
      loadingNext: false,
      wrongFeedback: ""
    },

    materialContext: context,
    sources
  };

  message.text =
    quizContextText(message);

  return message;
}

function startQuizPrefetch(
  topic,
  previousQuestions
) {
  quizPrefetch = {
    topic,
    previousQuestions,

    promise: fetch(
      "/api/quiz",

      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          topic,
          previousQuestions
        })
      }
    )
      .then(async response => {
        const raw =
          await response.text();

        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            `Unlesbare Serverantwort (HTTP ${response.status}).`
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );
        }

        return data;
      })
      .catch(error => ({
        error
      }))
  };
}

async function useQuizPrefetch(
  topic,
  person,
  currentMessage
) {
  if (
    !quizPrefetch ||
    quizPrefetch.topic !== topic
  ) {
    return false;
  }

  const data =
    await quizPrefetch.promise;

  quizPrefetch = null;

  if (
    !data ||
    data.error ||
    !validLearningQuiz(data.quiz)
  ) {
    return false;
  }

  const timestamp = new Date();
  const message =
    createQuizMessage(
      data,
      timestamp
    );

  histories[person].push(message);

  quizNavigation.index =
    getQuizMessages(person).length - 1;

  const nextQuestions = [
    ...getQuizMessages(person)
      .slice(-12)
      .map(item =>
        item.quiz.question
      )
  ];

  startQuizPrefetch(
    data.quiz.topic,
    nextQuestions
  );

  lastInteraction[person] =
    timestamp.getTime();

  updatePreview(
    person,
    data.quiz.question,
    timestamp
  );

  return true;
}

function wait(milliseconds) {
  return new Promise(resolve =>
    setTimeout(resolve, milliseconds)
  );
}

async function requestLearning(
  mode,
  topic,
  count,
  options = {}
) {
  const person = "hakan";

  if (
    currentPerson !== person ||
    !contentVisible ||
    pending.has(person)
  ) {
    return false;
  }

  cancelAutoGreeting(person);

  stopRecording();
  blurActive();

  if (mode === "quiz") {
    quizPrefetch = null;
  }

  lastLearningTopic = topic;
  pending.add(person);

  renderMessages(person);
  updateComposer();

  await wait(2000);

  addLearningAcknowledgment(
    person,
    mode,
    topic
  );

  schedulePendingStatus(
    person,
    randomWaitingMessage(
      mode === "quiz"
        ? "quiz"
        : "flashcards"
    )
  );

  renderMessages(person);
  updateComposer();

  const controller =
    new AbortController();

  const timer = setTimeout(
    () => controller.abort(),
    115000
  );

  try {
    let previousQuestions =
      getQuizMessages(person)
        .slice(-12)
        .map(message =>
          message.quiz.question
        );

    if (
      mode === "quiz" &&
      options.currentQuizMessage?.quiz
    ) {
      previousQuestions = [
        ...previousQuestions,
        options.currentQuizMessage.quiz.question
      ].slice(-12);
    }

    const endpoint =
      mode === "quiz"
        ? "/api/quiz"
        : "/api/flashcards";

    const body =
      mode === "quiz"
        ? {
            topic,
            previousQuestions
          }
        : {
            topic,
            count
          };

    const response = await fetch(
      endpoint,

      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        signal: controller.signal,

        body: JSON.stringify(body)
      }
    );

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw createLearningRequestError(
        "Keine lesbare Serverantwort. " +
        "Bitte Deployment und API-Endpunkt prüfen.",

        "INVALID_SERVER_RESPONSE"
      );
    }

    if (!response.ok) {
      throw createLearningRequestError(
        data.error ||
          "Das Lernangebot konnte nicht erstellt werden.",

        data.code
      );
    }

    await wait(2000);

    const timestamp = new Date();

    if (mode === "quiz") {
      if (!validLearningQuiz(data.quiz)) {
        throw createLearningRequestError(
          "Die Quizdaten sind unvollständig.",
          "INVALID_LEARNING_OFFER"
        );
      }

      lastLearningTopic =
        data.quiz.topic;

      const message =
        createQuizMessage(
          data,
          timestamp
        );

      histories[person].push(message);

      quizNavigation.index =
        getQuizMessages(person).length - 1;

      startQuizPrefetch(
        data.quiz.topic,
        [
          ...previousQuestions,
          data.quiz.question
        ].slice(-12)
      );

      updatePreview(
        person,
        data.quiz.question,
        timestamp
      );
    } else {
      if (
        !validLearningDeck(
          data.deck,
          count
        )
      ) {
        throw createLearningRequestError(
          "Der Lernkartensatz ist unvollständig. " +
          "Bitte erneut versuchen.",

          "INVALID_LEARNING_OFFER"
        );
      }

      lastLearningTopic =
        data.deck.topic;

      const context =
        normalizeMaterialContext(
          data.materialContext
        );

      const sources = normalizeSources(
        Array.isArray(data.sources) &&
        data.sources.length
          ? data.sources
          : context?.sources
      );

      const contextText =
        "Lernkartensatz: " +
        data.deck.topic +
        "\n\n" +

        data.deck.cards.map(
          (card, index) =>
            `${index + 1}. Aufgabe: ${card.question}\n` +
            `Lösung: ${card.answer}`
        ).join("\n\n");

      histories[person].push({
        type: "text",
        who: "bot",
        timestamp,
        text: contextText,

        flashcards: data.deck,

        flashState: {
          index: 0,
          answerVisible: false
        },

        materialContext: context,
        sources
      });

      updatePreview(
        person,
        "Lernkarten: " + data.deck.topic,
        timestamp
      );
    }

    lastInteraction[person] =
      timestamp.getTime();

    return true;
  } catch (error) {
    const failedAt = new Date();

    const notice =
      isLearningNoticeCode(
        error.code
      );

    const messageText =
      error.name === "AbortError"
        ? "Die Erstellung hat zu lange gedauert. " +
          "Bitte erneut oder mit weniger Karten versuchen."
        : error.message;

    histories[person].push({
      type: "text",
      who: "bot",
      timestamp: failedAt,

      text: notice
        ? messageText
        : "Das Lernangebot konnte nicht geladen werden.\n\n" +
          messageText,

      isError: !notice,
      excludeFromModel: true,

      learningRetry: {
        mode,
        topic,
        count,
        code: error.code || ""
      }
    });

    updatePreview(
      person,

      notice
        ? messageText
        : "Lernangebot konnte nicht geladen werden.",

      failedAt
    );

    return false;
  } finally {
    clearTimeout(timer);
    clearPendingStatus(person);
    pending.delete(person);

    if (currentPerson === person) {
      renderMessages(person);
      updateComposer();
    }
  }
}

function openLearningDialog(
  mode,
  options = {}
) {
  if (
    currentPerson !== "hakan" ||
    !contentVisible ||
    pending.has("hakan")
  ) return;

  cancelAutoGreeting("hakan");

  renderMessages("hakan");

  learningDialogMode = mode;

  $("learningDialogTitle").textContent =
    mode === "quiz"
      ? "Quiz starten"
      : "Lernkarten starten";

  $("learningCountRow").hidden =
    mode === "quiz";

  $("learningTopic").value =
    typeof options.topic === "string"
      ? options.topic
      : "";

  $("learningTopic")
    .setCustomValidity("");

  if (
    [5, 10, 20].includes(
      Number(options.count)
    )
  ) {
    $("learningCount").value =
      String(options.count);
  }

  const feedback =
    $("learningDialogFeedback");

  feedback.textContent =
    typeof options.feedback === "string"
      ? options.feedback
      : "";

  feedback.hidden =
    !feedback.textContent;

  stopRecording();
  blurActive();

  if (!learningDialog.open) {
    learningDialog.showModal();
  }
}

$("learningForm").addEventListener(
  "submit",
  event => {
    event.preventDefault();

    const topic =
      $("learningTopic").value.trim();

    if (
      !topic ||
      topic.length > 500
    ) {
      $("learningTopic").setCustomValidity(
        "Bitte ein Thema mit höchstens 500 Zeichen eingeben."
      );

      $("learningTopic")
        .reportValidity();

      return;
    }

    const count = Number(
      $("learningCount").value
    );

    if (
      learningDialogMode === "flashcards" &&
      ![5, 10, 20].includes(count)
    ) {
      return;
    }

    const mode =
      learningDialogMode;

    learningDialog.close();

    requestLearning(
      mode,
      topic,
      count
    );
  }
);

input.addEventListener(
  "paste",
  event => {
    event.preventDefault();

    if (
      recording ||
      speechStarting
    ) {
      stopRecording();
    }

    const selection =
      window.getSelection();

    if (
      !selection?.rangeCount
    ) return;

    const range =
      selection.getRangeAt(0);

    if (
      !input.contains(
        range.commonAncestorContainer
      )
    ) {
      return;
    }

    range.deleteContents();

    const node =
      document.createTextNode(
        event.clipboardData.getData(
          "text/plain"
        )
      );

    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);

    selection.removeAllRanges();
    selection.addRange(range);

    input.dispatchEvent(
      new Event("input")
    );
  }
);

function normalizeSearch(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .trim();
}

searchInput.addEventListener(
  "input",
  () => {
    const query =
      normalizeSearch(
        searchInput.value
      );

    items
      .querySelectorAll(
        ".wa-chat-item"
      )
      .forEach(item => {
        const person =
          item.dataset.person;

        const profile =
          profiles[person];

        const value =
          normalizeSearch([
            profile.name,
            profile.role,
            profile.desc,

            ...histories[person].map(
              message =>
                message.text ||
                message.fileName ||
                ""
            )
          ].join(" "));

        item.classList.toggle(
          "hidden-element",

          Boolean(query) &&
          !value.includes(query)
        );
      });
  }
);

chatView.addEventListener(
  "touchstart",
  event => {
    if (
      event.touches.length !== 1 ||
      navigationState !== "chat"
    ) return;

    const touch =
      event.touches[0];

    const localX =
      touch.clientX -
      phone.getBoundingClientRect().left;

    if (
      localX > 80 ||
      event.target.closest(
        ".wa-formula-frame, .learning-card, " +
        ".learning-entry-actions, " +
        "input, select, [contenteditable], button, a"
      )
    ) {
      swipe = null;
      return;
    }

    swipe = {
      x: touch.clientX,
      y: touch.clientY,
      delta: 0,
      active: false,
      startedAt: 0
    };
  },
  { passive: true }
);

chatView.addEventListener(
  "touchmove",
  event => {
    if (
      !swipe ||
      event.touches.length !== 1
    ) return;

    const touch =
      event.touches[0];

    const dx =
      touch.clientX - swipe.x;

    const dy = Math.abs(
      touch.clientY - swipe.y
    );

    if (!swipe.active) {
      if (
        dy > 12 &&
        dy >= dx
      ) {
        swipe = null;
        return;
      }

      if (
        dx < 10 ||
        dx <= dy
      ) return;

      swipe.active = true;

      swipe.startedAt =
        performance.now();

      highlightPerson(
        currentPerson
      );

      startSelectionTimer(
        navigationToken,
        SELECT_CLOSE_MS
      );
    }

    if (event.cancelable) {
      event.preventDefault();
    }

    swipe.delta = Math.max(
      0,
      Math.min(
        dx,
        phone.clientWidth
      )
    );

    const progress =
      swipe.delta /
      phone.clientWidth;

    for (const element of [
      chatView,
      listView,
      composer
    ]) {
      element.style.transition =
        "none";
    }

    chatView.style.transform =
      `translate3d(${swipe.delta}px,0,0)`;

    composer.style.transform =
      `translate3d(${swipe.delta}px,0,0)`;

    listView.style.transform =
      `translate3d(${-20 + 20 * progress}%,0,0)`;

    listView.style.opacity =
      String(
        0.6 + 0.4 * progress
      );
  },
  { passive: false }
);

function endSwipe(
  cancelled = false
) {
  if (!swipe) return;

  const gesture = swipe;
  swipe = null;

  if (!gesture.active) return;

  void chatView.offsetWidth;

  for (const element of [
    chatView,
    listView,
    composer
  ]) {
    element.style.removeProperty(
      "transition"
    );
  }

  void chatView.offsetWidth;

  if (
    !cancelled &&
    gesture.delta > 50
  ) {
    const elapsed =
      performance.now() -
      gesture.startedAt;

    const remainingSelection =
      Math.max(
        0,
        SELECT_CLOSE_MS - elapsed
      );

    beginClose({
      showSelection:
        remainingSelection > 0,

      selectionDuration:
        remainingSelection
    });
  } else {
    setNavigationDuration(
      NAV_OPEN_MS
    );

    clearSwipeStyles();
    clearTimeout(selectionTimer);
    clearSelection();
  }
}

chatView.addEventListener(

  phone.classList.add("gate-active");

  setPanelVisible(
    $("profileGate"),
    true

  $("gateRole").value = "student";
  $("gateClass").classList.remove(
    "hidden-element"
  );

  $("gatePassword").classList.add(
    "hidden-element"
  );

  $("gateError").classList.add(
    "hidden-element"
  );
}


function hideProfileGate() {
  phone.classList.remove("gate-active");

  setPanelVisible(
    $("profileGate"),
    false
  );
}

  "change",
  () => {
    const teacher =
      $("gateRole").value === "teacher";

    $("gateClass").classList.toggle(
      "hidden-element",
      teacher
    );

    $("gatePassword").classList.toggle(
      "hidden-element",
      !teacher
    );

    $("gateError").classList.add(
      "hidden-element"
    );
  }
);


$("gateConfirmBtn").addEventListener(
  "click",
  () => {
    const firstName =
      $("gateFirstName").value.trim();

    const lastName =
      $("gateLastName").value.trim();

    const role =
      $("gateRole").value;

    const studentClass =
      $("gateClass").value;

    const password =
      $("gatePassword").value;

    const error =
      $("gateError");

    error.classList.add(
      "hidden-element"
    );


    if (!firstName || !lastName) {
      error.textContent =
        "Bitte Vorname und Nachname ausfüllen.";

      error.classList.remove(
        "hidden-element"
      );

      return;
    }


    if (role === "student" && !studentClass) {
      error.textContent =
        "Bitte wähle deine Klasse aus.";

      error.classList.remove(
        "hidden-element"
      );

      return;
    }


    if (
      role === "teacher" &&
      password !== "84307"
    ) {
      error.textContent =
        "Das Passwort ist nicht korrekt.";

      error.classList.remove(
        "hidden-element"
      );

      return;
    }


    saveProfile({
      firstName,
      lastName,
      class:
        role === "teacher"
          ? ""
          : studentClass
    });


    if (role === "teacher") {
      frankUnlocked = true;
    }


    blurActive();
    hideProfileGate();
  }
);
