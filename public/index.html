<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
/>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CWE Chat" />

<title>CWE Chat</title>

<link rel="preload" as="image" href="Startbildschirm.png" />
<link rel="preload" as="image" href="Logo-sw.png" />

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
/>

<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
></script>

<style>
:root {
  --bg: #0a0a0a;
  --chat: #101010;
  --profile: #18222c;
  --input: #282828;
  --user: #04488f;
  --bot: #242625;
  --text: #ffffff;
  --dim: #8e8e93;
  --blue: #007aff;
  --ticks: #34b7f1;
  --nav-duration: 320ms;
  --nav-easing: cubic-bezier(0.25, 1, 0.5, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  position: fixed;
  inset: 0;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 16px var(--font);
  overscroll-behavior: none;
}

button,
input,
select {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

.input-field,
.input-field:focus,
.input-field:focus-visible {
  outline: none;
  border: none;
  box-shadow: none;
}

[hidden],
.hidden-element {
  display: none !important;
}

.phone {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: auto;
  max-width: 600px;
  overflow: hidden;
  background: var(--bg);
  isolation: isolate;
}

.phone.standalone-rest {
  top: 0;
  bottom: 0;
  height: auto;
}

#splashOverlay {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--bg);
  opacity: 1;
  pointer-events: none !important;
  transition: opacity 0.4s ease;
}

#splashOverlay * {
  pointer-events: none !important;
}

#splashGraphic {
  max-height: 240px;
  max-width: 80%;
  object-fit: contain;
  opacity: 0;
  transform: translate3d(0, 0, 0);
  user-select: none;
}

#splashOverlay.splash-ready #splashGraphic {
  animation: splashMotion 2s linear forwards;
}

@keyframes splashMotion {
  0% {
    opacity: 0;
    transform: translate3d(0, 0, 0);
  }
  25% {
    opacity: 1;
    transform: translate3d(0, -6.5px, 0);
  }
  80% {
    opacity: 1;
    transform: translate3d(0, -20.8px, 0);
  }
  100% {
    opacity: 0;
    transform: translate3d(0, -26px, 0);
  }
}

#splashOverlay.fade-out {
  opacity: 0;
}

#chatListView,
#chatWindowView {
  position: absolute;
  inset: 0;
  min-height: 0;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

#chatListView {
  z-index: 40;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  transform: translate3d(0, 0, 0);
  opacity: 1;
  transition:
    transform var(--nav-duration) var(--nav-easing),
    opacity var(--nav-duration) ease;
  will-change: transform, opacity;
}

#chatListView.in-background {
  transform: translate3d(-20%, 0, 0);
  opacity: 0.6;
  pointer-events: none;
}

#chatWindowView {
  z-index: 50;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--chat);
  transform: translate3d(100%, 0, 0);
  transition: transform var(--nav-duration) var(--nav-easing);
  will-change: transform;
  visibility: hidden;
  pointer-events: none;
}

#chatWindowView.is-visible {
  visibility: visible;
}

#chatWindowView.active-chat {
  transform: translate3d(0, 0, 0);
  pointer-events: auto;
}

.wa-list-header {
  flex: 0 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.wa-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 42px;
}

.wa-title {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 32px;
  flex-shrink: 0;
}

.header-logo-group img {
  height: 32px;
  width: auto;
  object-fit: contain;
}

.header-logo-group svg {
  display: block;
  width: 32px;
  height: 32px;
  fill: #ffffff;
}

.wa-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: #1c1c1e;
}

.wa-search-box svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  fill: var(--dim);
}

.wa-search-box input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}

.wa-chat-items {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.wa-chat-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: none;
  border-bottom: 0.5px solid #1c1c1e;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background 0.08s ease;
}

.wa-chat-item.selected-tap,
.wa-chat-item:active {
  background: #2c2c2e;
}

.avatar-wrap {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
}

.avatar-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.wa-chat-item .name {
  font-size: 17px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.time {
  font-size: 13px;
  color: var(--dim);
  flex-shrink: 0;
}

.role-subtitle {
  font-size: 13px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.info-bottom {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 18px;
  overflow: hidden;
  color: var(--dim);
  font-size: 14px;
}

.ticks-preview {
  display: inline-flex;
  flex-shrink: 0;
}

.ticks-preview svg,
.wa-blue-check svg {
  display: block;
  width: 15px;
  height: 15px;
  fill: var(--ticks);
}

.last-msg {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-chat-topbar {
  grid-row: 1;
  grid-column: 1;
  position: relative;
  z-index: 20;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: max(16px, env(safe-area-inset-top)) 12px 10px;
  border-bottom: 0.5px solid #1c1c1e;
  background: var(--bg);
}

.wa-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.wa-back-btn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
  border-radius: 50%;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
  background: var(--profile);
  cursor: pointer;
}

.wa-back-btn svg {
  width: 22px;
  height: 22px;
  fill: #ffffff;
}

.wa-topbar-profile {
  flex: 1;
  min-width: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 14px 4px 4px;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  background: var(--profile);
}

.wa-topbar-profile img {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.wa-topbar-info {
  min-width: 0;
}

.wa-topbar-info .name,
.wa-topbar-info .role {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.wa-topbar-info .name {
  font-size: 15px;
  font-weight: 600;
}

.wa-topbar-info .role {
  font-size: 11px;
  color: var(--dim);
}

.wa-messages-area {
  grid-row: 2;
  grid-column: 1;
  position: relative;
  z-index: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px;
  padding-bottom: var(--composer-reserve, 12px);
}

.wa-date-pill {
  align-self: center;
  flex-shrink: 0;
  padding: 5px 12px;
  margin: 10px 0;
  border-radius: 8px;
  background: #161616;
  font-size: 12px;
  font-weight: 600;
}

.wa-msg-bubble {
  max-width: 92%;
  min-width: 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 12px 6px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.38;
}

.wa-msg-bubble.user {
  align-self: flex-end;
  background: var(--user);
  border-bottom-right-radius: 4px;
}

.wa-msg-bubble.bot {
  align-self: flex-start;
  background: var(--bot);
  border-bottom-left-radius: 4px;
}

.wa-msg-bubble.error {
  border: 1px solid rgba(255, 100, 100, 0.5);
}

.wa-msg-text {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.wa-prose {
  white-space: pre-wrap;
}

.wa-formula-frame {
  min-width: 0;
  max-width: 100%;
  margin: 1.25em 0;
}

.wa-formula {
  display: block;
  min-width: 0;
  max-width: 100%;
  padding: 0.45em 0.15em 0.65em;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  word-break: normal;
  overflow-wrap: normal;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.wa-formula::-webkit-scrollbar {
  display: none;
}

.wa-formula-content {
  display: inline-block;
  min-width: max-content;
  vertical-align: top;
}

.wa-formula .katex-display {
  margin: 0;
  text-align: left;
}

.wa-formula .katex-display > .katex {
  text-align: left;
}

.wa-formula .katex {
  font-size: 1em;
}

.wa-formula .katex .text,
.wa-formula .katex .text .textrm {
  font-family: var(--font);
}

.wa-formula-fallback {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #ffd59a;
}

.formula-scrollbar {
  position: relative;
  height: 14px;
  margin-top: 3px;
  border-radius: 7px;
  background: rgba(0, 122, 255, 0.18);
  cursor: pointer;
  touch-action: none;
}

.formula-scroll-thumb {
  position: absolute;
  left: 0;
  top: 3px;
  height: 8px;
  min-width: 28px;
  border-radius: 5px;
  background: var(--blue);
  box-shadow: 0 0 5px rgba(0, 122, 255, 0.28);
  pointer-events: none;
}

.formula-scrollbar:focus-visible {
  outline: 2px solid #8dc5ff;
  outline-offset: 3px;
}

.wa-msg-meta {
  align-self: flex-end;
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 2px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.65);
}

.wa-msg-bubble.bot .wa-msg-meta {
  color: var(--dim);
}

.wa-doc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-wrap: anywhere;
}

.wa-doc-icon {
  font-size: 22px;
}

.wa-img-preview {
  max-width: 100%;
  max-height: 400px;
  object-fit: contain;
  border-radius: 10px;
}

.web-citation {
  display: inline;
  color: #9ccaff;
  font-size: 0.85em;
  text-decoration: none;
  white-space: nowrap;
}

.web-sources {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 12px;
}

.web-sources a {
  color: #9ccaff;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.technical-warning {
  margin-top: 8px;
  color: #ffd59a;
  font-size: 12px;
  white-space: pre-wrap;
}

.wa-typing {
  align-self: flex-start;
  flex-shrink: 0;
  display: flex;
  gap: 5px;
  padding: 10px 14px;
  border-radius: 14px 14px 14px 4px;
  background: var(--bot);
}

.wa-typing-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dim);
  animation: bounce 1.2s infinite ease-in-out;
}

.wa-typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.wa-typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/*
  Eigene, direkt am Dokument befestigte Eingabeebene.
  Sie befindet sich nicht mehr im transformierten Einzelchat.
*/
.wa-composer {
  position: fixed;
  left: 0;
  bottom: 20px;
  z-index: 100;
  width: 100%;
  max-width: 600px;
  min-width: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 10px 0;
  border-top: 0.5px solid #1c1c1e;
  background: var(--bg);
  pointer-events: none;
  visibility: hidden;
  transform: translate3d(100%, 0, 0);
  transition: transform var(--nav-duration) var(--nav-easing);
  will-change: transform;
  isolation: isolate;
}

.wa-composer.composer-visible {
  visibility: visible;
}

.wa-composer.composer-active {
  transform: translate3d(0, 0, 0);
  pointer-events: auto;
}

.wa-composer.keyboard-open {
  padding-top: 8px;
  padding-bottom: 6px;
}

.wa-composer .wa-input-pill,
.wa-composer .input-field {
  pointer-events: inherit;
}

.wa-action-icon-btn,
.wa-mic-btn,
.wa-send-btn {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: none;
  padding: 0;
  cursor: pointer;
}

.wa-action-icon-btn {
  background: transparent;
  color: var(--dim);
}

.wa-action-icon-btn svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}

.wa-mic-btn,
.wa-send-btn {
  border-radius: 50%;
  background: var(--blue);
  color: #ffffff;
}

.wa-mic-btn svg,
.wa-send-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.wa-mic-btn.recording {
  background: var(--blue);
  box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.22);
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

.wa-input-pill {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 38px;
  padding: 8px 12px;
  border-radius: 20px;
  background: var(--input);
}

.input-field {
  width: 100%;
  min-height: 22px;
  max-height: 100px;
  overflow-y: auto;
  color: var(--text);
  font-size: 16px;
  line-height: 1.35;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
  -webkit-user-select: text;
}

.input-field:empty::before {
  content: attr(placeholder);
  color: var(--dim);
  pointer-events: none;
}

.drift-sparks-wrap {
  position: relative;
  display: inline;
}

.drift-sparks-wrap::after {
  content: "";
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(
    90deg,
    rgba(0, 122, 255, 0.2),
    var(--blue),
    #8bd5ff,
    #007aff
  );
  box-shadow:
    0 0 6px var(--blue),
    0 2px 10px #39a9ff;
  animation: sparkShake 0.15s infinite alternate ease-in-out;
}

@keyframes sparkShake {
  from {
    transform: translateY(0) scaleX(0.98);
    opacity: 0.85;
  }
  to {
    transform: translateY(1px) scaleX(1.02);
    opacity: 1;
  }
}

.voice-cursor {
  display: inline-block;
  width: 3px;
  height: 1.25em;
  margin-left: 2px;
  vertical-align: -2px;
  border-radius: 2px;
  background: var(--blue);
  box-shadow: 0 0 8px var(--blue);
  animation: cursorPulse 0.4s infinite alternate ease-in-out;
}

@keyframes cursorPulse {
  from {
    background: var(--blue);
    box-shadow: 0 0 6px var(--blue);
  }
  to {
    background: #8bd5ff;
    box-shadow: 0 0 12px #39a9ff;
  }
}

.voice-inline-mic {
  display: inline-flex;
  width: 19px;
  height: 19px;
  margin-left: 4px;
  align-items: center;
  justify-content: center;
  vertical-align: -2px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 2px 8px rgba(0, 122, 255, 0.5);
}

.voice-inline-mic svg {
  width: 11px;
  height: 11px;
  fill: #ffffff;
}

.wa-prompt-container {
  grid-row: 2;
  grid-column: 1;
  position: relative;
  z-index: 2;
  min-height: 0;
  min-width: 0;
  overflow-y: auto;
  padding: 24px;
  text-align: center;
}

.wa-prompt-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin: auto;
  padding: 24px 20px;
  border: 1px solid #1e2833;
  border-radius: 16px;
  background: var(--bg);
}

.wa-prompt-card h3 {
  margin: 0;
  font-size: 18px;
}

.wa-prompt-card p {
  margin: 0;
  font-size: 14px;
  line-height: 1.4;
  color: var(--dim);
}

.wa-prompt-input,
.wa-prompt-select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #1e2833;
  border-radius: 10px;
  background: #282828;
  color: var(--text);
  font-size: 16px;
}

.wa-prompt-btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: var(--blue);
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.prompt-error {
  color: #ff7068;
  font-size: 14px;
}

#frankNameFields {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.wa-chat-items,
.wa-messages-area,
.input-field,
.wa-prompt-container {
  scrollbar-color: var(--blue) #000000;
  scrollbar-width: thin;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: #000000;
}

::-webkit-scrollbar-thumb {
  background: var(--blue);
  border-radius: 3px;
}

@media (max-width: 380px) {
  .wa-chat-topbar .header-logo-group {
    gap: 5px;
  }

  .wa-chat-topbar .header-logo-group img,
  .wa-chat-topbar .header-logo-group svg {
    height: 25px;
  }

  .wa-chat-topbar .header-logo-group svg {
    width: 25px;
  }

  .wa-composer {
    gap: 6px;
    padding-left: 6px;
    padding-right: 6px;
  }

  .wa-mic-btn,
  .wa-send-btn {
    width: 34px;
    height: 34px;
  }
}

@media (prefers-reduced-motion: reduce) {

function escapeHtml(value) {
  const element = document.createElement("div");

function dateKey(value) {
  const date = new Date(value);

}

function dateLabel(value) {
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);

  if (dateKey(value) === dateKey(today)) return "Heute";

}

  const overlay = $("splashOverlay");
  const image = $("splashGraphic");

  if (!overlay || !image) return;

  try {
    if (typeof image.decode === "function") {
      await Promise.race([
        image.decode(),
        new Promise(resolve => setTimeout(resolve, 2000))
      ]);
    }
  } catch {}

  if (!image.naturalWidth && image.complete) {
    overlay.remove();
    return;
  }

  requestAnimationFrame(() => {
    if (!overlay.isConnected) return;

    overlay.classList.add("splash-ready");

    if (!reducedMotion.matches) {
      setTimeout(() => {
        if (overlay.isConnected) {
          overlay.classList.add("fade-out");
        }
      }, 1600);
    }

    setTimeout(() => overlay.remove(), 2000);
  });
}

function splitSegments(text) {
  const result = [];
  const delimiters = [
    { open: "\\(", close: "\\)" },
    { open: "\\[", close: "\\]" },
    { open: "$$", close: "$$" }
  ];

  let cursor = 0;

  while (cursor < text.length) {
    let next = null;

    for (const delimiter of delimiters) {
      const start = text.indexOf(delimiter.open, cursor);

      if (start !== -1 && (!next || start < next.start)) {
        next = { ...delimiter, start };
      }
    }

    if (!next) {
      result.push({ type: "text", value: text.slice(cursor) });
      break;
    }

    if (next.start > cursor) {
      result.push({
        type: "text",
        value: text.slice(cursor, next.start)
      });
    }

    const start = next.start + next.open.length;
    const end = text.indexOf(next.close, start);

    if (end === -1) {
      result.push({
        type: "text",
        value: text.slice(next.start)
      });
      break;
    }

    result.push({
      type: "math",
      value: text.slice(start, end)
    });

    cursor = end + next.close.length;
  }

  return result;
}

function normalizeProse(text) {
  return text.replace(
    /(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)[ \t]*(?:EUR\b|Euro\b|€)/gi,
    (match, value) => {
      const number = Number(
        value.replace(/\./g, "").replace(",", ".")
      );

      return Number.isFinite(number)
        ? number.toLocaleString("de-DE", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }) + " EUR"
        : match;
    }
  ).replace(
    /(\d)[ \t]*(EUR\b|Euro\b|€|Stück\b|kg\b|cm\b|mm\b|km\b|Prozent\b|%)/gi,
    (match, number, unit) =>
      `${number} ${/^(euro|€)$/i.test(unit) ? "EUR" : unit}`
  );
}

function proseHtml(text, sources) {
  const html = escapeHtml(normalizeProse(text))
    .replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<strong>$1</strong>")
    .replace(/(?<![\w_])_([^_\n]+)_(?![\w_])/g, "<em>$1</em>")
    .replace(/~([^~\n]+)~/g, "<del>$1</del>");

  return html.replace(/\[(\d+)\]/g, (match, number) => {
    const source = sources.find(
      item => item.id === Number(number)
    );

    const url = source && safeUrl(source.url);
    if (!url) return match;

    return (
      `<a class="web-citation" ` +
      `href="${escapeHtml(url)}" ` +
      `target="_blank" rel="noopener noreferrer" ` +
      `title="${escapeHtml(source.title || url)}">` +
      `[${number}]</a>`
    );
  });
}

function installFormulaScrollbar(viewport, content, track, thumb) {
  let dead = false;
  let drag = null;

  function update() {
    if (dead || !viewport.isConnected) return;

    const maximum = Math.max(
      0,
      viewport.scrollWidth - viewport.clientWidth
    );

    const overflows = maximum > 2;

    track.classList.toggle("hidden-element", !overflows);
    viewport.tabIndex = overflows ? 0 : -1;

    if (!overflows) return;

    const width = track.clientWidth;

    const thumbWidth = Math.min(
      width,
      Math.max(
        28,
        width * viewport.clientWidth / viewport.scrollWidth
      )
    );

    const travel = Math.max(0, width - thumbWidth);

    thumb.style.width = `${thumbWidth}px`;
    thumb.style.transform =
      `translateX(${travel * viewport.scrollLeft / maximum}px)`;

    track.setAttribute(
      "aria-valuemax",
      String(Math.round(maximum))
    );
    track.setAttribute(
      "aria-valuenow",
      String(Math.round(viewport.scrollLeft))
    );
    track.setAttribute(
      "aria-valuetext",
      `${Math.round(100 * viewport.scrollLeft / maximum)} Prozent`
    );
  }

  function pointToScroll(x) {
    const rect = track.getBoundingClientRect();
    const maximum =
      viewport.scrollWidth - viewport.clientWidth;

    const thumbWidth =
      thumb.getBoundingClientRect().width;

    const travel = Math.max(
      1,
      rect.width - thumbWidth
    );

    viewport.scrollLeft =
      Math.max(
        0,
        Math.min(
          1,
          (x - rect.left - thumbWidth / 2) / travel
        )
      ) * maximum;

    update();
  }

  track.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;

    event.preventDefault();

    const rect = thumb.getBoundingClientRect();

    if (
      event.clientX < rect.left ||
      event.clientX > rect.right
    ) {
      pointToScroll(event.clientX);
    }

    drag = {
      x: event.clientX,
      scroll: viewport.scrollLeft
    };

    track.setPointerCapture(event.pointerId);
  });

  track.addEventListener("pointermove", event => {
    if (!drag) return;

    const travel = Math.max(
      1,
      track.clientWidth -
      thumb.getBoundingClientRect().width
    );

    viewport.scrollLeft =
      drag.scroll +
      (event.clientX - drag.x) *
      (
        viewport.scrollWidth -
        viewport.clientWidth
      ) / travel;

    update();
  });

  for (const name of [
    "pointerup",
    "pointercancel",
    "lostpointercapture"
  ]) {
    track.addEventListener(name, () => {
      drag = null;
    });
  }

  track.addEventListener("keydown", event => {
    const amount = Math.max(
      40,
      viewport.clientWidth * 0.4
    );

    if (event.key === "ArrowRight") {
      viewport.scrollLeft += amount;
    } else if (event.key === "ArrowLeft") {
      viewport.scrollLeft -= amount;
    } else if (event.key === "Home") {
      viewport.scrollLeft = 0;
    } else if (event.key === "End") {
      viewport.scrollLeft = viewport.scrollWidth;
    } else {
      return;
    }

    event.preventDefault();
    update();
  });

  viewport.addEventListener("scroll", update, {
    passive: true
  });

  const observer = window.ResizeObserver
    ? new ResizeObserver(update)
    : null;

  observer?.observe(viewport);
  observer?.observe(content);

  window.addEventListener("resize", update);
  requestAnimationFrame(update);

  document.fonts?.ready.then(() => {
    if (!dead) update();
  });

  formulaCleanups.add(() => {
    dead = true;
    observer?.disconnect();
    window.removeEventListener("resize", update);
    viewport.removeEventListener("scroll", update);
  });
}

function appendFormula(container, latex) {
  const frame = document.createElement("div");
  frame.className = "wa-formula-frame";

  const viewport = document.createElement("div");
  viewport.className = "wa-formula";
  viewport.id = `formula-${++formulaSequence}`;
  viewport.setAttribute(
    "aria-label",
    "Formel, bei Überbreite horizontal scrollbar"
  );

  const content = document.createElement("div");
  content.className = "wa-formula-content";

  try {
    if (!window.katex) {
      throw new Error("KaTeX nicht geladen");
    }

    window.katex.render(latex, content, {
      displayMode: true,
      throwOnError: true,
      trust: false,
      strict: "warn",
      output: "htmlAndMathml"
    });
  } catch (error) {
    content.classList.add("wa-formula-fallback");
    content.textContent = latex;
    console.warn("Formeldarstellung:", error.message);
  }

  const track = document.createElement("div");
  track.className = "formula-scrollbar hidden-element";
  track.tabIndex = 0;
  track.setAttribute("role", "scrollbar");
  track.setAttribute("aria-label", "Formel horizontal verschieben");
  track.setAttribute("aria-orientation", "horizontal");
  track.setAttribute("aria-controls", viewport.id);
  track.setAttribute("aria-valuemin", "0");
  track.setAttribute("aria-valuemax", "0");
  track.setAttribute("aria-valuenow", "0");

  const thumb = document.createElement("div");
  thumb.className = "formula-scroll-thumb";

  track.appendChild(thumb);
  viewport.appendChild(content);
  frame.append(viewport, track);
  container.appendChild(frame);

  installFormulaScrollbar(
    viewport,
    content,
    track,
    thumb
  );
}

function renderContent(container, text, sources = []) {
  const segments = splitSegments(String(text || ""));

  segments.forEach((segment, index) => {
    if (segment.type === "math") {
      appendFormula(container, segment.value);
      return;
    }

    let value = segment.value;

    if (segments[index - 1]?.type === "math") {
      value = value.replace(
        /^[ \t]*\.(?=[ \t\r\n]|$)/,
        ""
      );

      value = value.replace(
        /^[ \t]*\r?\n(?:[ \t]*\r?\n)*/,
        ""
      );
    }

    if (segments[index + 1]?.type === "math") {
      value = value.replace(
        /(?:\r?\n[ \t]*)+$/,
        ""
      );
    }

    if (!value) return;

    const span = document.createElement("span");
    span.className = "wa-prose";
    span.innerHTML = proseHtml(value, sources);
    container.appendChild(span);
  });
}

function nearBottom() {
  return (
    messagesDiv.scrollHeight -
    messagesDiv.scrollTop -
    messagesDiv.clientHeight
  ) < 100;
}

function toBottom() {
  requestAnimationFrame(() => {
    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;
  });
}

function positionComposer(viewport, width, left, keyboardOpen) {
  const containerWidth = Math.min(600, width);

  composer.style.width = `${containerWidth}px`;
  composer.style.left =
    `${left + Math.max(0, (width - containerWidth) / 2)}px`;

  composer.classList.toggle(
    "keyboard-open",
    keyboardOpen
  );

  if (keyboardOpen) {
    const visibleTop = viewport?.offsetTop || 0;
    const visibleHeight =
      viewport?.height || window.innerHeight;

    const composerHeight = composer.hidden
      ? 0
      : composer.offsetHeight;

    composer.style.bottom = "auto";
    composer.style.top =
      `${Math.max(visibleTop, visibleTop + visibleHeight - composerHeight)}px`;
  } else {
    composer.style.top = "auto";
    composer.style.bottom =
      `${COMPOSER_BOTTOM_GAP}px`;
  }

  if (!composer.hidden && contentVisible) {
    const phoneRect = phone.getBoundingClientRect();
    const composerRect = composer.getBoundingClientRect();

    const overlap = Math.max(
      0,
      phoneRect.bottom - composerRect.top
    );

    messagesDiv.style.setProperty(
      "--composer-reserve",
      `${overlap + 12}px`
    );
  } else {
    messagesDiv.style.setProperty(
      "--composer-reserve",
      "12px"
    );
  }
}

function syncViewport() {
  viewportFrame = 0;

  const viewport = window.visualViewport;

  const width =
    viewport?.width || window.innerWidth;

  const visibleHeight =
    viewport?.height || window.innerHeight;

  const viewportTop = Math.max(
    0,
    viewport?.offsetTop || 0
  );

  const viewportLeft = Math.max(
    0,
    viewport?.offsetLeft || 0
  );

  const scale = viewport?.scale || 1;
  const normalScale = Math.abs(scale - 1) < 0.05;

  const standalone =
    standaloneDisplay.matches ||
    navigator.standalone === true;

  const active = document.activeElement;

  const editing = Boolean(
    active &&
    (
      active.matches(
        "input:not([type='file']), textarea, select"
      ) ||
      active.isContentEditable
    )
  );

  if (
    !baselineWidth ||
    Math.abs(width - baselineWidth) > 100
  ) {
    baselineWidth = width;
    baselineHeight = visibleHeight;
  }

  if (!editing && normalScale) {
    baselineHeight = Math.max(
      baselineHeight,
      visibleHeight
    );
  }

  const keyboardReference = Math.max(
    baselineHeight,
    window.innerHeight,
    document.documentElement.clientHeight
  );

  const keyboardOpen =
    normalScale &&
    keyboardReference - visibleHeight > 120;

  keyboardCurrentlyOpen = keyboardOpen;

  const useStandaloneRest =
    standalone &&
    normalScale &&
    !keyboardOpen;

  const containerWidth = Math.min(600, width);

  phone.style.width = `${containerWidth}px`;
  phone.style.left =
    `${viewportLeft + Math.max(0, (width - containerWidth) / 2)}px`;

  phone.classList.toggle(
    "keyboard-open",
    keyboardOpen
  );

  phone.classList.toggle(
    "standalone-rest",
    useStandaloneRest
  );

  if (useStandaloneRest) {
    phone.style.top = "0px";
    phone.style.bottom = "0px";
    phone.style.height = "auto";
  } else {
    phone.style.top = `${viewportTop}px`;
    phone.style.bottom = "auto";
    phone.style.height = `${visibleHeight}px`;
  }

  positionComposer(
    viewport,
    width,
    viewportLeft,
    keyboardOpen
  );

  if (
    currentPerson &&
    followBottom &&
    !messagesDiv.hidden
  ) {
    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;
  }
}

function scheduleViewport() {
  if (!viewportFrame) {
    viewportFrame = requestAnimationFrame(
      syncViewport
    );
  }
}

function settleViewport() {
  scheduleViewport();

  for (const timer of viewportTimers) {
    clearTimeout(timer);
  }

  viewportTimers.clear();

  for (const delay of [80, 180, 350, 600, 900]) {
    const timer = setTimeout(() => {
      viewportTimers.delete(timer);
      scheduleViewport();
    }, delay);

    viewportTimers.add(timer);
  }
}

function installViewport() {
  const viewport = window.visualViewport;

  viewport?.addEventListener("resize", scheduleViewport);
  viewport?.addEventListener("scroll", scheduleViewport);

  standaloneDisplay.addEventListener?.("change", () => {
    baselineHeight = 0;
    baselineWidth = 0;
    settleViewport();
  });

  window.addEventListener("resize", settleViewport);
  window.addEventListener("scroll", scheduleViewport, {
    passive: true
  });
  window.addEventListener("pageshow", settleViewport);

  window.addEventListener("orientationchange", () => {
    baselineHeight = 0;
    baselineWidth = 0;
    settleViewport();
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) settleViewport();
  });

  document.addEventListener("focusin", event => {
    followBottom =
      event.target === input &&
      nearBottom();

    settleViewport();
  });

  document.addEventListener("focusout", settleViewport);

  messagesDiv.addEventListener("touchstart", () => {
    followBottom = false;
  }, { passive: true });

  messagesDiv.addEventListener("wheel", () => {
    followBottom = false;
  }, { passive: true });

  if (window.ResizeObserver) {
    const composerObserver = new ResizeObserver(() => {
      scheduleViewport();
    });

    composerObserver.observe(composer);
  }

  syncViewport();
}

function renderMessages(person) {
  if (currentPerson !== person) return;

  for (const cleanup of formulaCleanups) {
    cleanup();
  }

  formulaCleanups.clear();
  messagesDiv.replaceChildren();

  let previousDate = null;

  for (const message of histories[person]) {
    const key = dateKey(message.timestamp);

    if (key !== previousDate) {
      const pill = document.createElement("div");
      pill.className = "wa-date-pill";
      pill.textContent = dateLabel(message.timestamp);
      messagesDiv.appendChild(pill);
      previousDate = key;
    }

    const bubble = document.createElement("div");
    bubble.className =
      `wa-msg-bubble ${message.who}` +
      (message.isError ? " error" : "");

    if (message.type === "text") {
      const text = document.createElement("div");
      text.className = "wa-msg-text";

      renderContent(
        text,
        message.text,
        message.sources || []
      );

      bubble.appendChild(text);
    } else if (message.type === "image") {
      const image = document.createElement("img");
      image.className = "wa-img-preview";
      image.src = message.imageSrc;
      image.alt = message.fileName || "Bild";
      bubble.appendChild(image);
    } else {
      const row = document.createElement("div");
      row.className = "wa-doc-row";

      const icon = document.createElement("span");
      icon.className = "wa-doc-icon";
      icon.textContent = "📄";

      const name = document.createElement("span");
      name.textContent = message.fileName;

      row.append(icon, name);
      bubble.appendChild(row);
    }

    if (message.sources?.length) {
      const box = document.createElement("div");
      box.className = "web-sources";

      for (const source of message.sources) {
        const url = safeUrl(source.url);
        if (!url) continue;

        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        link.textContent =
          `[${source.id}] ` +
          (
            source.title ||
            new URL(url).hostname
          );

        box.appendChild(link);
      }

      bubble.appendChild(box);
    }

    if (message.warnings?.length) {
      const warning = document.createElement("div");
      warning.className = "technical-warning";

      warning.textContent = message.warnings
        .map(value => `ℹ️ ${value}`)
        .join("\n");

      bubble.appendChild(warning);
    }

    const meta = document.createElement("div");
    meta.className = "wa-msg-meta";
    meta.textContent = timeLabel(message.timestamp);

    if (message.who === "user") {
      const ticks = document.createElement("span");
      ticks.className = "wa-blue-check";
      ticks.innerHTML = ticksSvg;
      meta.appendChild(ticks);
    }

    bubble.appendChild(meta);
    messagesDiv.appendChild(bubble);
  }

  if (pending.has(person)) {
    const typing = document.createElement("div");
    typing.className = "wa-typing";
    typing.setAttribute(
      "aria-label",
      "Antwort wird erstellt"
    );

    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("div");
      dot.className = "wa-typing-dot";
      typing.appendChild(dot);
    }

    messagesDiv.appendChild(typing);
  }

  scheduleViewport();
  toBottom();
}

function updatePreview(person, text, timestamp) {
  $(`preview-${person}`).textContent = text;
  $(`time-${person}`).textContent = timeLabel(timestamp);

  $(`ticks-${person}`)
    .classList.remove("hidden-element");

  items.prepend(
    items.querySelector(
      `[data-person="${person}"]`
    )
  );
}

function updateComposer() {
  const busy = currentPerson
    ? pending.has(currentPerson)
    : false;

  const hasText = (
    recording || speechStarting
      ? speechDraft
      : input.innerText
  ).trim().length > 0;

  micButton.disabled =
    busy || !currentPerson;

  sendButton.disabled =
    busy || !currentPerson || !hasText;

  uploadButton.disabled =
    busy || !currentPerson;

  fileInput.disabled =
    busy || !currentPerson;

  micButton.classList.toggle(
    "recording",
    recording || speechStarting
  );

  micButton.setAttribute(
    "aria-label",
    recording || speechStarting
      ? "Spracheingabe beenden"
      : "Spracheingabe starten oder ergänzen"
  );
}

function blurActive() {
  document.activeElement?.blur?.();
}

function showContent() {
  contentVisible = true;

  setPanelVisible($("passwordPrompt"), false);
  setPanelVisible($("studentPrompt"), false);
  setPanelVisible(messagesDiv, true);
  setPanelVisible(composer, true);

  syncComposerVisibility();
  renderMessages(currentPerson);
  updateComposer();
  settleViewport();
}

function hideChatContent() {
  contentVisible = false;

  setPanelVisible($("passwordPrompt"), false);
  setPanelVisible($("studentPrompt"), false);
  setPanelVisible(messagesDiv, false);
  setPanelVisible(composer, false);

  syncComposerVisibility();
}

function clearNavigationTimers() {
  clearTimeout(startTimer);
  clearTimeout(finishTimer);
}

function clearSelection() {
  items
    .querySelectorAll(".selected-tap")
    .forEach(item => {
      item.classList.remove("selected-tap");
    });
}

function highlightPerson(person) {
  clearTimeout(selectionTimer);
  clearSelection();

  if (person) {
    items
      .querySelector(
        `[data-person="${person}"]`
      )
      ?.classList.add("selected-tap");
  }
}

function startSelectionTimer(token, duration) {
  clearTimeout(selectionTimer);

  selectionTimer = setTimeout(() => {
    if (token === navigationToken) {
      clearSelection();
    }
  }, reducedMotion.matches ? 0 : duration);
}

function clearSwipeStyles() {
  for (const element of [chatView, listView, composer]) {
    element.style.removeProperty("transition");
    element.style.removeProperty("transform");
  }

  listView.style.removeProperty("opacity");
}

function finishOpen(token) {
  if (
    token !== navigationToken ||
    navigationState !== "opening"
  ) return;

  clearTimeout(finishTimer);
  navigationState = "chat";
  syncComposerVisibility();
}

function finishClose(token) {
  if (
    token !== navigationToken ||
    navigationState !== "closing"
  ) return;

  clearTimeout(finishTimer);

  chatView.classList.remove("is-visible");
  chatView.setAttribute("aria-hidden", "true");
  chatView.setAttribute("inert", "");

  listView.removeAttribute("inert");
  listView.setAttribute("aria-hidden", "false");

  navigationState = "list";

  clearSwipeStyles();
  setPanelVisible(composer, false);
  syncComposerVisibility();
}

function openChat(person) {
  if (navigationState !== "list") return;

  clearNavigationTimers();
  clearTimeout(selectionTimer);
  clearSwipeStyles();
  setNavigationDuration(NAV_OPEN_MS);

  const token = ++navigationToken;
  navigationState = "opening";

  blurActive();
  currentPerson = person;
  highlightPerson(person);

  $("chatName").textContent = profiles[person].name;
  $("chatRole").textContent = profiles[person].role;
  $("chatAvatar").src = profiles[person].avatar;

  hideChatContent();

  input.textContent = drafts[person];
  loadProfile();

  if (person === "frank" && !frankUnlocked) {
    setPanelVisible($("passwordPrompt"), true);

    $("passwordInput").value = "";
    $("passwordError").classList.add("hidden-element");

    $("frankNameFields").classList.toggle(
      "hidden-element",
      Boolean(userProfile)
    );
  } else if (person !== "frank" && !userProfile?.class) {
    setPanelVisible($("studentPrompt"), true);

    $("studentFirstNameInput").value =
      userProfile?.firstName || "";

    $("studentLastNameInput").value =
      userProfile?.lastName || "";

    $("studentClassSelect").value = "";
    $("studentError").classList.add("hidden-element");
  } else {
    showContent();
  }

  searchInput.disabled = true;

  chatView.removeAttribute("inert");
  chatView.classList.add("is-visible");
  chatView.setAttribute("aria-hidden", "false");

  followBottom = true;
  updateComposer();
  settleViewport();

  void chatView.offsetWidth;
  void composer.offsetWidth;

  startTimer = setTimeout(() => {
    if (
      token !== navigationToken ||
      navigationState !== "opening"
    ) return;

    clearSelection();

    listView.setAttribute("inert", "");
    listView.setAttribute("aria-hidden", "true");

    chatView.classList.add("active-chat");
    listView.classList.add("in-background");
    syncComposerVisibility();

    if (reducedMotion.matches) {
      finishOpen(token);
    } else {
      finishTimer = setTimeout(
        () => finishOpen(token),
        NAV_OPEN_MS + 80
      );
    }
  }, reducedMotion.matches ? 0 : SELECT_OPEN_MS);
}

function beginClose({
  showSelection = true,
  selectionDuration = SELECT_CLOSE_MS
} = {}) {
  if (
    navigationState === "list" ||
    navigationState === "closing"
  ) return;

  clearNavigationTimers();
  clearTimeout(selectionTimer);

  const token = ++navigationToken;
  const leavingPerson = currentPerson;

  stopRecording();

  if (leavingPerson) {
    drafts[leavingPerson] = input.innerText;
  }

  if (showSelection) {
    highlightPerson(leavingPerson);
    startSelectionTimer(token, selectionDuration);
  } else {
    clearSelection();
  }

  blurActive();

  navigationState = "closing";
  setNavigationDuration(NAV_CLOSE_MS);

  chatView.setAttribute("inert", "");
  composer.setAttribute("inert", "");

  chatView.classList.remove("active-chat");
  composer.classList.remove("composer-active");
  listView.classList.remove("in-background");

  clearSwipeStyles();

  searchInput.disabled = false;
  currentPerson = null;
  followBottom = false;

  updateComposer();
  settleViewport();

  if (reducedMotion.matches) {
    finishClose(token);
  } else {
    finishTimer = setTimeout(
      () => finishClose(token),
      NAV_CLOSE_MS + 80
    );
  }
}

function backToList() {
  beginClose({
    showSelection: true,
    selectionDuration: SELECT_CLOSE_MS
  });
}

chatView.addEventListener("transitionend", event => {
  if (
    event.target !== chatView ||
    event.propertyName !== "transform"
  ) return;

  if (navigationState === "opening") {
    finishOpen(navigationToken);
  }

  if (navigationState === "closing") {
    finishClose(navigationToken);
  }
});

function buildMessages(person) {
  return histories[person]
    .filter(message => !message.isError)
    .map(message => {
      if (message.type === "image") {
        return {
          role: "user",
          content: [
            {
              type: "text",
              text: `[Bild: ${message.fileName}]`
            },
            {
              type: "image_url",
              image_url: {
                url: message.imageSrc
              }
            }
          ]
        };
      }

      if (message.type === "document") {
        return {
          role: "user",
          content:
            `[Dokument hochgeladen: ${message.fileName}]`
        };
      }

      return {
        role: message.who === "user"
          ? "user"
          : "assistant",
        content: message.text
      };
    });
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = () => {
      reject(
        new Error("Bild konnte nicht gelesen werden.")
      );
    };

    reader.readAsDataURL(file);
  });
}

async function sendMessage(file = null) {
  const person = currentPerson;

  if (!person || pending.has(person)) return;

  stopRecording();

  const text = input.innerText.trim();
  if (!text && !file) return;

  if (file && file.size > 15 * 1024 * 1024) {
    alert("Bitte eine Datei unter 15 MB verwenden.");
    return;
  }

  const timestamp = new Date();
  const previousInteraction = lastInteraction[person];

  pending.add(person);
  loadProfile();

  try {
    if (text) {
      histories[person].push({
        type: "text",
        text,
        who: "user",
        timestamp
      });
    }

    const apiHistory = buildMessages(person);

    input.textContent = "";
    drafts[person] = "";
    updateComposer();

    if (file) {
      const message = {
        type: file.type.startsWith("image/")
          ? "image"
          : "document",
        fileName: file.name,
        who: "user",
        timestamp
      };

      if (message.type === "image") {
        message.imageSrc = await readImage(file);
      }

      histories[person].push(message);
    }

    updatePreview(person, text || file.name, timestamp);
    renderMessages(person);

    const body = {
      person,
      messages: apiHistory,
      documents: documents[person],
      firstName: userProfile?.firstName || "",
      lastName: userProfile?.lastName || "",
      studentClass: userProfile?.class || "",
      lastInteractionAt: previousInteraction
    };

    let options;

    if (file) {
      const form = new FormData();
      form.append("file", file);

      for (const [key, value] of Object.entries(body)) {
        form.append(
          key,
          typeof value === "string"
            ? value
            : JSON.stringify(value)
        );
      }

      options = {
        method: "POST",
        body: form
      };
    } else {
      options = {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      };
    }

    const response = await fetch("/api/chat", options);
    const raw = await response.text();
    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        `Unlesbare Serverantwort (HTTP ${response.status}).`
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || `HTTP ${response.status}`
      );
    }

    if (typeof data.message?.content !== "string") {
      throw new Error(
        data.error || "Keine Textantwort erhalten."
      );
    }

    if (data.uploadedDocument) {
      documents[person] = [
        ...documents[person].filter(
          document =>
            document.id !== data.uploadedDocument.id
        ),
        data.uploadedDocument
      ].slice(-5);
    }

    const botTime = new Date();

    histories[person].push({
      type: "text",
      text: data.message.content,
      sources: data.message.sources || [],
      warnings: data.warnings || [],
      who: "bot",
      timestamp: botTime
    });

    lastInteraction[person] = botTime.getTime();

    updatePreview(person, data.message.content, botTime);
  } catch (error) {
    console.error("Chat-Anfrage:", error);

    const failedAt = new Date();

    histories[person].push({
      type: "text",
      text:
        "Die Antwort konnte nicht geladen werden.\n\n" +
        error.message,
      who: "bot",
      isError: true,
      timestamp: failedAt
    });

    updatePreview(
      person,
      "Antwort konnte nicht geladen werden.",
      failedAt
    );
  } finally {
    pending.delete(person);

    if (currentPerson === person) {
      renderMessages(person);
      updateComposer();
      scheduleViewport();
    }
  }
}

function drawSpeech(spokenText, active = true) {
  if (currentPerson !== recordingPerson) return;

  const base = recordingBase
    ? recordingBase + (spokenText ? " " : "")
    : "";

  speechDraft = base + spokenText;

  input.replaceChildren();
  input.appendChild(document.createTextNode(base));

  if (active && spokenText) {
    const characters = Array.from(spokenText);

    const before = characters
      .slice(0, Math.max(0, characters.length - 10))
      .join("");

    const last = characters.slice(-10).join("");

    input.appendChild(document.createTextNode(before));

    const highlight = document.createElement("span");
    highlight.className = "drift-sparks-wrap";
    highlight.textContent = last;
    input.appendChild(highlight);

    const cursor = document.createElement("span");
    cursor.className = "voice-cursor";
    cursor.contentEditable = "false";
    cursor.setAttribute("aria-hidden", "true");
    input.appendChild(cursor);
  } else {
    input.appendChild(
      document.createTextNode(spokenText)
    );

    const mic = document.createElement("span");
    mic.className = "voice-inline-mic";
    mic.contentEditable = "false";
    mic.setAttribute("aria-label", "Aufnahme läuft");

    mic.innerHTML =
      `<svg viewBox="0 0 24 24">` +
      `<path d="${micPath}"/></svg>`;

    input.appendChild(mic);
  }

  input.scrollTop = input.scrollHeight;
  updateComposer();
  scheduleViewport();
}

function finishSpeechDraft() {
  clearTimeout(silenceTimer);

  if (currentPerson === recordingPerson) {
    input.textContent = speechDraft;
    drafts[currentPerson] = speechDraft;
  }
}

function stopRecording() {
  if (
    !recognition &&
    !recording &&
    !speechStarting
  ) return;

  const instance = recognition;

  finishSpeechDraft();

  recognition = null;
  recording = false;
  speechStarting = false;
  recordingPerson = null;

  if (instance) {
    instance.onstart = null;
    instance.onresult = null;
    instance.onend = null;
    instance.onerror = null;

    try {
      instance.abort();
    } catch {}
  }

  updateComposer();
}

function focusInputAtEnd() {
  try {
    input.focus({ preventScroll: true });
  } catch {
    input.focus();
  }

  const selection = window.getSelection();

  if (selection) {
    const range = document.createRange();
    range.selectNodeContents(input);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
  }

  input.scrollTop = input.scrollHeight;
  settleViewport();
}

function handleInputDuringRecording(event) {
  if (
    !recognition &&
    !recording &&
    !speechStarting
  ) return;

  if (
    event.type === "pointerdown" &&
    event.button !== 0
  ) return;

  if (event.cancelable) {
    event.preventDefault();
  }

  stopRecording();
  focusInputAtEnd();
}

if ("PointerEvent" in window) {
  inputPill.addEventListener(
    "pointerdown",
    handleInputDuringRecording
  );
} else {
  inputPill.addEventListener(
    "touchstart",
    handleInputDuringRecording,
    { passive: false }
  );

  inputPill.addEventListener(
    "mousedown",
    handleInputDuringRecording
  );
}

function startRecording() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert(
      "Spracheingabe wird von diesem Browser nicht unterstützt."
    );
    return;
  }

  if (
    !currentPerson ||
    pending.has(currentPerson) ||
    recognition
  ) return;

  const instance = new Recognition();

  recognition = instance;
  recordingPerson = currentPerson;
  recordingBase = input.innerText.trim();
  speechDraft = recordingBase;
  speechStarting = true;

  instance.lang = "de-DE";
  instance.continuous = true;
  instance.interimResults = true;

  updateComposer();

  instance.onstart = () => {
    if (recognition !== instance) return;

    recording = true;
    speechStarting = false;
    drawSpeech("", false);
    updateComposer();
  };

  instance.onresult = event => {
    if (
      recognition !== instance ||
      currentPerson !== recordingPerson
    ) return;

    const parts = [];

    for (let i = 0; i < event.results.length; i++) {
      parts.push(
        event.results[i][0].transcript.trim()
      );
    }

    const spoken = parts.filter(Boolean).join(" ");

    drawSpeech(spoken, true);
    clearTimeout(silenceTimer);

    silenceTimer = setTimeout(() => {
      if (
        recognition === instance &&
        recording
      ) {
        drawSpeech(spoken, false);
      }
    }, 1200);
  };

  const finish = () => {
    if (recognition !== instance) return;

    finishSpeechDraft();

    recognition = null;
    recording = false;
    speechStarting = false;
    recordingPerson = null;

    updateComposer();
  };

  instance.onend = finish;

  instance.onerror = event => {
    finish();

    if (event.error === "not-allowed") {
      alert("Bitte den Mikrofonzugriff erlauben.");
    }
  };

  try {
    instance.start();
  } catch {
    finish();

    alert(
      "Spracheingabe konnte nicht gestartet werden."
    );
  }
}

$("backBtn").addEventListener("click", backToList);

sendButton.addEventListener("pointerdown", event => {
  if (document.activeElement === input) {
    event.preventDefault();
  }
});

sendButton.addEventListener("click", () => {
  followBottom = true;
  sendMessage();
});

micButton.addEventListener("click", () => {
  if (recording || speechStarting) {
    stopRecording();
  } else {
    startRecording();
  }
});

input.addEventListener("beforeinput", () => {
  if (recording || speechStarting) {
    stopRecording();
  }
});

input.addEventListener("input", () => {
  if (
    currentPerson &&
    !recording &&
    !speechStarting
  ) {
    drafts[currentPerson] = input.innerText;
  }

  updateComposer();
  scheduleViewport();
});

input.addEventListener("paste", event => {
  event.preventDefault();

  if (recording || speechStarting) {
    stopRecording();
  }

  const selection = window.getSelection();
  if (!selection?.rangeCount) return;

  const range = selection.getRangeAt(0);
  range.deleteContents();

  const node = document.createTextNode(
    event.clipboardData.getData("text/plain")
  );

  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);

  input.dispatchEvent(new Event("input"));
});

uploadButton.addEventListener("click", () => {
  stopRecording();
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  fileInput.value = "";

  if (file && currentPerson) {
    sendMessage(file);
  }
});

$("studentConfirmBtn").addEventListener("click", () => {
  const firstName =

  const lastName =
    $("studentLastNameInput").value.trim();

  const studentClass =
    $("studentClassSelect").value;

  if (!firstName || !lastName || !studentClass) {
    $("studentError")
      .classList.remove("hidden-element");
    return;
  }

  saveProfile({
    firstName,
    lastName,
    class: studentClass

  blurActive();

$("passwordConfirmBtn").addEventListener("click", () => {
  const error = $("passwordError");

  /*
    Bestehende Frontend-Freischaltung.
    Keine serverseitige Authentifizierung.
  */
  if ($("passwordInput").value !== "84307") {
    error.textContent = "Das Passwort ist nicht korrekt.";

  if (!userProfile) {

      $("frankFirstNameInput").value.trim();

      error.textContent =
        "Bitte Vorname und Nachname ausfüllen.";

      error.classList.remove("hidden-element");
      return;
    }

    saveProfile({
      firstName,
      lastName,
      class: ""
    });

  frankUnlocked = true;
  $("passwordInput").value = "";
  error.classList.add("hidden-element");

  blurActive();
  showContent();
});

$("passwordInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    $("passwordConfirmBtn").click();
  }
});

function normalizeSearch(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .trim();
}

searchInput.addEventListener("input", () => {
  const query = normalizeSearch(searchInput.value);

  items
    .querySelectorAll(".wa-chat-item")
    .forEach(item => {
      const person = item.dataset.person;
      const profile = profiles[person];

      const value = normalizeSearch([
        profile.name,
        profile.role,
        profile.desc,
        ...histories[person].map(
          message =>
            message.text ||
            message.fileName ||
            ""
        )
      ].join(" "));

      item.classList.toggle(
        "hidden-element",
        Boolean(query) &&
        !value.includes(query)
      );
    });
});

chatView.addEventListener("touchstart", event => {
  if (
    event.touches.length !== 1 ||
    navigationState !== "chat"
  ) return;

  const touch = event.touches[0];

  const localX =
    touch.clientX -
    phone.getBoundingClientRect().left;

  if (
    localX > 80 ||
    event.target.closest(
      ".wa-formula-frame, input, select, " +
      "[contenteditable], button, a"
    )
  ) {
    swipe = null;
    return;
  }

  swipe = {
    x: touch.clientX,
    y: touch.clientY,
    delta: 0,
    active: false,
    startedAt: 0
  };
}, { passive: true });

chatView.addEventListener("touchmove", event => {
  if (
    !swipe ||
    event.touches.length !== 1
  ) return;

  const touch = event.touches[0];
  const dx = touch.clientX - swipe.x;
  const dy = Math.abs(touch.clientY - swipe.y);

  if (!swipe.active) {
    if (dy > 12 && dy >= dx) {
      swipe = null;
      return;
    }

    if (dx < 10 || dx <= dy) return;

    swipe.active = true;
    swipe.startedAt = performance.now();

    highlightPerson(currentPerson);
    startSelectionTimer(
      navigationToken,
      SELECT_CLOSE_MS
    );
  }

  if (event.cancelable) {
    event.preventDefault();
  }

  swipe.delta = Math.max(
    0,
    Math.min(dx, phone.clientWidth)
  );

  const progress =
    swipe.delta / phone.clientWidth;

  for (const element of [chatView, listView, composer]) {
    element.style.transition = "none";
  }

  chatView.style.transform =
    `translate3d(${swipe.delta}px,0,0)`;

  composer.style.transform =
    `translate3d(${swipe.delta}px,0,0)`;

  listView.style.transform =
    `translate3d(${-20 + 20 * progress}%,0,0)`;

  listView.style.opacity =
    String(0.6 + 0.4 * progress);
}, { passive: false });

function endSwipe(cancelled = false) {
  if (!swipe) return;

  const gesture = swipe;
  swipe = null;

  if (!gesture.active) return;

  void chatView.offsetWidth;

  for (const element of [chatView, listView, composer]) {
    element.style.removeProperty("transition");
  }

  void chatView.offsetWidth;

  if (
    !cancelled &&
    gesture.delta > 50
  ) {
    const elapsed =
      performance.now() - gesture.startedAt;

    const remainingSelection = Math.max(
      0,
      SELECT_CLOSE_MS - elapsed
    );

    beginClose({
      showSelection: remainingSelection > 0,
      selectionDuration: remainingSelection
    });
  } else {
    setNavigationDuration(NAV_OPEN_MS);
    clearSwipeStyles();
    clearTimeout(selectionTimer);
    clearSelection();
  }
}

chatView.addEventListener(
  "touchend",
  () => endSwipe(false),
  { passive: true }
);

chatView.addEventListener(
  "touchcancel",
  () => endSwipe(true),
  { passive: true }
);

window.addEventListener("DOMContentLoaded", () => {
  if (currentPerson) {
    renderMessages(currentPerson);
  }

  settleViewport();
  startSplash();
});

loadProfile();
buildList();
updateComposer();
installViewport();
</script>
