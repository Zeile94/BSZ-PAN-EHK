<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
/>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CWE Chat" />
<title>CWE Chat</title>

<link rel="preload" as="image" href="Startbildschirm.png" />
<link rel="preload" as="image" href="Logo-sw.png" />

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
/>
<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
></script>

<style>
:root {
  --wa-bg: #0a0a0a;
  --wa-chat-bg: #101010;
  --wa-profile-bg: #18222c;
  --wa-input-bg: #282828;
  --wa-user: #04488f;
  --wa-bot: #242625;
  --wa-text: #ffffff;
  --wa-dim: #8e8e93;
  --wa-border: #1e2833;
  --wa-blue: #007aff;
  --wa-ticks: #34b7f1;
  --chat-transition: 0.32s cubic-bezier(0.25, 1, 0.5, 1);
  --chat-font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--wa-bg);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--wa-bg);
  color: var(--wa-text);
  font-family: var(--chat-font);
  font-size: 16px;
  overscroll-behavior: none;
}

button,
input,
select {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: 2px solid var(--wa-blue);
  outline-offset: 3px;
}

.phone {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--wa-bg);
  isolation: isolate;
}

#splashOverlay {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--wa-bg);
  pointer-events: none;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#splashOverlay.fade-out {
  opacity: 0;
  visibility: hidden;
}

#splashGraphic {
  max-height: 240px;
  max-width: 80%;
  object-fit: contain;
  user-select: none;
}

#chatListView,
#chatWindowView {
  position: absolute;
  inset: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

#chatListView {
  z-index: 40;
  background: var(--wa-bg);
  transform: translate3d(0, 0, 0);
  opacity: 1;
  transition:
    transform var(--chat-transition),
    opacity 0.32s ease;
  will-change: transform, opacity;
}

#chatListView.in-background {
  transform: translate3d(-20%, 0, 0);
  opacity: 0.6;
  pointer-events: none;
}

/*
  Beim Schließen bleibt der Einzelchat bis zum Animationsende sichtbar.
  Erst danach wird .is-visible entfernt.
*/
#chatWindowView {
  z-index: 50;
  background: var(--wa-chat-bg);
  transform: translate3d(100%, 0, 0);
  transition: transform var(--chat-transition);
  will-change: transform;
  visibility: hidden;
  pointer-events: none;
}

#chatWindowView.is-visible {
  visibility: visible;
}

#chatWindowView.active-chat {
  transform: translate3d(0, 0, 0);
  pointer-events: auto;
}

.wa-list-header {
  flex: 0 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.wa-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 42px;
  gap: 12px;
}

.wa-title {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1;
}

.header-logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 32px;
  flex-shrink: 0;
}

.header-logo-group img {
  height: 32px;
  width: auto;
  object-fit: contain;
}

.header-logo-group svg {
  display: block;
  width: 32px;
  height: 32px;
  fill: #ffffff;
}

.wa-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: #1c1c1e;
}

.wa-search-box svg {
  width: 18px;
  height: 18px;
  fill: var(--wa-dim);
  flex-shrink: 0;
}

.wa-search-box input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--wa-text);
  font-size: 16px;
}

.wa-search-box input::placeholder {
  color: var(--wa-dim);
}

.wa-chat-items {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.wa-chat-item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  text-align: left;
  border: none;
  border-bottom: 0.5px solid #1c1c1e;
  background: transparent;
  color: var(--wa-text);
  cursor: pointer;
  transition: background 0.15s ease;
  user-select: none;
}

.wa-chat-item.selected-tap,
.wa-chat-item:active {
  background: #2c2c2e;
}

.avatar-wrap {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
}

.avatar-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.wa-chat-item .name {
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.time {
  font-size: 13px;
  color: var(--wa-dim);
  flex-shrink: 0;
}

.role-subtitle {
  font-size: 13px;
  color: var(--wa-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.info-bottom {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 18px;
  overflow: hidden;
  font-size: 14px;
  color: var(--wa-dim);
}

.ticks-preview {
  display: inline-flex;
  flex-shrink: 0;
}

.ticks-preview svg,
.wa-blue-check svg {
  width: 15px;
  height: 15px;
  display: block;
  fill: var(--wa-ticks);
}

.last-msg {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-chat-topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: max(16px, env(safe-area-inset-top)) 12px 10px;
  border-bottom: 0.5px solid #1c1c1e;
  background: var(--wa-bg);
  z-index: 2;
}

.wa-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.wa-back-btn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
  border-radius: 50%;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
  background: var(--wa-profile-bg);
  cursor: pointer;
}

.wa-back-btn svg {
  width: 22px;
  height: 22px;
  fill: #ffffff;
}

.wa-topbar-profile {
  flex: 1;
  min-width: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 14px 4px 4px;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  background: var(--wa-profile-bg);
}

.wa-topbar-profile img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
  flex-shrink: 0;
}

.wa-topbar-info {
  min-width: 0;
}

.wa-topbar-info .name,
.wa-topbar-info .role {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.wa-topbar-info .name {
  font-size: 15px;
  font-weight: 600;
}

.wa-topbar-info .role {
  font-size: 11px;
  color: var(--wa-dim);
}

.wa-messages-area {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
}

.wa-date-pill {
  align-self: center;
  flex-shrink: 0;
  padding: 5px 12px;
  margin: 10px 0;
  border-radius: 8px;
  background: #161616;
  font-size: 12px;
  font-weight: 600;
}

.wa-msg-bubble {
  max-width: 92%;
  min-width: 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 12px 6px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.38;
}

.wa-msg-bubble.user {
  align-self: flex-end;
  background: var(--wa-user);
  border-bottom-right-radius: 4px;
}

.wa-msg-bubble.bot {
  align-self: flex-start;
  background: var(--wa-bot);
  border-bottom-left-radius: 4px;
}

.wa-msg-bubble.error {
  border: 1px solid rgba(255, 100, 100, 0.5);
}

.wa-msg-text {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.wa-prose {
  white-space: pre-wrap;
}

.wa-prose strong {
  font-weight: 700;
}

.wa-prose em {
  font-style: italic;
}

.wa-formula {
  display: block;
  min-width: 0;
  max-width: 100%;
  margin: 1.25em 0;
  padding: 0.45em 0.15em 0.65em;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  word-break: normal;
  overflow-wrap: normal;
  -webkit-overflow-scrolling: touch;
}

.wa-formula .katex-display {
  margin: 0;
  text-align: left;
}

.wa-formula .katex-display > .katex {
  text-align: left;
}

.wa-formula .katex {
  font-size: 1em;
}

.wa-formula .katex .text,
.wa-formula .katex .text .textrm {
  font-family: var(--chat-font);
}

.wa-formula-fallback {
  font-family: var(--chat-font);
  font-size: 0.95em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #ffd59a;
}

.wa-msg-meta {
  align-self: flex-end;
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 2px;
  margin-left: 12px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.65);
  user-select: none;
}

.wa-msg-bubble.bot .wa-msg-meta {
  color: var(--wa-dim);
}

.wa-doc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-wrap: anywhere;
}

.wa-doc-icon {
  font-size: 22px;
}

.wa-img-preview {
  max-width: 100%;
  max-height: 400px;
  object-fit: contain;
  border-radius: 10px;
}

.wa-typing {
  align-self: flex-start;
  flex-shrink: 0;
  display: flex;
  gap: 5px;
  padding: 10px 14px;
  border-radius: 14px 14px 14px 4px;
  background: var(--wa-bot);
}

.wa-typing-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--wa-dim);
  animation: waBounce 1.2s infinite ease-in-out;
}

.wa-typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.wa-typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes waBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.wa-composer {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 14px 10px max(14px, env(safe-area-inset-bottom));
  border-top: 0.5px solid #1c1c1e;
  background: var(--wa-bg);
  z-index: 2;
}

.phone.keyboard-open .wa-composer {
  padding-top: 10px;
  padding-bottom: 8px;
}

.wa-action-icon-btn,
.wa-mic-btn {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: none;
  padding: 0;
  cursor: pointer;
}

.wa-action-icon-btn {
  color: var(--wa-dim);
  background: transparent;
}

.wa-action-icon-btn svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}

.wa-mic-btn {
  border-radius: 50%;
  background: var(--wa-blue);
  color: #ffffff;
}

.wa-mic-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.wa-mic-btn.recording {
  background: #e23d3d;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

.wa-input-pill {
  flex: 1;
  min-width: 0;
  min-height: 38px;
  padding: 8px 14px;
  border-radius: 20px;
  background: var(--wa-input-bg);
}

.input-field {
  width: 100%;
  min-height: 22px;
  max-height: 100px;
  overflow-y: auto;
  overscroll-behavior: contain;
  outline: none;
  color: var(--wa-text);
  font-size: 16px;
  line-height: 1.35;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
  -webkit-user-select: text;
}

.input-field:empty::before {
  content: attr(placeholder);
  color: var(--wa-dim);
  pointer-events: none;
}

/* Rote Hervorhebung der letzten zehn gesprochenen Wörter. */
.drift-sparks-wrap {
  text-decoration-line: underline;
  text-decoration-color: #ff453a;
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
  text-decoration-skip-ink: none;
  animation: driftSparkGlow 0.7s infinite alternate ease-in-out;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

@keyframes driftSparkGlow {
  from {
    text-decoration-color: #ff453a;
    text-shadow: 0 2px 5px rgba(255, 69, 0, 0.3);
  }
  to {
    text-decoration-color: #ff7b45;
    text-shadow: 0 2px 8px rgba(255, 59, 48, 0.55);
  }
}

.voice-cursor {
  display: inline-block;
  width: 3px;
  height: 1.25em;
  margin-left: 2px;
  vertical-align: -2px;
  border-radius: 2px;
  background: #ff3b30;
  box-shadow: 0 0 8px #ff4500;
  animation: fireCursorPulse 0.4s infinite alternate ease-in-out;
}

@keyframes fireCursorPulse {
  from {
    background: #ff3b30;
    box-shadow: 0 0 6px #ff4500;
  }
  to {
    background: #ffd700;
    box-shadow: 0 0 12px #ff4500;
  }
}

.voice-inline-mic {
  display: inline-flex;
  width: 19px;
  height: 19px;
  margin-left: 4px;
  align-items: center;
  justify-content: center;
  vertical-align: -2px;
  border-radius: 50%;
  background: var(--wa-blue);
  box-shadow: 0 2px 8px rgba(0, 122, 255, 0.5);
}

.voice-inline-mic svg {
  width: 11px;
  height: 11px;
  fill: #ffffff;
}

.wa-prompt-container {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 24px;
  text-align: center;
}

.wa-prompt-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin: auto;
  padding: 24px 20px;
  border: 1px solid var(--wa-border);
  border-radius: 16px;
  background: var(--wa-bg);
}

.wa-prompt-card h3 {
  margin: 0;
  font-size: 18px;
}

.wa-prompt-card p {
  margin: 0 0 4px;
  font-size: 14px;
  line-height: 1.4;
  color: var(--wa-dim);
}

.wa-prompt-input,
.wa-prompt-select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--wa-border);
  border-radius: 10px;
  background: #282828;
  color: var(--wa-text);
  font-size: 16px;
}

.wa-prompt-btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: var(--wa-blue);
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.prompt-error {
  color: #ff7068;
  font-size: 14px;
}

#frankNameFields {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hidden-element {
  display: none !important;
}

.wa-chat-items,
.wa-messages-area,
.input-field,
.wa-formula,
.wa-prompt-container {
  scrollbar-color: var(--wa-blue) #000000;
  scrollbar-width: thin;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: #000000;
}

::-webkit-scrollbar-thumb {
  background: var(--wa-blue);
  border-radius: 3px;
}

@media (max-width: 380px) {
  .wa-chat-topbar .header-logo-group {
    gap: 5px;
  }

  .wa-chat-topbar .header-logo-group img,
  .wa-chat-topbar .header-logo-group svg {
    height: 25px;
  }

  .wa-chat-topbar .header-logo-group svg {
    width: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="phone" id="phoneContainer">
  <div id="splashOverlay">
    <img
      id="splashGraphic"
      src="Startbildschirm.png"
      alt="CWE Chat"
      fetchpriority="high"
    />
  </div>

  <div id="chatListView">
    <div class="wa-list-header">
      <div class="wa-title-row">
        <h1 class="wa-title">Chats</h1>
        <div class="header-logo-group">
          <img src="Logo-sw.png" alt="Schullogo" />
          <span class="chat-brand-icon" aria-hidden="true"></span>
        </div>
      </div>

      <div class="wa-search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          id="searchInput"
          type="search"
          placeholder="Suchen"
          aria-label="Chats durchsuchen"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>
    </div>
    <div class="wa-chat-items" id="chatItemsContainer"></div>
  </div>

  <div id="chatWindowView" aria-hidden="true">
    <div class="wa-chat-topbar">
      <div class="wa-topbar-left">
        <button
          id="backBtn"
          class="wa-back-btn"
          type="button"
          aria-label="Zurück zur Übersicht"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>

        <div class="wa-topbar-profile">
          <img id="chatAvatar" alt="" />
          <div class="wa-topbar-info">
            <div id="chatName" class="name"></div>
            <div id="chatRole" class="role"></div>
          </div>
        </div>
      </div>

      <div class="header-logo-group">
        <img src="Logo-sw.png" alt="Schullogo" />
        <span class="chat-brand-icon" aria-hidden="true"></span>
      </div>
    </div>

    <div id="passwordPrompt" class="wa-prompt-container hidden-element">
      <div class="wa-prompt-card">
        <h3>Lehrkräfte-Zugang</h3>
        <p>Frank Hiller steht ausschließlich Lehrkräften zur Verfügung.</p>

        <div id="frankNameFields" class="hidden-element">
          <input
            id="frankFirstNameInput"
            class="wa-prompt-input"
            placeholder="Vorname"
            aria-label="Vorname"
            autocomplete="given-name"
          />
          <input
            id="frankLastNameInput"
            class="wa-prompt-input"

function formatTime(date) {

}

function dateKey(date) {
  const value = new Date(date);
  return `${value.getFullYear()}-${value.getMonth()}-${value.getDate()}`;
}

function formatDatePill(date) {
  const value = new Date(date);
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);

  if (dateKey(value) === dateKey(today)) return "Heute";
  if (dateKey(value) === dateKey(yesterday)) return "Gestern";

  return value.toLocaleDateString("de-DE", {
    weekday: "short",
    day: "numeric",
    month: "short"
  });
}

function splitMessageIntoSegments(text) {
  const segments = [];
  const delimiters = [
    { open: "\\(", close: "\\)" },
    { open: "\\[", close: "\\]" },
    { open: "$$", close: "$$" }
  ];

  let cursor = 0;

  while (cursor < text.length) {
    let next = null;

    for (const delimiter of delimiters) {
      const start = text.indexOf(delimiter.open, cursor);

      if (start !== -1 && (!next || start < next.start)) {
        next = { ...delimiter, start };
      }
    }

    if (!next) {
      segments.push({ type: "text", value: text.slice(cursor) });
      break;
    }

    if (next.start > cursor) {
      segments.push({
        type: "text",
        value: text.slice(cursor, next.start)
      });
    }

    const formulaStart = next.start + next.open.length;
    const end = text.indexOf(next.close, formulaStart);

    if (end === -1) {
      segments.push({
        type: "text",
        value: text.slice(next.start)
      });
      break;
    }

    segments.push({
      type: "math",
      value: text.slice(formulaStart, end)
    });

    cursor = end + next.close.length;
  }

  return segments;
}

function normalizeCurrencyValues(text) {
  return text.replace(
    /(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)[ \t]*(?:EUR\b|Euro\b|€)/gi,
    (match, numberText) => {
      const number = Number(
        numberText.replace(/\./g, "").replace(",", ".")
      );

      if (!Number.isFinite(number)) return match;

      return number.toLocaleString("de-DE", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " EUR";
    }
  );
}

function normalizeUnitSpacing(text) {
  return text.replace(
    /(\d)[ \t]*(EUR\b|Euro\b|€|Stück\b|Stk\.?(?!\w)|kg\b|g\b|t\b|l\b|cm\b|mm\b|km\b|m\b|Prozent\b|%)/gi,
    (match, number, unit) => {
      return `${number} ${/^(euro|€)$/i.test(unit) ? "EUR" : unit}`;
    }
  );
}

function formatProse(text) {
  const normalized = normalizeUnitSpacing(
    normalizeCurrencyValues(text)
  );

  return escapeHtml(normalized)
    .replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<strong>$1</strong>")
    .replace(/(?<![\w_])_([^_\n]+)_(?![\w_])/g, "<em>$1</em>")
    .replace(/~([^~\n]+)~/g, "<del>$1</del>");
}

function renderFormula(formula, container) {
  if (!window.katex) {
    container.classList.add("wa-formula-fallback");
    container.textContent = formula;
    container.title = "Formeldarstellung konnte nicht geladen werden.";
    return;
  }

  try {
    window.katex.render(formula, container, {
      displayMode: true,
      throwOnError: true,
      trust: false,
      strict: "warn",
      output: "htmlAndMathml"
    });
  } catch (error) {
    container.classList.add("wa-formula-fallback");
    container.textContent = formula;
    container.title = "Diese Formel konnte nicht dargestellt werden.";
    console.warn("KaTeX-Renderfehler:", error.message);
  }
}

function renderMessageContent(container, text) {
  const segments = splitMessageIntoSegments(String(text || ""));

  segments.forEach((segment, index) => {
    if (segment.type === "math") {
      const formula = document.createElement("div");
      formula.className = "wa-formula";
      renderFormula(segment.value, formula);
      container.appendChild(formula);
      return;
    }

    let value = segment.value;

    if (segments[index - 1]?.type === "math") {
      value = value.replace(/^[ \t]*\r?\n(?:[ \t]*\r?\n)*/, "");
    }

    if (segments[index + 1]?.type === "math") {
      value = value.replace(/(?:\r?\n[ \t]*)+$/, "");
    }

    if (!value) return;

    const prose = document.createElement("span");
    prose.className = "wa-prose";
    prose.innerHTML = formatProse(value);
    container.appendChild(prose);
  });
}

function isNearMessageBottom() {
  return (
    messagesDiv.scrollHeight -
    messagesDiv.scrollTop -
    messagesDiv.clientHeight
  ) < 100;
}

function scrollToBottom(smooth = false) {
  requestAnimationFrame(() => {
    messagesDiv.scrollTo({
      top: messagesDiv.scrollHeight,
      behavior: smooth ? "smooth" : "auto"
    });
  });
}

function syncVisualViewport() {
  viewportFrame = 0;

  const viewport = window.visualViewport;
  const width = viewport?.width || window.innerWidth;
  const height = viewport?.height || window.innerHeight;
  const top = viewport?.offsetTop || 0;
  const left = viewport?.offsetLeft || 0;
  const scale = viewport?.scale || 1;
  const containerWidth = Math.min(600, width);

  phoneContainer.style.width = `${containerWidth}px`;
  phoneContainer.style.height = `${height}px`;
  phoneContainer.style.top = `${top}px`;
  phoneContainer.style.left =
    `${left + Math.max(0, (width - containerWidth) / 2)}px`;

  const active = document.activeElement;
  const editableFocused = Boolean(
    active &&
    (
      active.matches("input:not([type='file']), textarea, select") ||
      active.isContentEditable
    )
  );

  if (
    !baselineViewportWidth ||
    Math.abs(width - baselineViewportWidth) > 100
  ) {
    baselineViewportWidth = width;
    baselineViewportHeight = height;
  }

  if (!editableFocused && Math.abs(scale - 1) < 0.05) {
    baselineViewportHeight = Math.max(baselineViewportHeight, height);
  }

  const referenceHeight = Math.max(
    baselineViewportHeight,
    document.documentElement.clientHeight,
    window.innerHeight
  );

  const keyboardOpen =
    Math.abs(scale - 1) < 0.05 &&
    editableFocused &&
    referenceHeight - height > 120;

  phoneContainer.classList.toggle("keyboard-open", keyboardOpen);

  if (
    currentPerson &&
    followMessagesDuringViewportChange &&
    messagesDiv.style.display !== "none"
  ) {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
}

function scheduleViewportSync() {
  if (!viewportFrame) {
    viewportFrame = requestAnimationFrame(syncVisualViewport);
  }
}

function scheduleViewportSettling() {
  scheduleViewportSync();

  for (const timer of viewportTimers) {
    clearTimeout(timer);
  }
  viewportTimers.clear();

  for (const delay of [80, 180, 350, 600]) {
    const timer = setTimeout(() => {
      viewportTimers.delete(timer);
      scheduleViewportSync();
    }, delay);

    viewportTimers.add(timer);
  }
}

function installViewportHandling() {
  const viewport = window.visualViewport;

  if (viewport) {
    viewport.addEventListener("resize", scheduleViewportSync);
    viewport.addEventListener("scroll", scheduleViewportSync);
  }

  window.addEventListener("resize", scheduleViewportSettling);
  window.addEventListener("scroll", scheduleViewportSync, {
    passive: true
  });
  window.addEventListener("pageshow", scheduleViewportSettling);

  window.addEventListener("orientationchange", () => {
    baselineViewportHeight = 0;
    baselineViewportWidth = 0;
    scheduleViewportSettling();
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) scheduleViewportSettling();
  });

  document.addEventListener("focusin", event => {
    followMessagesDuringViewportChange =
      event.target === inputField && isNearMessageBottom();
    scheduleViewportSettling();
  });

  document.addEventListener("focusout", scheduleViewportSettling);

  messagesDiv.addEventListener("touchstart", () => {
    followMessagesDuringViewportChange = false;
  }, { passive: true });

  messagesDiv.addEventListener("wheel", () => {
    followMessagesDuringViewportChange = false;
  }, { passive: true });

  syncVisualViewport();
}

function renderMessages(person) {
  if (currentPerson !== person) return;

  messagesDiv.replaceChildren();
  let lastDate = null;

  for (const message of chatHistory[person]) {
    const key = dateKey(message.timestamp);

    if (key !== lastDate) {
      const pill = document.createElement("div");
      pill.className = "wa-date-pill";
      pill.textContent = formatDatePill(message.timestamp);
      messagesDiv.appendChild(pill);
      lastDate = key;
    }

    const bubble = document.createElement("div");
    bubble.className =
      `wa-msg-bubble ${message.who}` +
      (message.isError ? " error" : "");

    if (message.type === "text") {
      const text = document.createElement("div");
      text.className = "wa-msg-text";
      renderMessageContent(text, message.text);
      bubble.appendChild(text);
    } else if (message.type === "image") {
      const image = document.createElement("img");
      image.className = "wa-img-preview";
      image.src = message.imageSrc;
      image.alt = message.fileName || "Hochgeladenes Bild";

      image.addEventListener("load", () => {
        if (currentPerson === person && isNearMessageBottom()) {
          scrollToBottom();
        }
      });

      bubble.appendChild(image);
    } else if (message.type === "document") {
      const row = document.createElement("div");
      row.className = "wa-doc-row";

      const icon = document.createElement("span");
      icon.className = "wa-doc-icon";
      icon.textContent = "📄";

      const name = document.createElement("span");
      name.textContent = message.fileName;

      row.append(icon, name);
      bubble.appendChild(row);
    }

    const meta = document.createElement("div");
    meta.className = "wa-msg-meta";
    meta.appendChild(
      document.createTextNode(formatTime(message.timestamp))
    );

    if (message.who === "user") {
      const ticks = document.createElement("span");
      ticks.className = "wa-blue-check";
      ticks.innerHTML = ticksSvg;
      meta.appendChild(ticks);
    }

    bubble.appendChild(meta);
    messagesDiv.appendChild(bubble);
  }

  if (pendingRequests.has(person)) {
    const typing = document.createElement("div");
    typing.className = "wa-typing";
    typing.setAttribute("aria-label", "Antwort wird erstellt");

    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("div");
      dot.className = "wa-typing-dot";
      typing.appendChild(dot);
    }

    messagesDiv.appendChild(typing);
  }

  scrollToBottom();
}

function updatePreview(person, text, timestamp) {
  $(`preview-${person}`).textContent = text;
  $(`time-${person}`).textContent = formatTime(timestamp);
  $(`ticks-${person}`).classList.remove("hidden-element");

  const item = chatItemsContainer.querySelector(
    `[data-person="${person}"]`
  );
  chatItemsContainer.prepend(item);
}

function updateComposerState() {
  const pending = currentPerson
    ? pendingRequests.has(currentPerson)
    : false;

  const hasText = inputField.innerText.trim().length > 0;
  const showSend = hasText && !isRecording && !speechStarting;

  $("micIcon").classList.toggle("hidden-element", showSend);
  $("sendIcon").classList.toggle("hidden-element", !showSend);

  micOrSendBtn.disabled = pending || !currentPerson;
  uploadBtn.disabled = pending || !currentPerson;
  fileInput.disabled = pending || !currentPerson;

  inputField.contentEditable = "true";

  micOrSendBtn.classList.toggle(
    "recording",
    isRecording || speechStarting
  );

  micOrSendBtn.setAttribute(
    "aria-label",
    isRecording || speechStarting
      ? "Spracheingabe beenden"
      : showSend
        ? "Nachricht senden"
        : "Spracheingabe starten"
  );
}

function blurActiveElement() {

function showChatContent() {
  $("passwordPrompt").classList.add("hidden-element");
  $("studentPrompt").classList.add("hidden-element");
  messagesDiv.style.display = "flex";
  composerBar.style.display = "flex";
  renderMessages(currentPerson);
  updateComposerState();
  scheduleViewportSettling();
}

function clearNavigationTimers() {
  clearTimeout(navigationStartTimer);
  clearTimeout(navigationFinishTimer);
  navigationStartTimer = null;
  navigationFinishTimer = null;
}

function prepareChat(person) {
  currentPerson = person;

  document.querySelectorAll(".wa-chat-item").forEach(item => {
    item.classList.toggle(
      "selected-tap",
      item.dataset.person === person
    );
  });

  $("chatName").textContent = profiles[person].name;
  $("chatRole").textContent = profiles[person].role;
  $("chatAvatar").src = profiles[person].avatar;

  $("passwordPrompt").classList.add("hidden-element");
  $("studentPrompt").classList.add("hidden-element");
  messagesDiv.style.display = "none";
  composerBar.style.display = "none";
  inputField.textContent = drafts[person];

  loadUserProfile();

  if (person === "frank" && !frankSessionUnlocked) {
    $("passwordPrompt").classList.remove("hidden-element");
    $("passwordInput").value = "";
    $("passwordError").classList.add("hidden-element");
    $("frankNameFields").classList.toggle(
      "hidden-element",
      Boolean(userProfile)
    );
  } else if (person !== "frank" && !userProfile?.class) {
    $("studentPrompt").classList.remove("hidden-element");
    $("studentFirstNameInput").value = userProfile?.firstName || "";
    $("studentLastNameInput").value = userProfile?.lastName || "";
    $("studentClassSelect").value = "";
    $("studentError").classList.add("hidden-element");
  } else {
    showChatContent();
  }

  followMessagesDuringViewportChange = true;
  updateComposerState();
  scheduleViewportSettling();
}

function finishOpening(token) {
  if (token !== navigationToken || navigationState !== "opening") {
    return;
  }

  clearTimeout(navigationFinishTimer);
  navigationState = "chat";

  document.querySelectorAll(".wa-chat-item").forEach(item => {
    item.classList.remove("selected-tap");
  });
}

function finishClosing(token) {
  if (token !== navigationToken || navigationState !== "closing") {
    return;
  }

  clearTimeout(navigationFinishTimer);
  chatWindowView.classList.remove("is-visible");
  chatWindowView.setAttribute("aria-hidden", "true");
  navigationState = "list";

  document.querySelectorAll(".wa-chat-item").forEach(item => {
    item.classList.remove("selected-tap");
  });

  updateComposerState();
}

function openChat(person) {
  if (navigationState !== "list") return;

  clearNavigationTimers();
  const token = ++navigationToken;

  blurActiveElement();
  navigationState = "opening";
  prepareChat(person);

  searchInput.disabled = true;
  chatWindowView.classList.add("is-visible");
  chatWindowView.setAttribute("aria-hidden", "false");

  /*
    Die Ausgangsposition wird vor dem Start der Transition festgelegt.
    Die Auswahlzeile bleibt kurz sichtbar.
  */
  void chatWindowView.offsetWidth;

  navigationStartTimer = setTimeout(() => {
    if (token !== navigationToken || navigationState !== "opening") {
      return;
    }

    chatWindowView.classList.add("active-chat");
    chatListView.classList.add("in-background");

    if (reducedMotion.matches) {
      finishOpening(token);
    } else {
      navigationFinishTimer = setTimeout(
        () => finishOpening(token),
        420
      );
    }
  }, reducedMotion.matches ? 0 : 140);
}

function backToChatList() {
  if (navigationState === "list" || navigationState === "closing") {
    return;
  }

  clearNavigationTimers();
  const token = ++navigationToken;

  stopRecording();

  if (currentPerson) {
    drafts[currentPerson] = inputField.innerText;
  }

  blurActiveElement();
  navigationState = "closing";

  chatWindowView.classList.remove("active-chat");
  chatListView.classList.remove("in-background");
  searchInput.disabled = false;

  currentPerson = null;
  followMessagesDuringViewportChange = false;

  updateComposerState();
  scheduleViewportSettling();

  if (reducedMotion.matches) {
    finishClosing(token);
  } else {
    navigationFinishTimer = setTimeout(
      () => finishClosing(token),
      420
    );
  }
}

chatWindowView.addEventListener("transitionend", event => {
  if (
    event.target !== chatWindowView ||
    event.propertyName !== "transform"
  ) return;

  if (navigationState === "opening") {
    finishOpening(navigationToken);
  } else if (navigationState === "closing") {
    finishClosing(navigationToken);
  }
});

function buildApiMessages(person) {
  return chatHistory[person]
    .filter(message => !message.isError && message.type !== "document")
    .map(message => {
      if (message.type === "image") {
        return {
          role: "user",
          content: [
            { type: "text", text: "[Foto hochgeladen]" },
            {
              type: "image_url",
              image_url: { url: message.imageSrc }
            }
          ]
        };
      }

      return {
        role: message.who === "user" ? "user" : "assistant",
        content: message.text
      };
    });
}

function readImageAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(
      new Error("Das Bild konnte nicht gelesen werden.")
    );

    reader.readAsDataURL(file);
  });
}

async function sendMessage(file = null) {
  const person = currentPerson;

  if (!person || pendingRequests.has(person)) return;

  stopRecording();

  const text = inputField.innerText.trim();
  if (!text && !file) return;

  const timestamp = new Date();
  pendingRequests.add(person);

  try {
    if (text) {
      chatHistory[person].push({
        type: "text",
        text,
        who: "user",
        timestamp
      });
    }

    const apiMessages = buildApiMessages(person);

    inputField.textContent = "";
    drafts[person] = "";
    updateComposerState();

    if (file) {
      const preview = {
        type: file.type.startsWith("image/") ? "image" : "document",
        who: "user",
        fileName: file.name,
        timestamp
      };

      if (preview.type === "image") {
        preview.imageSrc = await readImageAsDataUrl(file);
      }

      chatHistory[person].push(preview);
    }

    updatePreview(person, text || file.name, timestamp);
    renderMessages(person);

    const requestData = {
      person,
      messages: apiMessages,
      firstName: userProfile?.firstName || "",
      lastName: userProfile?.lastName || "",
      studentClass: userProfile?.class || ""
    };

    let options;

    if (file) {
      const form = new FormData();

      form.append("file", file);
      form.append("person", requestData.person);
      form.append("messages", JSON.stringify(requestData.messages));
      form.append("firstName", requestData.firstName);
      form.append("lastName", requestData.lastName);
      form.append("studentClass", requestData.studentClass);

      options = { method: "POST", body: form };
    } else {
      options = {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestData)
      };
    }

    const response = await fetch("/api/chat", options);
    const rawBody = await response.text();
    let data;

    try {
      data = JSON.parse(rawBody);
    } catch {
      console.error("Unerwartete Serverantwort:", response.status);

      throw new Error(
        `Der Server hat keine lesbare Antwort geliefert (HTTP ${response.status}).`
      );
    }

    if (!response.ok) {
      throw new Error(
        typeof data.error === "string"
          ? data.error
          : `Serverfehler (HTTP ${response.status}).`
      );
    }

    const answer = data.message?.content;

    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error(
        typeof data.error === "string"
          ? data.error
          : "Der Server hat keine Textantwort zurückgegeben."
      );
    }

    const botTimestamp = new Date();

    chatHistory[person].push({
      type: "text",
      text: answer,
      who: "bot",
      timestamp: botTimestamp
    });

    updatePreview(person, answer, botTimestamp);
  } catch (error) {
    console.error("Chat-Anfrage fehlgeschlagen:", error);

    const errorTimestamp = new Date();
    const description = error instanceof TypeError
      ? "Die Verbindung zum Server konnte nicht hergestellt werden."
      : error.message;

    chatHistory[person].push({
      type: "text",
      text: `Die Antwort konnte nicht geladen werden.\n\n${description}`,
      who: "bot",
      timestamp: errorTimestamp,
      isError: true
    });

    updatePreview(
      person,
      "Antwort konnte nicht geladen werden.",
      errorTimestamp
    );
  } finally {
    pendingRequests.delete(person);

    if (currentPerson === person) {
      renderMessages(person);
      updateComposerState();
      scheduleViewportSync();
    }
  }
}

/*
  Die letzten zehn Wörter werden anhand von Wortpositionen markiert.
  Bereits vor der Aufnahme eingegebener Text bleibt unmarkiert.
*/
function splitLastSpokenWords(text, wordCount = 10) {
  const matches = [...text.matchAll(/\S+/g)];

  if (!matches.length) {
    return { before: "", highlighted: text };
  }

  const startIndex = matches[
    Math.max(0, matches.length - wordCount)
  ].index;

  return {
    before: text.slice(0, startIndex),
    highlighted: text.slice(startIndex)
  };
}

function renderSpeechDraft(spokenText, speaking = true) {
  if (currentPerson !== recordingPerson) return;

  const base = recordingBaseText
    ? recordingBaseText + (spokenText ? " " : "")
    : "";

  speechDraft = base + spokenText;
  inputField.replaceChildren();

  inputField.appendChild(document.createTextNode(base));

  if (spokenText) {
    const parts = splitLastSpokenWords(spokenText, 10);

    inputField.appendChild(document.createTextNode(parts.before));

    const highlight = document.createElement("span");
    highlight.className = "drift-sparks-wrap";
    highlight.textContent = parts.highlighted;
    inputField.appendChild(highlight);
  }

  if (speaking && spokenText) {
    const cursor = document.createElement("span");
    cursor.className = "voice-cursor";
    cursor.contentEditable = "false";
    cursor.setAttribute("aria-hidden", "true");
    inputField.appendChild(cursor);
  } else {
    const mic = document.createElement("span");
    mic.className = "voice-inline-mic";
    mic.contentEditable = "false";
    mic.setAttribute("aria-label", "Spracheingabe läuft");
    mic.innerHTML = inlineMicSvg;
    inputField.appendChild(mic);
  }

  inputField.scrollTop = inputField.scrollHeight;
  scheduleViewportSync();
}

function finishSpeechDraft() {
  clearTimeout(speechSilenceTimer);
  speechSilenceTimer = null;

  if (currentPerson === recordingPerson) {
    inputField.textContent = speechDraft;

    if (currentPerson) {
      drafts[currentPerson] = speechDraft;
    }
  }
}

function stopRecording() {
  if (!recognition && !isRecording && !speechStarting) return;

  const activeRecognition = recognition;

  finishSpeechDraft();

  recognition = null;
  isRecording = false;
  speechStarting = false;
  recordingPerson = null;

  if (activeRecognition) {
    activeRecognition.onstart = null;
    activeRecognition.onresult = null;
    activeRecognition.onend = null;
    activeRecognition.onerror = null;

    try {
      activeRecognition.abort();
    } catch {
      // Aufnahme bereits beendet.
    }
  }

  updateComposerState();
}

function startRecording() {
  const Recognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Spracheingabe wird von diesem Browser nicht unterstützt.");
    return;
  }

  if (
    !currentPerson ||
    pendingRequests.has(currentPerson) ||
    recognition ||
    speechStarting
  ) return;

  const instance = new Recognition();

  recognition = instance;
  recordingPerson = currentPerson;
  recordingBaseText = inputField.innerText.trim();
  speechDraft = recordingBaseText;
  speechStarting = true;

  instance.lang = "de-DE";
  instance.continuous = true;
  instance.interimResults = true;

  updateComposerState();

  instance.onstart = () => {
    if (recognition !== instance) return;

    speechStarting = false;
    isRecording = true;
    renderSpeechDraft("", false);
    updateComposerState();
  };

  instance.onresult = event => {
    if (
      recognition !== instance ||
      currentPerson !== recordingPerson
    ) return;

    const transcriptParts = [];

    for (let i = 0; i < event.results.length; i++) {
      transcriptParts.push(event.results[i][0].transcript.trim());
    }

    const spokenText = transcriptParts.filter(Boolean).join(" ");

    renderSpeechDraft(spokenText, true);
    updateComposerState();

    clearTimeout(speechSilenceTimer);

    speechSilenceTimer = setTimeout(() => {
      if (
        recognition === instance &&
        isRecording &&
        currentPerson === recordingPerson
      ) {
        renderSpeechDraft(spokenText, false);
      }
    }, 1200);
  };

  const finish = () => {
    if (recognition !== instance) return;

    finishSpeechDraft();

    recognition = null;
    recordingPerson = null;
    isRecording = false;
    speechStarting = false;

    updateComposerState();
  };

  instance.onend = finish;

  instance.onerror = event => {
    console.warn("Spracheingabe:", event.error);
    finish();

    if (event.error === "not-allowed") {
      alert("Bitte erlaube dem Browser den Zugriff auf das Mikrofon.");
    }
  };

  try {
    instance.start();
  } catch {
    finish();
    alert("Die Spracheingabe konnte nicht gestartet werden.");
  }
}

$("backBtn").addEventListener("click", backToChatList);

micOrSendBtn.addEventListener("pointerdown", event => {
  if (
    document.activeElement === inputField &&
    inputField.innerText.trim() &&
    !isRecording &&
    !speechStarting
  ) {
    event.preventDefault();
  }
});

micOrSendBtn.addEventListener("click", () => {
  if (isRecording || speechStarting) {
    stopRecording();
  } else if (inputField.innerText.trim()) {
    followMessagesDuringViewportChange = true;
    sendMessage();
  } else {
    startRecording();
  }
});

/* Vor manueller Bearbeitung die Spracherkennung sauber beenden. */
inputField.addEventListener("beforeinput", () => {
  if (isRecording || speechStarting) {
    stopRecording();
  }
});

inputField.addEventListener("input", () => {
  if (currentPerson && !isRecording && !speechStarting) {
    drafts[currentPerson] = inputField.innerText;
  }

  updateComposerState();
  scheduleViewportSync();
});

inputField.addEventListener("paste", event => {
  event.preventDefault();

  if (isRecording || speechStarting) stopRecording();

  const text = event.clipboardData.getData("text/plain");
  const selection = window.getSelection();

  if (!selection || !selection.rangeCount) return;

  const range = selection.getRangeAt(0);
  range.deleteContents();

  const node = document.createTextNode(text);
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);

  inputField.dispatchEvent(new Event("input"));
});

uploadBtn.addEventListener("click", () => {
  stopRecording();
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  fileInput.value = "";

  if (file && currentPerson) sendMessage(file);
});

$("studentConfirmBtn").addEventListener("click", () => {
  const firstName = $("studentFirstNameInput").value.trim();
  const lastName = $("studentLastNameInput").value.trim();
  const studentClass = $("studentClassSelect").value;

  if (!firstName || !lastName || !studentClass) {
    $("studentError").classList.remove("hidden-element");
    return;
  }

  saveUserProfile({
    firstName,
    lastName,
    class: studentClass
  });

  blurActiveElement();
  showChatContent();
});

$("passwordConfirmBtn").addEventListener("click", () => {
  const error = $("passwordError");

  /*
    Bestehende Frontend-Freischaltung.
    Eine echte Zugriffskontrolle muss zusätzlich serverseitig erfolgen.
  */
  if ($("passwordInput").value !== "84307") {
    error.textContent = "Das Passwort ist nicht korrekt.";
    error.classList.remove("hidden-element");
    return;
  }

  if (!userProfile) {
    const firstName = $("frankFirstNameInput").value.trim();
    const lastName = $("frankLastNameInput").value.trim();

    if (!firstName || !lastName) {
      error.textContent = "Bitte Vorname und Nachname ausfüllen.";
      error.classList.remove("hidden-element");
      return;
    }

    saveUserProfile({
      firstName,
      lastName,
      class: ""
    });
  }

  frankSessionUnlocked = true;
  $("passwordInput").value = "";
  error.classList.add("hidden-element");

  blurActiveElement();
  showChatContent();
});

$("passwordInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    $("passwordConfirmBtn").click();
  }
});

function normalizeSearch(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .trim();
}

searchInput.addEventListener("input", () => {
  const query = normalizeSearch(searchInput.value);

  document.querySelectorAll(".wa-chat-item").forEach(item => {
    const person = item.dataset.person;
    const profile = profiles[person];

    const searchable = normalizeSearch([
      profile.name,
      profile.role,
      profile.desc,
      ...chatHistory[person].map(message => {
        return message.text || message.fileName || "";
      })
    ].join(" "));

    item.classList.toggle(
      "hidden-element",
      Boolean(query) && !searchable.includes(query)
    );
  });
});

let swipeStart = null;

chatWindowView.addEventListener("touchstart", event => {
  if (
    event.touches.length !== 1 ||
    navigationState !== "chat"
  ) return;

  const touch = event.touches[0];

  if (
    touch.clientX - phoneContainer.getBoundingClientRect().left > 40 ||
    event.target.closest(".wa-formula, input, select, [contenteditable]")
  ) {
    swipeStart = null;
    return;
  }

  swipeStart = {
    x: touch.clientX,
    y: touch.clientY
  };
}, { passive: true });

chatWindowView.addEventListener("touchend", event => {
  if (!swipeStart || !event.changedTouches.length) return;

  const touch = event.changedTouches[0];

  if (
    touch.clientX - swipeStart.x > 90 &&
    Math.abs(touch.clientY - swipeStart.y) < 60
  ) {
    backToChatList();
  }

  swipeStart = null;
}, { passive: true });

chatWindowView.addEventListener("touchcancel", () => {
  swipeStart = null;
}, { passive: true });

window.addEventListener("DOMContentLoaded", () => {
  if (currentPerson) renderMessages(currentPerson);

  scheduleViewportSettling();

  setTimeout(() => {
    const splash = $("splashOverlay");
    if (!splash) return;

    splash.classList.add("fade-out");
    setTimeout(() => splash.remove(), 500);
  }, 2200);
});

loadUserProfile();
buildChatList();
updateComposerState();
installViewportHandling();
</script>
