<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />


<meta
  name="viewport"
  content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
/>


<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CWE Chat" />


<title>CWE Chat</title>


<link rel="preload" as="image" href="Startbildschirm.png" />
<link rel="preload" as="image" href="Logo-sw.png" />


<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
/>


<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
></script>


<style>
:root {
  --bg: #0a0a0a;
  --chat: #101010;
  --profile: #18222c;
  --input: #282828;
  --user: #04488f;
  --bot: #242625;
  --text: #ffffff;
  --dim: #8e8e93;
  --blue: #007aff;
  --ticks: #34b7f1;
  --nav-duration: 320ms;
  --nav-easing: cubic-bezier(0.25, 1, 0.5, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --learning-bg: var(--bg);
  --learning-border: #363638;
  --learning-muted: #b8b8bd;
  --learning-action-bg: #ededed;
  --learning-action-text: #111111;
  --learning-selected-bg: rgba(0, 122, 255, 0.12);
  --learning-selected-border: var(--blue);
}

* {
  box-sizing: border-box;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  position: fixed;
  inset: 0;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 16px var(--font);
  overscroll-behavior: none;
}

button,
input,
select {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

.input-field,
.input-field:focus,
.input-field:focus-visible {
  outline: none;
  border: none;
  box-shadow: none;
}

[hidden],
.hidden-element {
  display: none !important;
}

.phone {
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: auto;
  max-width: 600px;
  overflow: hidden;
  background: var(--bg);
  isolation: isolate;
}

.phone.standalone-rest {
  top: 0;
  bottom: 0;
  height: auto;
}

#splashOverlay {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--bg);
  opacity: 1;
  pointer-events: none !important;
  transition: opacity 0.4s ease;
}

#splashOverlay * {
  pointer-events: none !important;
}

#splashGraphic {
  max-height: 240px;
  max-width: 80%;
  object-fit: contain;
  opacity: 0;
  transform: translate3d(0, 40px, 0) scale(1);
  transform-origin: center center;
  user-select: none;
}

#splashOverlay.splash-ready #splashGraphic {
  animation: splashMotion 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes splashMotion {
  0% {
    opacity: 0;
    transform: translate3d(0, 70px, 0) scale(1);
    animation-timing-function: ease-out;
  }

  22% {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
    animation-timing-function: linear;
  }

  55% {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
    animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }

  100% {
    opacity: 0;
    transform: translate3d(0, 0, 0) scale(0);
  }
}

#splashOverlay.fade-out {
  opacity: 0;
}

#chatListView,
#chatWindowView {
  position: absolute;
  inset: 0;
  min-height: 0;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

#chatListView {
  z-index: 40;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  transform: translate3d(0, 0, 0);
  opacity: 1;
  transition:
    transform var(--nav-duration) var(--nav-easing),
    opacity var(--nav-duration) ease;
  will-change: transform, opacity;
}

#chatListView.in-background {
  transform: translate3d(-20%, 0, 0);
  opacity: 0.6;
  pointer-events: none;
}

#chatWindowView {
  z-index: 50;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--chat);
  transform: translate3d(100%, 0, 0);
  transition: transform var(--nav-duration) var(--nav-easing);
  will-change: transform;
  visibility: hidden;
  pointer-events: none;
}

#chatWindowView.is-visible {
  visibility: visible;
}

#chatWindowView.active-chat {
  transform: translate3d(0, 0, 0);
  pointer-events: auto;
}

.wa-list-header {
  flex: 0 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.wa-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 42px;
}

.wa-title {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 32px;
  flex-shrink: 0;
}

.header-logo-group img {
  height: 32px;
  width: auto;
  object-fit: contain;
}

.header-logo-group svg {
  display: block;
  width: 32px;
  height: 32px;
  fill: #ffffff;
}

.wa-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: #1c1c1e;
}

.wa-search-box svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  fill: var(--dim);
}

.wa-search-box input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}

.wa-chat-items {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.wa-chat-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: none;
  border-bottom: 0.5px solid #1c1c1e;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background 0.08s ease;
}

.wa-chat-item.selected-tap,
.wa-chat-item:active {
  background: #2c2c2e;
}

.avatar-wrap {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
}

.avatar-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.wa-chat-item .name {
  font-size: 17px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.time {
  font-size: 13px;
  color: var(--dim);
  flex-shrink: 0;
}

.role-subtitle {
  font-size: 13px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.info-bottom {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 18px;
  overflow: hidden;
  color: var(--dim);
  font-size: 14px;
}

.ticks-preview {
  display: inline-flex;
  flex-shrink: 0;
}

.ticks-preview svg,
.wa-blue-check svg {
  display: block;
  width: 15px;
  height: 15px;
  fill: var(--ticks);
}

.last-msg {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-chat-topbar {
  grid-row: 1;
  grid-column: 1;
  position: relative;
  z-index: 20;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: max(16px, env(safe-area-inset-top)) 12px 10px;
  border-bottom: 0.5px solid #1c1c1e;
  background: var(--bg);
}

.wa-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.wa-back-btn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
  border-radius: 50%;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
  background: var(--profile);
  cursor: pointer;
}

.wa-back-btn svg {
  width: 22px;
  height: 22px;
  fill: #ffffff;
}

.wa-topbar-profile {
  flex: 1;
  min-width: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 14px 4px 4px;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  background: var(--profile);
}

.wa-topbar-profile img {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.wa-topbar-info {
  min-width: 0;
}

.wa-topbar-info .name,
.wa-topbar-info .role {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.wa-topbar-info .name {
  font-size: 15px;
  font-weight: 600;
}

.wa-topbar-info .role {
  font-size: 11px;
  color: var(--dim);
}

.wa-messages-area {
  grid-row: 2;
  grid-column: 1;
  position: relative;
  z-index: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px;
  padding-bottom: var(--composer-reserve, 12px);
}

.wa-date-pill {
  align-self: center;
  flex-shrink: 0;
  padding: 5px 12px;
  margin: 10px 0;
  border-radius: 8px;
  background: #161616;
  font-size: 12px;
  font-weight: 600;
}

.wa-msg-bubble {
  max-width: 92%;
  min-width: 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 12px 6px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.38;
}

.wa-msg-bubble.user {
  align-self: flex-end;
  background: var(--user);
  border-bottom-right-radius: 4px;
}

.wa-msg-bubble.bot {
  align-self: flex-start;
  background: var(--bot);
  border-bottom-left-radius: 4px;
}

.wa-msg-bubble.error {
  border: 1px solid rgba(255, 100, 100, 0.5);
}

.wa-msg-text {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.wa-prose {
  white-space: pre-wrap;
}

.wa-formula-frame {
  min-width: 0;
  max-width: 100%;
  margin: 1.25em 0;
}

.wa-formula {
  display: block;
  min-width: 0;
  max-width: 100%;
  padding: 0.45em 0.15em 0.65em;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  word-break: normal;
  overflow-wrap: normal;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.wa-formula::-webkit-scrollbar {
  display: none;
}

.wa-formula-content {
  display: inline-block;
  min-width: max-content;
  vertical-align: top;
}

.wa-formula .katex-display {
  margin: 0;
  text-align: left;
}

.wa-formula .katex-display > .katex {
  text-align: left;
}

.wa-formula .katex {
  font-size: 1em;
}

.wa-formula .katex .text,
.wa-formula .katex .text .textrm {
  font-family: var(--font);
}

.wa-formula-fallback {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #ffd59a;
}

.formula-scrollbar {
  position: relative;
  height: 32px;
  margin-top: 3px;
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
  touch-action: none;
}

.formula-scrollbar::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 8.4px;
  transform: translateY(-50%);
  border-radius: 4.2px;
  background: rgba(0, 122, 255, 0.18);
  pointer-events: none;
}

.formula-scroll-thumb {
  position: absolute;
  left: 0;
  top: 13.6px;
  height: 4.8px;
  min-width: 28px;
  border-radius: 3px;
  background: var(--blue);
  box-shadow: 0 0 3px rgba(0, 122, 255, 0.28);
  pointer-events: none;
}

.formula-scrollbar:focus-visible {
  outline: 2px solid #8dc5ff;
  outline-offset: 3px;
}

.wa-msg-meta {
  align-self: flex-end;
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 2px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.65);
}

.wa-msg-bubble.bot .wa-msg-meta {
  color: var(--dim);
}

.wa-doc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-wrap: anywhere;
}

.wa-doc-icon {
  font-size: 22px;
}

.wa-img-preview {
  max-width: 100%;
  max-height: 400px;
  object-fit: contain;
  border-radius: 10px;
}

.web-citation {
  display: inline;
  color: #9ccaff;
  font-size: 0.85em;
  text-decoration: none;
  white-space: nowrap;
}

.sources-details {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 12px;
}

.sources-details summary {
  color: #c4c4ca;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  list-style: none;
}

.sources-details summary::-webkit-details-marker {
  display: none;
}

.sources-details[open] summary {
  margin-bottom: 6px;
}

.web-sources {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
}

.web-sources-title {
  color: #c4c4ca;
  font-size: 12px;
  font-weight: 600;
}

.web-sources a {
  color: #9ccaff;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.web-sources a:hover {
  text-decoration: underline;
}

.technical-warning {
  margin-top: 8px;
  color: #ffd59a;
  font-size: 12px;
  white-space: pre-wrap;
}

.wa-typing {
  align-self: flex-start;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 14px 14px 14px 4px;
  background: var(--bot);
}

.wa-typing-row {
  display: flex;
  gap: 5px;
}

.wa-typing-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dim);
  animation: bounce 1.2s infinite ease-in-out;
}

.wa-typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.wa-typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes bounce {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-4px);
  }
}

.wa-pending-status {
  color: var(--dim);
  font-size: 14px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.quiz-card-loading {
  position: relative;
}

.quiz-card-loading > *:not(.quiz-loading-overlay) {
  opacity: 0.35;
  pointer-events: none;
}

.quiz-loading-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 20px;
  background: rgba(10, 10, 10, 0.74);
}

.quiz-loading-overlay-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 20px;
  color: var(--learning-muted);
  font-size: 14px;
  line-height: 1.4;
  text-align: center;
}

.quiz-spinner {
  width: 26px;
  height: 26px;
  border: 3px solid rgba(255, 255, 255, 0.22);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: quizSpin 0.8s linear infinite;
}

@keyframes quizSpin {
  to {
    transform: rotate(360deg);
  }
}

.wa-composer {
  position: fixed;
  left: 0;
  bottom: 0;
  z-index: 100;
  width: 100%;
  max-width: 600px;
  min-width: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px;
  border-top: 0.5px solid #1c1c1e;
  background: var(--bg);
  pointer-events: none;
  visibility: hidden;
  transform: translate3d(100%, 0, 0);
  transition: transform var(--nav-duration) var(--nav-easing);
  will-change: transform;
  isolation: isolate;
}

.wa-composer.composer-visible {
  visibility: visible;
}

.wa-composer.composer-active {
  transform: translate3d(0, 0, 0);
  pointer-events: auto;
}

.wa-composer.keyboard-open {
  padding-top: 8px;
  padding-bottom: 6px;
}

.wa-composer .wa-input-pill,
.wa-composer .input-field {
  pointer-events: inherit;
}

.wa-action-icon-btn,
.wa-mic-btn,
.wa-send-btn {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: none;
  padding: 0;
  cursor: pointer;
}

.wa-action-icon-btn {
  background: transparent;
  color: var(--dim);
}

.wa-action-icon-btn svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}

.wa-mic-btn,
.wa-send-btn {
  border-radius: 50%;
  background: var(--blue);
  color: #ffffff;
}

.wa-mic-btn svg,
.wa-send-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.wa-mic-btn.recording {
  background: #ff3b30;
  box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.22);
}

.wa-send-btn:not(:disabled):active,
.wa-mic-btn:not(:disabled):active {
  background: #04488f;
  box-shadow: none;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

.wa-input-pill {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 38px;
  padding: 8px 12px;
  border-radius: 20px;
  background: var(--input);
}

.input-field {
  position: relative;
  width: 100%;
  min-height: 22px;
  max-height: 100px;
  overflow-y: auto;
  color: var(--text);
  caret-color: var(--blue);
  font-size: 16px;
  line-height: 1.35;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
  -webkit-user-select: text;
}

.input-field:empty::before {
  content: attr(placeholder);
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  color: var(--dim);
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.drift-sparks-wrap {
  position: relative;
  display: inline;
}

.drift-sparks-wrap::after {
  content: "";
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(
    90deg,
    rgba(0, 122, 255, 0.2),
    var(--blue),
    #8bd5ff,
    #007aff
  );
  box-shadow: 0 0 6px var(--blue), 0 2px 10px #39a9ff;
  animation: sparkShake 0.15s infinite alternate ease-in-out;
}

@keyframes sparkShake {
  from {
    transform: translateY(0) scaleX(0.98);
    opacity: 0.85;
  }

  to {
    transform: translateY(1px) scaleX(1.02);
    opacity: 1;
  }
}

.voice-cursor {
  display: inline-block;
  width: 3px;
  height: 1.25em;
  margin-left: 2px;
  vertical-align: -2px;
  border-radius: 2px;
  background: var(--blue);
  box-shadow: 0 0 8px var(--blue);
  animation: cursorPulse 0.4s infinite alternate ease-in-out;
}

@keyframes cursorPulse {
  from {
    background: var(--blue);
    box-shadow: 0 0 6px var(--blue);
  }

  to {
    background: #8bd5ff;
    box-shadow: 0 0 12px #39a9ff;
  }
}

.voice-inline-mic {
  display: inline-flex;
  width: 19px;
  height: 19px;
  margin-left: 4px;
  align-items: center;
  justify-content: center;
  vertical-align: -2px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 2px 8px rgba(0, 122, 255, 0.5);
}

.voice-inline-mic svg {
  width: 11px;
  height: 11px;
  fill: #ffffff;
}

.wa-prompt-container {
  grid-row: 2;
  grid-column: 1;
  position: relative;
  z-index: 2;
  min-height: 0;
  min-width: 0;
  overflow-y: auto;
  padding: 24px;
  text-align: center;
}

.wa-prompt-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin: auto;
  padding: 24px 20px;
  border: 1px solid #1e2833;
  border-radius: 16px;
  background: var(--bg);
}

.wa-prompt-card h3 {
  margin: 0;
  font-size: 18px;
}

.wa-prompt-card p {
  margin: 0;
  font-size: 14px;
  line-height: 1.4;
  color: var(--dim);
}

.wa-prompt-input,
.wa-prompt-select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #1e2833;
  border-radius: 10px;
  background: #282828;
  color: var(--text);
  font-size: 16px;
}

.wa-prompt-btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: var(--blue);
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.prompt-error {
  color: #ff7068;
  font-size: 14px;
}

#frankNameFields {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.wa-chat-items,
.wa-messages-area,
.input-field,
.wa-prompt-container,
.learning-dialog {
  scrollbar-color: var(--blue) #000000;
  scrollbar-width: thin;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: #000000;
}

::-webkit-scrollbar-thumb {
  background: var(--blue);
  border-radius: 3px;
}

.wa-msg-bubble.hakan-welcome {
  width: 100%;
  max-width: 100%;
}

.learning-entry-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  width: 100%;
  margin-top: 15px;
  margin-bottom: 5px;
}

.learning-entry-button {
  width: 100%;
  min-width: 0;
  min-height: 46px;
  padding: 11px 10px;
  border: 1px solid #ededed;
  border-radius: 24px;
  background: #ededed;
  color: #111111;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  text-align: center;
  cursor: pointer;
}

.learning-entry-button:not(:disabled):active {
  border-color: #cfcfd2;
  background: #cfcfd2;
}

.wa-msg-bubble.learning-bubble {
  width: 100%;
  max-width: 100%;
  padding: 16px 14px 10px;
  border: 1px solid var(--learning-border);
  border-radius: 20px;
  background: var(--learning-bg);
}

.learning-card {
  width: 100%;
  min-width: 0;
}

.learning-topic {
  margin-bottom: 16px;
  padding: 9px 12px;
  border-radius: 12px;
  background: #1c1c1e;
  color: var(--learning-muted);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.learning-card-title {
  margin: 0 0 16px;
  color: var(--text);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.learning-note {
  margin: 12px 0 0;
  color: var(--dim);
  font-size: 11px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.learning-hint {
  margin: 0 0 14px;
  color: var(--learning-muted);
  font-size: 13px;
  line-height: 1.45;
}

.learning-button {
  min-height: 44px;
  padding: 11px 16px;
  border: 1px solid var(--learning-border);
  border-radius: 24px;
  background: transparent;
  color: var(--text);
  font-size: 15px;
  line-height: 1.3;
  cursor: pointer;
}

.learning-button:not(:disabled):active {
  background: var(--input);
}

.learning-button.primary {
  border-color: var(--learning-action-bg);
  background: var(--learning-action-bg);
  color: var(--learning-action-text);
  font-weight: 600;
}

.learning-button.primary:not(:disabled):active {
  border-color: #cfcfd2;
  background: #cfcfd2;
}

.learning-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.learning-actions > .learning-button {
  flex: 1 1 120px;
}

.quiz-options {
  min-width: 0;
  padding: 0;
  margin: 0;
  border: 0;
}

.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-height: 48px;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid var(--learning-border);
  border-radius: 13px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}

.quiz-option.selected {
  border-color: var(--learning-selected-border);
  background: var(--learning-selected-bg);
}

.quiz-option.reviewed {
  cursor: default;
}

.quiz-option.correct {
  border-color: #a7a7ad;
}

.quiz-option.incorrect {
  border-style: dashed;
}

.quiz-option input {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  margin: 1px 0 0;
  accent-color: var(--blue);
}

.quiz-option input:disabled {
  opacity: 1;
}

.quiz-option-content {
  min-width: 0;
  flex: 1;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.quiz-result-label {
  display: block;
  margin-top: 7px;
  color: var(--learning-muted);
  font-size: 12px;
}

.quiz-feedback {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--learning-border);
  color: var(--text);
  line-height: 1.5;
}

.quiz-feedback-heading {
  margin-bottom: 10px;
  font-size: 15px;
  font-weight: 600;
}

.quiz-retry {
  color: #ffd59a;
  font-size: 14px;
  line-height: 1.45;
}

.quiz-navigation {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  margin-top: 16px;
}

.quiz-navigation .learning-button {
  min-width: 0;
}

.flash-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--learning-muted);
  font-size: 13px;
}

.flash-percent {
  flex-shrink: 0;
  padding: 3px 9px;
  border-radius: 14px;
  background: #1c1c1e;
  color: #dddddf;
}

.flash-progress {
  display: block;
  width: 100%;
  height: 6px;
  margin: 16px 0 8px;
  overflow: hidden;
  border: 0;
  border-radius: 6px;
  background: #242426;
  accent-color: var(--blue);
}

.flash-progress::-webkit-progress-bar {
  border-radius: 6px;
  background: #242426;
}

.flash-progress::-webkit-progress-value {
  border-radius: 6px;
  background: var(--blue);
}

.flash-progress::-moz-progress-bar {
  border-radius: 6px;
  background: var(--blue);
}

.flash-face {
  min-height: 230px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 0;
  text-align: center;
}

.flash-icon {
  width: 30px;
  height: 30px;
  margin-bottom: 14px;
  color: #c6c6cc;
}

.flash-icon svg {
  display: block;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.flash-label {
  margin: 0 0 22px;
  color: var(--text);
  font-size: 22px;
  font-weight: 600;
}

.flash-text {
  width: 100%;
  min-width: 0;
  color: var(--text);
  font-size: 16px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.flash-toggle {
  width: 100%;
}

.flash-navigation {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
  margin-top: 14px;
}

.flash-navigation .learning-button {
  min-width: 0;
}

.flash-restart {
  width: 100%;
  margin-top: 12px;
  border-color: transparent;
  color: #d5d5da;
}

.learning-dialog {
  width: calc(100% - 32px);
  max-width: 420px;
  max-height: 85vh;
  overflow: auto;
  padding: 22px;
  border: 1px solid var(--learning-border);
  border-radius: 20px;
  background: var(--bg);
  color: var(--text);
}

.learning-dialog::backdrop {
  background: rgba(0, 0, 0, 0.76);
}

.learning-dialog h2 {
  margin: 0 0 18px;
  font-size: 21px;
}

.learning-dialog label {
  display: block;
  margin: 14px 0 7px;
  color: #dedee3;
  font-size: 14px;
}

.learning-dialog input,
.learning-dialog select {
  width: 100%;
  min-height: 46px;
  padding: 11px 12px;
  border: 1px solid var(--learning-border);
  border-radius: 10px;
  background: var(--input);
  color: var(--text);
  font-size: 16px;
}

.learning-dialog input,
.learning-dialog select {
  box-sizing: border-box;
  min-height: 46px;
  height: 46px;
  padding-top: 0;
  padding-bottom: 0;
  line-height: 44px;
  appearance: none;
  -webkit-appearance: none;
}

.learning-dialog select {
  background-image: none;
}

.learning-dialog .learning-actions {
  margin-top: 20px;
}

.learning-dialog-feedback {
  margin: 12px 0;
  padding: 12px;
  border: 1px solid var(--learning-border);
  border-radius: 10px;
  color: #dedee3;
  font-size: 14px;
  line-height: 1.45;
  white-space: pre-wrap;
}

.profile-gate {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.profile-gate-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 340px;
  padding: 24px 20px;
  border: 1px solid #1e2833;
  border-radius: 18px;
  background: var(--bg);
}

.profile-gate-card h2 {
  margin: 0;
  font-size: 22px;
  text-align: center;
}

.profile-gate-card p {
  margin: 0 0 6px;
  color: var(--dim);
  font-size: 14px;
  line-height: 1.45;
  text-align: center;
}

.phone.gate-active #chatListView {
  opacity: 0.55;
  filter: blur(1.5px);
  pointer-events: none;
  user-select: none;
}

/* Gleiche Feldhöhe auf allen Bildschirmbreiten. */
.profile-gate .wa-prompt-select {
  min-height: 46px;
  height: 46px;
  padding-top: 0;
  padding-bottom: 0;
  line-height: 44px;
  appearance: none;
  -webkit-appearance: none;
}

.profile-gate .wa-prompt-input {
  min-height: 46px;
  height: 46px;
  padding-top: 0;
  padding-bottom: 0;
  line-height: 44px;
}

@media (max-width: 380px) {
  .wa-chat-topbar .header-logo-group {
    gap: 5px;
  }

  .wa-chat-topbar .header-logo-group img,
  .wa-chat-topbar .header-logo-group svg {
    height: 25px;
  }

  .wa-chat-topbar .header-logo-group svg {
    width: 25px;
  }

  .wa-composer {
    gap: 6px;
    padding-left: 6px;
    padding-right: 6px;
  }

  .wa-mic-btn,
  .wa-send-btn {
    width: 34px;
    height: 34px;
  }

  .wa-msg-bubble.learning-bubble {
    padding-left: 11px;
    padding-right: 11px;
  }

  .flash-face {
    min-height: 210px;
  }

  .flash-navigation .learning-button,
  .quiz-navigation .learning-button {
    padding-left: 8px;
    padding-right: 8px;
    font-size: 14px;
  }

  .learning-entry-actions {
    gap: 8px;
  }

  .learning-entry-button {
    padding-left: 8px;
    padding-right: 8px;
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #splashOverlay.splash-ready #splashGraphic {
    opacity: 1;
    transform: none !important;
  }

  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}

html.standalone-layout-test {
  height: 100vh !important;
  overflow: visible !important;
}

html.standalone-layout-test body {
  top: 0 !important;
  right: 0 !important;
  bottom: auto !important;
  left: 0 !important;
  height: 100vh !important;
  overflow: visible !important;
}

@supports (height: 100lvh) {
  html.standalone-layout-test,
  html.standalone-layout-test body {
    height: 100lvh !important;
  }
}

html.standalone-layout-test .wa-composer:not(.keyboard-open) {
  padding-bottom: 40px;
}

.wa-composer.composer-active:focus-within {
  transform: none !important;
  will-change: auto !important;
  transition: none !important;
}
</style>
</head>

<body>
<div class="phone" id="phoneContainer">
  <div id="splashOverlay" aria-hidden="true">
    <img id="splashGraphic" src="Startbildschirm.png" alt="" />
  </div>

    <div id="profileGate" class="profile-gate hidden-element" inert>
    <div class="profile-gate-card">
      <h2>Willkommen</h2>


      <p>
        Bitte gib deinen Namen ein und wähle deine Rolle aus.
      </p>


      <input
        id="gateFirstName"
        class="wa-prompt-input"
        placeholder="Vorname"
        aria-label="Vorname"
        autocomplete="given-name"
      />


      <input
        id="gateLastName"
        class="wa-prompt-input"
        placeholder="Nachname"
        aria-label="Nachname"
        autocomplete="family-name"
      />

      <select
        id="gateRole"
        class="wa-prompt-select"
        aria-label="Rolle"
      >
        <option value="student" selected>
          Schüler/-in
        </option>


        <option value="teacher">
          Lehrkraft
        </option>
      </select>


      <select
        id="gateClass"
        class="wa-prompt-select"
        aria-label="Klasse"
      >
        <option value="" disabled selected>
          Klasse auswählen …
        </option>


        <option>EiH 10a</option>
        <option>EiH 10b</option>
        <option>EiH 10c</option>
        <option>EiH 11a</option>
        <option>EiH 11b</option>
        <option>EiH 11c</option>
        <option>EiH 12</option>
      </select>


      <input
        id="gatePassword"
        class="wa-prompt-input hidden-element"
        type="password"
        placeholder="Passwort"
        aria-label="Passwort"
        autocomplete="off"
      />


      <div
        id="gateError"
        class="prompt-error hidden-element"
        role="alert"
      ></div>


      <button
        id="gateConfirmBtn"
        class="wa-prompt-btn"
        type="button"
      >
        Weiter
      </button>
    </div>
  </div>

  <div id="chatListView">
    <div class="wa-list-header">
      <div class="wa-title-row">
        <h1 class="wa-title">Chats</h1>

        <div class="header-logo-group">
          <img src="Logo-sw.png" alt="Schullogo" />
          <span class="chat-brand-icon" aria-hidden="true"></span>
        </div>
      </div>

      <div class="wa-search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="Suchen"
          aria-label="Chats durchsuchen"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>
    </div>

    <div class="wa-chat-items" id="chatItemsContainer"></div>
  </div>

  <div id="chatWindowView" aria-hidden="true" inert>
    <div class="wa-chat-topbar">
      <div class="wa-topbar-left">
        <button
          id="backBtn"
          class="wa-back-btn"
          type="button"
          aria-label="Zurück"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>

        <div class="wa-topbar-profile">
          <img id="chatAvatar" alt="" />

          <div class="wa-topbar-info">
            <div id="chatName" class="name"></div>
            <div id="chatRole" class="role"></div>
          </div>
        </div>
      </div>

      <div class="header-logo-group">
        <img src="Logo-sw.png" alt="Schullogo" />
        <span class="chat-brand-icon" aria-hidden="true"></span>
      </div>
    </div>

    <div
      id="passwordPrompt"
      class="wa-prompt-container hidden-element"
      hidden
      inert
    >
      <div class="wa-prompt-card">
        <h3>Lehrkräfte-Zugang</h3>
        <p>Frank Hiller steht ausschließlich Lehrkräften zur Verfügung.</p>

        <div id="frankNameFields" class="hidden-element">
          <input
            id="frankFirstNameInput"
            class="wa-prompt-input"
            placeholder="Vorname"
            aria-label="Vorname"
          />

          <input
            id="frankLastNameInput"
            class="wa-prompt-input"
            placeholder="Nachname"
            aria-label="Nachname"
          />
        </div>

        <input
          id="passwordInput"
          class="wa-prompt-input"
          type="password"
          placeholder="Passwort"
          aria-label="Passwort"
          autocomplete="off"
        />

        <button
          id="passwordConfirmBtn"
          class="wa-prompt-btn"
          type="button"
        >
          Chat freischalten
        </button>

        <div
          id="passwordError"
          class="prompt-error hidden-element"
          role="alert"
        ></div>
      </div>
    </div>

    <div
      id="studentPrompt"
      class="wa-prompt-container hidden-element"
      hidden
      inert
    >
      <div class="wa-prompt-card">
        <h3>Willkommen im Chat! 👋</h3>
        <p>Bitte gib deinen Namen ein und wähle deine Klasse aus:</p>

        <input
          id="studentFirstNameInput"
          class="wa-prompt-input"
          placeholder="Vorname"
          aria-label="Vorname"
        />

        <input
          id="studentLastNameInput"
          class="wa-prompt-input"
          placeholder="Nachname"
          aria-label="Nachname"
        />

        <select
          id="studentClassSelect"
          class="wa-prompt-select"
          aria-label="Klasse"
        >
          <option value="" disabled selected>Klasse auswählen …</option>
          <option>EiH 10a</option>
          <option>EiH 10b</option>
          <option>EiH 10c</option>
          <option>EiH 11a</option>
          <option>EiH 11b</option>
          <option>EiH 11c</option>
          <option>EiH 12</option>
        </select>

        <button
          id="studentConfirmBtn"
          class="wa-prompt-btn"
          type="button"
        >
          Los geht's
        </button>

        <div
          id="studentError"
          class="prompt-error hidden-element"
          role="alert"
        >
          Bitte alle Felder ausfüllen.
        </div>
      </div>
    </div>

    <div
      id="messagesDiv"
      class="wa-messages-area"
      aria-label="Chatverlauf"
    ></div>
  </div>
</div>

<div
  id="composerBar"
  class="wa-composer hidden-element"
  hidden
  inert
>
  <button
    id="uploadBtn"
    class="wa-action-icon-btn"
    type="button"
    aria-label="Datei anhängen"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 7v3h-2V7h-3V5h3V2h2v3h3v2h-3zM13 5v4h4v3h2v7c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2h8zM5 19h12l-4-5-3 4-2-3-3 4z"/>
    </svg>
  </button>

  <input
    id="fileInput"
    class="hidden-element"
    type="file"
    accept="image/*,.pdf,.docx,.txt"
  />

  <div class="wa-input-pill" id="inputPill">
    <div
      id="inputField"
      class="input-field"
      contenteditable="true"
      role="textbox"
      aria-label="Nachricht"
      aria-multiline="true"
      placeholder="Nachricht"
    ></div>
  </div>

  <button
    id="micBtn"
    class="wa-mic-btn"
    type="button"
    aria-label="Spracheingabe starten"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 14c1.66 0 3-1.34 3-3V5a3 3 0 0 0-6 0v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
    </svg>
  </button>

  <button
    id="sendBtn"
    class="wa-send-btn"
    type="button"
    aria-label="Nachricht senden"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2.01 21L23 12 2.01 3v7l15 2-15 2z"/>
    </svg>

async function startSplash() {
  if (splashStarted) return;
  splashStarted = true;

  const overlay = $("splashOverlay");
  const image = $("splashGraphic");

  if (!overlay || !image) return;

  try {
    if (typeof image.decode === "function") {
      await Promise.race([
        image.decode(),

        new Promise(resolve =>
          setTimeout(resolve, 2000)
        )
      ]);
    }
  } catch {}

  if (!image.naturalWidth && image.complete) {
    overlay.remove();
    return;
  }

  requestAnimationFrame(() => {
    if (!overlay.isConnected) return;

    if (reducedMotion.matches) {
      overlay.classList.add("splash-ready");
      setTimeout(() => overlay.remove(), 2000);
      return;
    }

    let fallbackTimer = null;

    const finishSplash = () => {
      clearTimeout(fallbackTimer);

      image.removeEventListener(
        "animationend",
        handleAnimationEnd
      );

      overlay.remove();
    };

    const handleAnimationEnd = event => {
      if (
        event.target !== image ||
        event.animationName !== "splashMotion"
      ) return;

      finishSplash();
    };

    image.addEventListener(
      "animationend",
      handleAnimationEnd
    );

    overlay.classList.add("splash-ready");

    fallbackTimer = setTimeout(
      finishSplash,
      4500
    );
  });
}

function splitSegments(text) {
  const result = [];

  const delimiters = [
    { open: "\\(", close: "\\)" },
    { open: "\\[", close: "\\]" },
    { open: "$$", close: "$$" }
  ];

  let cursor = 0;

  while (cursor < text.length) {
    let next = null;

    for (const delimiter of delimiters) {
      const start = text.indexOf(
        delimiter.open,
        cursor
      );

      if (
        start !== -1 &&
        (!next || start < next.start)
      ) {
        next = {
          ...delimiter,
          start
        };
      }
    }

    if (!next) {
      result.push({
        type: "text",
        value: text.slice(cursor)
      });

      break;
    }

    if (next.start > cursor) {
      result.push({
        type: "text",
        value: text.slice(cursor, next.start)
      });
    }

    const start =
      next.start + next.open.length;

    const end = text.indexOf(
      next.close,
      start
    );

    if (end === -1) {
      result.push({
        type: "text",
        value: text.slice(next.start)
      });

      break;
    }

    result.push({
      type: "math",
      value: text.slice(start, end)
    });

    cursor = end + next.close.length;
  }

  return result;
}

function normalizeProse(text) {
  return text.replace(
    /(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)[ \t]*(?:EUR\b|Euro\b|€)/gi,
    (match, value) => {
      const number = Number(
        value.replace(/\./g, "").replace(",", ".")
      );

      return Number.isFinite(number)
        ? number.toLocaleString("de-DE", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }) + " EUR"
        : match;
    }
  ).replace(
    /(\d)[ \t]*(EUR\b|Euro\b|€|Stück\b|kg\b|cm\b|mm\b|km\b|Prozent\b|%)/gi,
    (match, number, unit) =>
      `${number} ${/^(euro|€)$/i.test(unit) ? "EUR" : unit}`
  );
}

function proseHtml(text, sources) {
  const html = escapeHtml(normalizeProse(text))
    .replace(
      /\*\*([^\n]+?)\*\*/g,
      "<strong>$1</strong>"
    )
    .replace(
      /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
      "<strong>$1</strong>"
    )
    .replace(
      /(?<![\w_])_([^_\n]+)_(?![\w_])/g,
      "<em>$1</em>"
    )
    .replace(
      /~([^~\n]+)~/g,
      "<del>$1</del>"
    );

  return html.replace(
    /\[(\d+)\]/g,
    (match, number) => {
      const source = sources.find(
        item => item.id === Number(number)
      );

      const url = source && safeUrl(source.url);

      if (!url) return match;

      return (
        `<a class="web-citation" ` +
        `href="${escapeHtml(url)}" ` +
        `target="_blank" rel="noopener noreferrer" ` +
        `title="${escapeHtml(source.title || url)}">` +
        `[${number}]</a>`
      );
    }
  );
}

function installFormulaScrollbar(
  viewport,
  content,
  track,
  thumb
) {
  let dead = false;
  let drag = null;

  function update() {
    if (dead || !viewport.isConnected) return;

    const maximum = Math.max(
      0,
      viewport.scrollWidth - viewport.clientWidth
    );

    const overflows = maximum > 2;

    track.classList.toggle(
      "hidden-element",
      !overflows
    );

    viewport.tabIndex = overflows ? 0 : -1;

    if (!overflows) return;

    const width = track.clientWidth;

    const thumbWidth = Math.min(
      width,
      Math.max(
        28,
        width * viewport.clientWidth /
          viewport.scrollWidth
      )
    );

    const travel = Math.max(
      0,
      width - thumbWidth
    );

    thumb.style.width = `${thumbWidth}px`;

    thumb.style.transform =
      `translateX(${travel * viewport.scrollLeft / maximum}px)`;

    track.setAttribute(
      "aria-valuemax",
      String(Math.round(maximum))
    );

    track.setAttribute(
      "aria-valuenow",
      String(Math.round(viewport.scrollLeft))
    );

    track.setAttribute(
      "aria-valuetext",
      `${Math.round(100 * viewport.scrollLeft / maximum)} Prozent`
    );
  }

  function pointToScroll(x) {
    const rect = track.getBoundingClientRect();

    const maximum =
      viewport.scrollWidth - viewport.clientWidth;

    const thumbWidth =
      thumb.getBoundingClientRect().width;

    const travel = Math.max(
      1,
      rect.width - thumbWidth
    );

    viewport.scrollLeft = Math.max(
      0,
      Math.min(
        1,
        (x - rect.left - thumbWidth / 2) /
          travel
      )
    ) * maximum;

    update();
  }

  track.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;

    event.preventDefault();

    const rect = thumb.getBoundingClientRect();

    if (
      event.clientX < rect.left ||
      event.clientX > rect.right
    ) {
      pointToScroll(event.clientX);
    }

    drag = {
      x: event.clientX,
      scroll: viewport.scrollLeft
    };

    track.setPointerCapture(event.pointerId);
  });

  track.addEventListener("pointermove", event => {
    if (!drag) return;

    const travel = Math.max(
      1,
      track.clientWidth -
        thumb.getBoundingClientRect().width
    );

    viewport.scrollLeft =
      drag.scroll +
      (event.clientX - drag.x) *
      (
        viewport.scrollWidth -
        viewport.clientWidth
      ) /
      travel;

    update();
  });

  for (const name of [
    "pointerup",
    "pointercancel",
    "lostpointercapture"
  ]) {
    track.addEventListener(name, () => {
      drag = null;
    });
  }

  track.addEventListener("keydown", event => {
    const amount = Math.max(
      40,
      viewport.clientWidth * 0.4
    );

    if (event.key === "ArrowRight") {
      viewport.scrollLeft += amount;
    } else if (event.key === "ArrowLeft") {
      viewport.scrollLeft -= amount;
    } else if (event.key === "Home") {
      viewport.scrollLeft = 0;
    } else if (event.key === "End") {
      viewport.scrollLeft = viewport.scrollWidth;
    } else {
      return;
    }

    event.preventDefault();
    update();
  });

  viewport.addEventListener(
    "scroll",
    update,
    { passive: true }
  );

  const observer = window.ResizeObserver
    ? new ResizeObserver(update)
    : null;

  observer?.observe(viewport);
  observer?.observe(content);

  window.addEventListener("resize", update);
  requestAnimationFrame(update);

  document.fonts?.ready.then(() => {
    if (!dead) update();
  });

  formulaCleanups.add(() => {
    dead = true;
    observer?.disconnect();

    window.removeEventListener("resize", update);

    viewport.removeEventListener(
      "scroll",
      update
    );
  });
}

function appendFormula(container, latex) {
  const frame = document.createElement("div");
  frame.className = "wa-formula-frame";

  const viewport = document.createElement("div");
  viewport.className = "wa-formula";
  viewport.id = `formula-${++formulaSequence}`;

  viewport.setAttribute(
    "aria-label",
    "Formel, bei Überbreite horizontal scrollbar"
  );

  const content = document.createElement("div");
  content.className = "wa-formula-content";

  try {
    if (!window.katex) {
      throw new Error("KaTeX nicht geladen");
    }

    window.katex.render(latex, content, {
      displayMode: true,
      throwOnError: true,
      trust: false,
      strict: "warn",
      output: "htmlAndMathml"
    });
  } catch (error) {
    content.classList.add("wa-formula-fallback");
    content.textContent = latex;

    console.warn(
      "Formeldarstellung:",
      error.message
    );
  }

  const track = document.createElement("div");
  track.className = "formula-scrollbar hidden-element";
  track.tabIndex = 0;

  track.setAttribute("role", "scrollbar");

  track.setAttribute(
    "aria-label",
    "Formel horizontal verschieben"
  );

  track.setAttribute(
    "aria-orientation",
    "horizontal"
  );

  track.setAttribute(
    "aria-controls",
    viewport.id
  );

  track.setAttribute("aria-valuemin", "0");
  track.setAttribute("aria-valuemax", "0");
  track.setAttribute("aria-valuenow", "0");

  const thumb = document.createElement("div");
  thumb.className = "formula-scroll-thumb";

  track.appendChild(thumb);
  viewport.appendChild(content);
  frame.append(viewport, track);
  container.appendChild(frame);

  installFormulaScrollbar(
    viewport,
    content,
    track,
    thumb
  );
}

function renderContent(container, text, sources = []) {
  const segments = splitSegments(
    String(text || "")
  );

  segments.forEach((segment, index) => {
    if (segment.type === "math") {
      appendFormula(container, segment.value);
      return;
    }

    let value = segment.value;

    if (segments[index - 1]?.type === "math") {
      value = value.replace(
        /^[ \t]*\.(?=[ \t\r\n]|$)/,
        ""
      );

      value = value.replace(
        /^[ \t]*\r?\n(?:[ \t]*\r?\n)*/,
        ""
      );
    }

    if (segments[index + 1]?.type === "math") {
      value = value.replace(
        /(?:\r?\n[ \t]*)+$/,
        ""
      );
    }

    if (!value) return;

    const span = document.createElement("span");
    span.className = "wa-prose";
    span.innerHTML = proseHtml(value, sources);

    container.appendChild(span);
  });
}

function nearBottom() {
  return (
    messagesDiv.scrollHeight -
    messagesDiv.scrollTop -
    messagesDiv.clientHeight
  ) < 100;
}

function toBottom() {
  requestAnimationFrame(() => {
    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;
  });
}

function positionComposer(
  viewport,
  width,
  left,
  keyboardOpen
) {
  const containerWidth = Math.min(600, width);

  composer.style.width = `${containerWidth}px`;

  composer.style.left =
    `${left + Math.max(0, (width - containerWidth) / 2)}px`;

  composer.classList.toggle(
    "keyboard-open",
    keyboardOpen
  );

  const standalone =
    standaloneDisplay.matches ||
    navigator.standalone === true;

  if (keyboardOpen) {
    const visibleTop =
      viewport?.offsetTop || 0;

    const visibleHeight =
      viewport?.height || window.innerHeight;

    const composerHeight = composer.hidden
      ? 0
      : composer.offsetHeight;

    composer.style.bottom = "auto";

    composer.style.top = `${Math.max(
      visibleTop,
      visibleTop + visibleHeight - composerHeight
    )}px`;
  } else if (standalone) {
    composer.style.top = "auto";
    composer.style.bottom = "0px";
  } else {
    composer.style.top = "auto";

    composer.style.bottom =
      `${COMPOSER_BOTTOM_GAP}px`;
  }

  if (!composer.hidden && contentVisible) {
    const phoneRect =
      phone.getBoundingClientRect();

    const composerRect =
      composer.getBoundingClientRect();

    const overlap = Math.max(
      0,
      phoneRect.bottom - composerRect.top
    );

    messagesDiv.style.setProperty(
      "--composer-reserve",
      `${overlap + 12}px`
    );
  } else {
    messagesDiv.style.setProperty(
      "--composer-reserve",
      "12px"
    );
  }
}

function syncViewport() {
  viewportFrame = 0;

  const viewport = window.visualViewport;

  const width =
    viewport?.width || window.innerWidth;

  const visibleHeight =
    viewport?.height || window.innerHeight;

  const viewportTop = Math.max(
    0,
    viewport?.offsetTop || 0
  );

  const viewportLeft = Math.max(
    0,
    viewport?.offsetLeft || 0
  );

  const normalScale =
    Math.abs((viewport?.scale || 1) - 1) < 0.05;

  const standalone =
    standaloneDisplay.matches ||
    navigator.standalone === true;

  const active = document.activeElement;

  const editing = Boolean(
    active &&
    (
      active.matches(
        "input:not([type='file']), textarea, select"
      ) ||
      active.isContentEditable
    )
  );

  if (
    !baselineWidth ||
    Math.abs(width - baselineWidth) > 100
  ) {
    baselineWidth = width;
    baselineHeight = visibleHeight;
  }

  if (!editing && normalScale) {
    baselineHeight = Math.max(
      baselineHeight,
      visibleHeight
    );
  }

  const keyboardReference = Math.max(
    baselineHeight,
    window.innerHeight,
    document.documentElement.clientHeight
  );

  const keyboardOpen =
    editing &&
    normalScale &&
    keyboardReference - visibleHeight > 120;

  keyboardCurrentlyOpen = keyboardOpen;

  document.documentElement.classList.toggle(
    "standalone-layout-test",
    standalone
  );

  const useStandaloneRest =
    standalone &&
    normalScale &&
    !keyboardOpen;

  const containerWidth =
    Math.min(600, width);

  phone.style.width = `${containerWidth}px`;

  phone.style.left =
    `${viewportLeft + Math.max(0, (width - containerWidth) / 2)}px`;

  phone.classList.toggle(
    "keyboard-open",
    keyboardOpen
  );

  phone.classList.toggle(
    "standalone-rest",
    useStandaloneRest
  );

  if (useStandaloneRest) {
    phone.style.top = "0px";
    phone.style.bottom = "0px";
    phone.style.height = "auto";
  } else {
    phone.style.top = `${viewportTop}px`;
    phone.style.bottom = "auto";
    phone.style.height = `${visibleHeight}px`;
  }

  positionComposer(
    viewport,
    width,
    viewportLeft,
    keyboardOpen
  );

  if (
    currentPerson &&
    followBottom &&
    !messagesDiv.hidden
  ) {
    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;
  }
}

function scheduleViewport() {
  if (!viewportFrame) {
    viewportFrame = requestAnimationFrame(
      syncViewport
    );
  }
}

function settleViewport() {
  scheduleViewport();

  for (const timer of viewportTimers) {
    clearTimeout(timer);
  }

  viewportTimers.clear();

  for (const delay of [80, 180, 350, 600, 900]) {
    const timer = setTimeout(() => {
      viewportTimers.delete(timer);
      scheduleViewport();
    }, delay);

    viewportTimers.add(timer);
  }
}

function installViewport() {
  const viewport = window.visualViewport;

  viewport?.addEventListener(
    "resize",
    scheduleViewport
  );

  viewport?.addEventListener(
    "scroll",
    scheduleViewport
  );

  standaloneDisplay.addEventListener?.(
    "change",
    () => {
      baselineHeight = 0;
      baselineWidth = 0;
      settleViewport();
    }
  );

  window.addEventListener(
    "resize",
    settleViewport
  );

  window.addEventListener(
    "scroll",
    scheduleViewport,
    { passive: true }
  );

  window.addEventListener(
    "pageshow",
    settleViewport
  );

  window.addEventListener(
    "orientationchange",
    () => {
      baselineHeight = 0;
      baselineWidth = 0;
      settleViewport();
    }
  );

  document.addEventListener(
    "visibilitychange",
    () => {
      if (!document.hidden) {
        settleViewport();
      }
    }
  );

  document.addEventListener(
    "focusin",
    event => {
      followBottom =
        event.target === input &&
        nearBottom();

      settleViewport();
    }
  );

  document.addEventListener(
    "focusout",
    settleViewport
  );

  messagesDiv.addEventListener(
    "touchstart",
    () => {
      followBottom = false;
    },
    { passive: true }
  );

  messagesDiv.addEventListener(
    "wheel",
    () => {
      followBottom = false;
    },
    { passive: true }
  );

  if (window.ResizeObserver) {
    const composerObserver =
      new ResizeObserver(scheduleViewport);

    composerObserver.observe(composer);
  }

  syncViewport();
}

function autoGreetingStorageKey(person) {
  return "cwe_auto_greeting_v1:" + JSON.stringify([
    person,
    userProfile?.firstName || "",
    userProfile?.lastName || "",
    userProfile?.class || ""
  ]);
}

function readAutoGreetingRecord(person) {
  const key = autoGreetingStorageKey(person);

  if (autoGreetingMemory.has(key)) {
    return autoGreetingMemory.get(key);
  }

  let record = {};

  try {
    record = JSON.parse(stored(key) || "{}");
  } catch {}

  if (
    !record ||
    typeof record !== "object" ||
    Array.isArray(record)
  ) {
    record = {};
  }

  autoGreetingMemory.set(key, record);

  return record;
}

function writeAutoGreetingRecord(person, record) {
  const key = autoGreetingStorageKey(person);

  autoGreetingMemory.set(key, record);

  try {
    localStorage.setItem(
      key,
      JSON.stringify(record)
    );
  } catch {}
}

function rememberBotInteraction(person, timestamp) {
  if (!userProfile) return;

  const time = new Date(timestamp).getTime();

  if (
    !Number.isFinite(time) ||
    time <= 0
  ) {
    return;
  }

  const record = readAutoGreetingRecord(person);

  record.lastInteractionAt = Math.max(
    Number(record.lastInteractionAt) || 0,
    time
  );

  lastInteraction[person] = Math.max(
    Number(lastInteraction[person]) || 0,
    record.lastInteractionAt
  );

  writeAutoGreetingRecord(person, record);
}

function latestBotInteraction(person) {
  const record = readAutoGreetingRecord(person);

  let latest = Math.max(
    Number(record.lastInteractionAt) || 0,
    Number(lastInteraction[person]) || 0
  );

  for (const message of histories[person]) {
    if (
      message.isError ||
      message.isStatus ||
      message.excludeFromModel
    ) {
      continue;
    }

    const time = new Date(message.timestamp).getTime();

    if (Number.isFinite(time)) {
      latest = Math.max(latest, time);
    }
  }

  return latest;
}

function autoGreetingIsDue(
  person,
  now = Date.now()
) {
  const previous = latestBotInteraction(person);

  if (!previous) {
    return true;
  }

  return (
    dateKey(previous) !== dateKey(now) &&
    now - previous >= AUTO_GREETING_MIN_PAUSE_MS
  );
}

function cancelAutoGreeting(person) {
  const job = autoGreetingTimers.get(person);

  if (job) {
    clearTimeout(job.timer);
  }

  autoGreetingTimers.delete(person);
}

function restorePreviousAutoGreeting(person) {
  if (histories[person].length) return;

  const record = readAutoGreetingRecord(person);
  const timestamp = Number(record.greetingAt);

  if (
    typeof record.greetingText !== "string" ||
    !record.greetingText.trim() ||
    !Number.isFinite(timestamp) ||
    timestamp <= 0
  ) {
    return;
  }

  histories[person].push({
    type: "text",
    who: "bot",
    text: record.greetingText,
    timestamp: new Date(timestamp),
    isAutoGreeting: true,
    isHakanWelcome: person === "hakan"
  });
}

function startAutoGreeting(person) {
  if (
    !person ||
    !userProfile ||
    !contentVisible ||
    currentPerson !== person ||
    navigationState !== "chat" ||
    pending.has(person) ||
    autoGreetingTimers.has(person) ||
    learningDialog.open
  ) {
    return;
  }

  restorePreviousAutoGreeting(person);

  const previous = latestBotInteraction(person);

  if (previous > 0) {
    lastInteraction[person] = previous;
  }

  if (!autoGreetingIsDue(person)) {
    renderMessages(person);
    return;
  }

  const token = navigationToken;
  const job = {};

  job.timer = setTimeout(() => {
    if (autoGreetingTimers.get(person) !== job) {
      return;
    }

    autoGreetingTimers.delete(person);

    if (
      currentPerson !== person ||
      navigationState !== "chat" ||
      navigationToken !== token ||
      !contentVisible ||
      pending.has(person) ||
      learningDialog.open ||
      !autoGreetingIsDue(person)
    ) {
      if (currentPerson === person) {
        renderMessages(person);
      }

      return;
    }

    const record = readAutoGreetingRecord(person);
    const variants = autoGreetingVariants[person];

    const available = variants
      .map((variant, index) => index)
      .filter(index => index !== record.lastVariant);

    const variantIndex = available[
      Math.floor(Math.random() * available.length)
    ];

    const name = person === "frank"
      ? [
          cleanDisplayName(userProfile.firstName),
          cleanDisplayName(userProfile.lastName)
        ]
          .filter(Boolean)
          .join(" ")
      : cleanDisplayName(userProfile.firstName);

    const nameSuffix = name
      ? (person === "frank" ? ", " : " ") + name
      : "";

    const text = variants[variantIndex](nameSuffix);
    const timestamp = new Date();

    histories[person].push({
      type: "text",
      who: "bot",
      text,
      timestamp,
      isAutoGreeting: true,
      isHakanWelcome: person === "hakan"
    });

    record.lastVariant = variantIndex;
    record.greetingText = text;
    record.greetingAt = timestamp.getTime();
    record.lastInteractionAt = timestamp.getTime();

    writeAutoGreetingRecord(person, record);

    lastInteraction[person] = timestamp.getTime();

    renderMessages(person);

    updatePreview(
      person,
      text,
      timestamp
    );

    updateComposer();
  }, AUTO_GREETING_DELAY_MS);

  autoGreetingTimers.set(person, job);

  renderMessages(person);
}

function normalizeSources(value) {
  if (!Array.isArray(value)) {
    return [];
  }

  const result = [];
  const seen = new Set();

  for (const source of value) {
    if (!source || typeof source !== "object") {
      continue;
    }

    const url = safeUrl(source.url);

    if (!url || seen.has(url)) {
      continue;
    }

    seen.add(url);

    const suppliedId = Number(source.id);

    result.push({
      id:
        Number.isInteger(suppliedId) &&
        suppliedId > 0
          ? suppliedId
          : result.length + 1,

      url,

      title:
        typeof source.title === "string" &&
        source.title.trim()
          ? source.title.trim()
          : new URL(url).hostname
    });
  }

  return result;
}

function normalizeMaterialContext(value) {
  if (!value || typeof value !== "object") {
    return null;
  }

  return {
    basis:
      typeof value.basis === "string"
        ? value.basis
        : "",

    materialUsed:
      value.materialUsed === true,

    materialState:
      typeof value.materialState === "string"
        ? value.materialState
        : "",

    materialUnavailable:
      value.materialUnavailable === true,

    webSearchUsed:
      value.webSearchUsed === true,

    webSearchPerformed:
      value.webSearchPerformed === true,

    currentCheckRequired:
      value.currentCheckRequired === true,

    researchedAt:
      typeof value.researchedAt === "string"
        ? value.researchedAt
        : null,

    message:
      typeof value.message === "string"
        ? value.message
        : "",

    sources: normalizeSources(value.sources)
  };
}
