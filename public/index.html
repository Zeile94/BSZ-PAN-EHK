<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
/>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CWE Chat" />
<title>CWE Chat</title>

<link rel="preload" as="image" href="Startbildschirm.png" />
<link rel="preload" as="image" href="Logo-sw.png" />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
/>
<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
></script>

<style>
:root {
  --bg: #0a0a0a;
  --chat: #101010;
  --profile: #18222c;
  --input: #282828;
  --user: #04488f;
  --bot: #242625;
  --text: #ffffff;
  --dim: #8e8e93;
  --blue: #007aff;
  --ticks: #34b7f1;
  --transition: 0.32s cubic-bezier(0.25, 1, 0.5, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 16px var(--font);
  overscroll-behavior: none;
}

button, input, select { font-family: inherit; }
button { -webkit-tap-highlight-color: transparent; }

button:focus-visible,
input:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

.phone {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  max-width: 600px;
  overflow: hidden;
  background: var(--bg);
  isolation: isolate;
}

#splashOverlay {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  pointer-events: none;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

#splashOverlay.fade-out { opacity: 0; visibility: hidden; }

#splashGraphic {
  max-height: 240px;
  max-width: 80%;
  object-fit: contain;
}

#chatListView, #chatWindowView {
  position: absolute;
  inset: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

#chatListView {
  z-index: 40;
  background: var(--bg);
  transform: translate3d(0,0,0);
  opacity: 1;
  transition: transform var(--transition), opacity 0.32s ease;
  will-change: transform, opacity;
}

#chatListView.in-background {
  transform: translate3d(-20%,0,0);
  opacity: 0.6;
  pointer-events: none;
}

#chatWindowView {
  z-index: 50;
  background: var(--chat);
  transform: translate3d(100%,0,0);
  transition: transform var(--transition);
  will-change: transform;
  visibility: hidden;
  pointer-events: none;
}

#chatWindowView.is-visible { visibility: visible; }

#chatWindowView.active-chat {
  transform: translate3d(0,0,0);
  pointer-events: auto;
}

.wa-list-header {
  flex: 0 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.wa-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 42px;
}

.wa-title {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.header-logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 32px;
  flex-shrink: 0;
}

.header-logo-group img {
  height: 32px;
  width: auto;
  object-fit: contain;
}

.header-logo-group svg {
  display: block;
  width: 32px;
  height: 32px;
  fill: #fff;
}

.wa-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: #1c1c1e;
}

.wa-search-box svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  fill: var(--dim);
}

.wa-search-box input {
  width: 100%;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 16px;
}

.wa-chat-items {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.wa-chat-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: none;
  border-bottom: 0.5px solid #1c1c1e;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background 0.15s ease;
}

.wa-chat-item.selected-tap,
.wa-chat-item:active { background: #2c2c2e; }

.avatar-wrap { width: 54px; height: 54px; flex-shrink: 0; }

.avatar-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.wa-chat-item .name {
  font-size: 17px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.time { font-size: 13px; color: var(--dim); flex-shrink: 0; }

.role-subtitle {
  font-size: 13px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.info-bottom {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 18px;
  overflow: hidden;
  color: var(--dim);
  font-size: 14px;
}

.ticks-preview { display: inline-flex; flex-shrink: 0; }

.ticks-preview svg, .wa-blue-check svg {
  display: block;
  width: 15px;
  height: 15px;
  fill: var(--ticks);
}

.last-msg {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-chat-topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: max(16px, env(safe-area-inset-top)) 12px 10px;
  border-bottom: 0.5px solid #1c1c1e;
  background: var(--bg);
  z-index: 2;
}

.wa-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.wa-back-btn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.08);
  background: var(--profile);
  cursor: pointer;
}

.wa-back-btn svg { width: 22px; height: 22px; fill: #fff; }

.wa-topbar-profile {
  flex: 1;
  min-width: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 14px 4px 4px;
  border: 0.5px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  background: var(--profile);
}

.wa-topbar-profile img {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.wa-topbar-info { min-width: 0; }

.wa-topbar-info .name, .wa-topbar-info .role {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.wa-topbar-info .name { font-size: 15px; font-weight: 600; }
.wa-topbar-info .role { font-size: 11px; color: var(--dim); }

.wa-messages-area {
  flex: 1 1 0%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px;
}

.wa-date-pill {
  align-self: center;
  flex-shrink: 0;
  padding: 5px 12px;
  margin: 10px 0;
  border-radius: 8px;
  background: #161616;
  font-size: 12px;
  font-weight: 600;
}

.wa-msg-bubble {
  max-width: 92%;
  min-width: 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 8px 12px 6px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.38;
}

.wa-msg-bubble.user {
  align-self: flex-end;
  background: var(--user);
  border-bottom-right-radius: 4px;
}

.wa-msg-bubble.bot {
  align-self: flex-start;
  background: var(--bot);
  border-bottom-left-radius: 4px;
}

.wa-msg-bubble.error { border: 1px solid rgba(255,100,100,0.5); }
.wa-msg-text { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.wa-prose { white-space: pre-wrap; }

.wa-formula {
  display: block;
  min-width: 0;
  max-width: 100%;
  margin: 1.25em 0;
  padding: 0.45em 0.15em 0.65em;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  word-break: normal;
  overflow-wrap: normal;
}

.wa-formula .katex-display { margin: 0; text-align: left; }
.wa-formula .katex-display > .katex { text-align: left; }
.wa-formula .katex { font-size: 1em; }

.wa-formula .katex .text,
.wa-formula .katex .text .textrm { font-family: var(--font); }

.wa-formula-fallback {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #ffd59a;
}

.wa-msg-meta {
  align-self: flex-end;
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 2px;
  font-size: 11px;
  color: rgba(255,255,255,0.65);
}

.wa-msg-bubble.bot .wa-msg-meta { color: var(--dim); }

.wa-doc-row { display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.wa-doc-icon { font-size: 22px; }

.wa-img-preview {
  max-width: 100%;
  max-height: 400px;
  object-fit: contain;
  border-radius: 10px;
}

.web-citation {
  display: inline;
  color: #9ccaff;
  font-size: 0.85em;
  text-decoration: none;
  white-space: nowrap;
}

.web-sources {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.12);
  font-size: 12px;
}

.web-sources a { color: #9ccaff; text-decoration: none; overflow-wrap: anywhere; }

.technical-warning {
  margin-top: 8px;
  color: #ffd59a;
  font-size: 12px;
  white-space: pre-wrap;
}

.wa-typing {
  align-self: flex-start;
  flex-shrink: 0;
  display: flex;
  gap: 5px;
  padding: 10px 14px;
  border-radius: 14px 14px 14px 4px;
  background: var(--bot);
}

.wa-typing-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dim);
  animation: bounce 1.2s infinite ease-in-out;
}

.wa-typing-dot:nth-child(2) { animation-delay: 0.2s; }
.wa-typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.wa-composer {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 14px 10px max(14px, env(safe-area-inset-bottom));
  border-top: 0.5px solid #1c1c1e;
  background: var(--bg);
  z-index: 2;
}

.phone.keyboard-open .wa-composer { padding-top: 10px; padding-bottom: 8px; }

.wa-action-icon-btn, .wa-mic-btn {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: none;
  padding: 0;
  cursor: pointer;
}

.wa-action-icon-btn { background: transparent; color: var(--dim); }
.wa-action-icon-btn svg { width: 26px; height: 26px; fill: currentColor; }
.wa-mic-btn { border-radius: 50%; background: var(--blue); color: #fff; }
.wa-mic-btn svg { width: 20px; height: 20px; fill: currentColor; }
.wa-mic-btn.recording { background: #e23d3d; }
button:disabled { opacity: 0.45; cursor: default; }

.wa-input-pill {
  flex: 1;
  min-width: 0;
  min-height: 38px;
  padding: 8px 14px;
  border-radius: 20px;
  background: var(--input);
}

.input-field {
  width: 100%;
  min-height: 22px;
  max-height: 100px;
  overflow-y: auto;
  outline: none;
  color: var(--text);
  font-size: 16px;
  line-height: 1.35;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
  -webkit-user-select: text;
}

.input-field:empty::before {
  content: attr(placeholder);
  color: var(--dim);
  pointer-events: none;
}

.drift-sparks-wrap { position: relative; display: inline; }

.drift-sparks-wrap::after {
  content: "";
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(
    90deg,
    rgba(255,69,0,0.2),
    #ff4500,
    #ffd700,
    #ff3b30
  );
  box-shadow: 0 0 6px #ff4500, 0 2px 10px #ff3b30;
  animation: sparkShake 0.15s infinite alternate ease-in-out;
}

@keyframes sparkShake {
  from { transform: translateY(0) scaleX(0.98); opacity: 0.85; }
  to { transform: translateY(1px) scaleX(1.02); opacity: 1; }
}

.voice-cursor {
  display: inline-block;
  width: 3px;
  height: 1.25em;
  margin-left: 2px;
  vertical-align: -2px;
  border-radius: 2px;
  background: #ff3b30;
  box-shadow: 0 0 8px #ff4500;
  animation: cursorPulse 0.4s infinite alternate ease-in-out;
}

@keyframes cursorPulse {
  from { background: #ff3b30; box-shadow: 0 0 6px #ff4500; }
  to { background: #ffd700; box-shadow: 0 0 12px #ff4500; }
}

.voice-inline-mic {
  display: inline-flex;
  width: 19px;
  height: 19px;
  margin-left: 4px;
  align-items: center;
  justify-content: center;
  vertical-align: -2px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 2px 8px rgba(0,122,255,0.5);
}

.voice-inline-mic svg { width: 11px; height: 11px; fill: #fff; }

.wa-prompt-container {
  flex: 1 1 0%;
  min-height: 0;
  overflow-y: auto;
  padding: 24px;
  text-align: center;
}

.wa-prompt-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin: auto;
  padding: 24px 20px;
  border: 1px solid #1e2833;
  border-radius: 16px;
  background: var(--bg);
}

.wa-prompt-card h3 { margin: 0; font-size: 18px; }
.wa-prompt-card p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--dim); }

.wa-prompt-input, .wa-prompt-select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #1e2833;
  border-radius: 10px;
  background: #282828;
  color: var(--text);
  font-size: 16px;
}

.wa-prompt-btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: var(--blue);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.prompt-error { color: #ff7068; font-size: 14px; }
#frankNameFields { display: flex; flex-direction: column; gap: 10px; }
.hidden-element { display: none !important; }

.wa-chat-items, .wa-messages-area, .input-field,
.wa-formula, .wa-prompt-container {
  scrollbar-color: var(--blue) #000;
  scrollbar-width: thin;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #000; }
::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 3px; }

@media (max-width: 380px) {
  .wa-chat-topbar .header-logo-group { gap: 5px; }
  .wa-chat-topbar .header-logo-group img,
  .wa-chat-topbar .header-logo-group svg { height: 25px; }
  .wa-chat-topbar .header-logo-group svg { width: 25px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="phone" id="phoneContainer">
  <div id="splashOverlay">
    <img id="splashGraphic" src="Startbildschirm.png" alt="CWE Chat" />
  </div>

  <div id="chatListView">
    <div class="wa-list-header">
      <div class="wa-title-row">
        <h1 class="wa-title">Chats</h1>
        <div class="header-logo-group">
          <img src="Logo-sw.png" alt="Schullogo" />
          <span class="chat-brand-icon" aria-hidden="true"></span>
        </div>
      </div>

      <div class="wa-search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          id="searchInput"
          type="search"
          placeholder="Suchen"
          aria-label="Chats durchsuchen"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>
    </div>
    <div class="wa-chat-items" id="chatItemsContainer"></div>
  </div>

  <div id="chatWindowView" aria-hidden="true">
    <div class="wa-chat-topbar">
      <div class="wa-topbar-left">
        <button id="backBtn" class="wa-back-btn" type="button" aria-label="Zurück">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        <div class="wa-topbar-profile">
          <img id="chatAvatar" alt="" />
          <div class="wa-topbar-info">
            <div id="chatName" class="name"></div>
            <div id="chatRole" class="role"></div>
          </div>
        </div>
      </div>
      <div class="header-logo-group">
        <img src="Logo-sw.png" alt="Schullogo" />
        <span class="chat-brand-icon" aria-hidden="true"></span>
      </div>
    </div>

    <div id="passwordPrompt" class="wa-prompt-container hidden-element">
      <div class="wa-prompt-card">
        <h3>Lehrkräfte-Zugang</h3>
        <p>Frank Hiller steht ausschließlich Lehrkräften zur Verfügung.</p>
        <div id="frankNameFields" class="hidden-element">
          <input id="frankFirstNameInput" class="wa-prompt-input" placeholder="Vorname" aria-label="Vorname" />
          <input id="frankLastNameInput" class="wa-prompt-input" placeholder="Nachname" aria-label="Nachname" />
        </div>
        <input id="passwordInput" class="wa-prompt-input" type="password" placeholder="Passwort" aria-label="Passwort" autocomplete="off" />
        <button id="passwordConfirmBtn" class="wa-prompt-btn" type="button">Chat freischalten</button>
        <div id="passwordError" class="prompt-error hidden-element" role="alert"></div>
      </div>
    </div>

    <div id="studentPrompt" class="wa-prompt-container hidden-element">
      <div class="wa-prompt-card">
        <h3>Willkommen im Chat! 👋</h3>
        <p>Bitte gib deinen Namen ein und wähle deine Klasse aus:</p>
        <input id="studentFirstNameInput" class="wa-prompt-input" placeholder="Vorname" aria-label="Vorname" />
        <input id="studentLastNameInput" class="wa-prompt-input" placeholder="Nachname" aria-label="Nachname" />
        <select id="studentClassSelect" class="wa-prompt-select" aria-label="Klasse">
          <option value="" disabled selected>Klasse auswählen …</option>
          <option>EiH 10a</option><option>EiH 10b</option><option>EiH 10c</option>
          <option>EiH 11a</option><option>EiH 11b</option><option>EiH 11c</option>
          <option>EiH 12</option>
        </select>
        <button id="studentConfirmBtn" class="wa-prompt-btn" type="button">Los geht's</button>
        <div id="studentError" class="prompt-error hidden-element" role="alert">Bitte alle Felder ausfüllen.</div>
      </div>
    </div>

    <div id="messagesDiv" class="wa-messages-area" aria-label="Chatverlauf"></div>

    <div id="composerBar" class="wa-composer">
      <button id="uploadBtn" class="wa-action-icon-btn" type="button" aria-label="Datei anhängen">
        <svg viewBox="0 0 24 24" aria-hidden="true">

const viewportTimers = new Set();
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

let swipe = null;

const micPath = "M12 14c1.66 0 3-1.34 3-3V5a3 3 0 0 0-6 0v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z";

const ticksSvg = `<svg viewBox="0 0 16 15" aria-hidden="true"><path d="M15.01 3.316l-.478-.372a.365.365 0 0 0-.51.063L8.666 9.879a.32.32 0 0 1-.484.033l-.358-.325a.319.319 0 0 0-.484.032l-.378.483a.418.418 0 0 0 .036.541l1.32 1.266c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.064-.512zm-4.1 0l-.478-.372a.365.365 0 0 0-.51.063L4.566 9.879a.32.32 0 0 1-.484.033L1.891 7.769a.366.366 0 0 0-.515.006l-.423.433a.364.364 0 0 0 .006.514l3.258 3.185c.143.14.361.125.484-.033l6.272-8.048a.366.366 0 0 0-.063-.51z"/></svg>`;

const brandSvg = `<svg viewBox="0 0 448 512" aria-hidden="true"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>`;

function escapeHtml(value) {
  const element = document.createElement("div");
  element.textContent = String(value);
  return element.innerHTML;
}

function safeUrl(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? url.href : null;
  } catch {
    return null;
  }
}

function stored(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function saveProfile(profile) {
  userProfile = profile;
  try {
    localStorage.setItem("cwe_user_firstname", profile.firstName);
    localStorage.setItem("cwe_user_lastname", profile.lastName);
    localStorage.setItem("cwe_student_class", profile.class || "");
  } catch {}
}

function loadProfile() {
  const firstName = stored("cwe_user_firstname");
  const lastName = stored("cwe_user_lastname");
  if (firstName && lastName) {
    userProfile = { firstName, lastName, class: stored("cwe_student_class") || "" };
  }
}

function timeLabel(value) {
  return new Date(value).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

function dateKey(value) {
  const date = new Date(value);
  return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
}

function dateLabel(value) {
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  if (dateKey(value) === dateKey(today)) return "Heute";
  if (dateKey(value) === dateKey(yesterday)) return "Gestern";
  return new Date(value).toLocaleDateString("de-DE", {
    weekday: "short", day: "numeric", month: "short"
  });
}

function buildList() {
  for (const [id, profile] of Object.entries(profiles)) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "wa-chat-item";
    button.dataset.person = id;
    button.innerHTML = `
      <span class="avatar-wrap"><img src="${escapeHtml(profile.avatar)}" alt="" /></span>
      <span class="info">
        <span class="info-top">
          <span class="name">${escapeHtml(profile.name)}</span>
          <span class="time" id="time-${id}"></span>
        </span>
        <span class="role-subtitle">${escapeHtml(profile.role)}</span>
        <span class="info-bottom">
          <span id="ticks-${id}" class="ticks-preview hidden-element">${ticksSvg}</span>
          <span id="preview-${id}" class="last-msg"></span>
        </span>
      </span>`;
    button.addEventListener("click", () => openChat(id));
    items.appendChild(button);
  }

  document.querySelectorAll(".chat-brand-icon").forEach(element => {
    element.innerHTML = brandSvg;
  });
}

function splitSegments(text) {
  const result = [];
  const delimiters = [
    { open: "\\(", close: "\\)" },
    { open: "\\[", close: "\\]" },
    { open: "$$", close: "$$" }
  ];
  let cursor = 0;

  while (cursor < text.length) {
    let next = null;

    for (const delimiter of delimiters) {
      const start = text.indexOf(delimiter.open, cursor);
      if (start !== -1 && (!next || start < next.start)) {
        next = { ...delimiter, start };
      }
    }

    if (!next) {
      result.push({ type: "text", value: text.slice(cursor) });
      break;
    }

    if (next.start > cursor) {
      result.push({ type: "text", value: text.slice(cursor, next.start) });
    }

    const start = next.start + next.open.length;
    const end = text.indexOf(next.close, start);

    if (end === -1) {
      result.push({ type: "text", value: text.slice(next.start) });
      break;
    }

    result.push({ type: "math", value: text.slice(start, end) });
    cursor = end + next.close.length;
  }

  return result;
}

function normalizeProse(text) {
  return text.replace(
    /(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)[ \t]*(?:EUR\b|Euro\b|€)/gi,
    (match, value) => {
      const number = Number(value.replace(/\./g, "").replace(",", "."));
      return Number.isFinite(number)
        ? number.toLocaleString("de-DE", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }) + " EUR"
        : match;
    }
  ).replace(
    /(\d)[ \t]*(EUR\b|Euro\b|€|Stück\b|kg\b|cm\b|mm\b|km\b|Prozent\b|%)/gi,
    (match, number, unit) => `${number} ${/^(euro|€)$/i.test(unit) ? "EUR" : unit}`
  );
}

function proseHtml(text, sources) {
  let html = escapeHtml(normalizeProse(text))
    .replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<strong>$1</strong>")
    .replace(/(?<![\w_])_([^_\n]+)_(?![\w_])/g, "<em>$1</em>")
    .replace(/~([^~\n]+)~/g, "<del>$1</del>");

  html = html.replace(/\[(\d+)\]/g, (match, number) => {
    const source = sources.find(item => item.id === Number(number));
    const url = source && safeUrl(source.url);
    if (!url) return match;
    return `<a class="web-citation" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(source.title || url)}">[${number}]</a>`;
  });

  return html;
}

function renderContent(container, text, sources = []) {
  const segments = splitSegments(String(text || ""));

  segments.forEach((segment, index) => {
    if (segment.type === "math") {
      const formula = document.createElement("div");
      formula.className = "wa-formula";

      try {
        if (!window.katex) throw new Error("KaTeX nicht geladen");
        katex.render(segment.value, formula, {
          displayMode: true,
          throwOnError: true,
          trust: false,
          strict: "warn",
          output: "htmlAndMathml"
        });
      } catch (error) {
        formula.classList.add("wa-formula-fallback");
        formula.textContent = segment.value;
        console.warn("Formeldarstellung:", error.message);
      }

      container.appendChild(formula);
      return;
    }

    let value = segment.value;
    if (segments[index - 1]?.type === "math") {
      value = value.replace(/^[ \t]*\r?\n(?:[ \t]*\r?\n)*/, "");
    }
    if (segments[index + 1]?.type === "math") {
      value = value.replace(/(?:\r?\n[ \t]*)+$/, "");
    }
    if (!value) return;

    const span = document.createElement("span");
    span.className = "wa-prose";
    span.innerHTML = proseHtml(value, sources);
    container.appendChild(span);
  });
}

function nearBottom() {
  return messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 100;
}

function toBottom() {
  requestAnimationFrame(() => {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });
}

function syncViewport() {
  viewportFrame = 0;
  const viewport = window.visualViewport;
  const width = viewport?.width || innerWidth;
  const height = viewport?.height || innerHeight;
  const top = viewport?.offsetTop || 0;
  const left = viewport?.offsetLeft || 0;
  const scale = viewport?.scale || 1;
  const containerWidth = Math.min(600, width);

  phone.style.width = `${containerWidth}px`;
  phone.style.height = `${height}px`;
  phone.style.top = `${top}px`;
  phone.style.left = `${left + Math.max(0, (width - containerWidth) / 2)}px`;

  const active = document.activeElement;
  const editing = Boolean(active && (
    active.matches("input:not([type='file']), textarea, select") ||
    active.isContentEditable
  ));

  if (!baselineWidth || Math.abs(width - baselineWidth) > 100) {
    baselineWidth = width;
    baselineHeight = height;
  }
  if (!editing && Math.abs(scale - 1) < 0.05) {
    baselineHeight = Math.max(baselineHeight, height);
  }

  const reference = Math.max(baselineHeight, document.documentElement.clientHeight, innerHeight);
  phone.classList.toggle(
    "keyboard-open",
    editing && Math.abs(scale - 1) < 0.05 && reference - height > 120
  );

  if (currentPerson && followBottom && messagesDiv.style.display !== "none") {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
}

function scheduleViewport() {
  if (!viewportFrame) viewportFrame = requestAnimationFrame(syncViewport);
}

function settleViewport() {
  scheduleViewport();
  for (const timer of viewportTimers) clearTimeout(timer);
  viewportTimers.clear();

  for (const delay of [80, 180, 350, 600]) {
    const timer = setTimeout(() => {
      viewportTimers.delete(timer);
      scheduleViewport();
    }, delay);
    viewportTimers.add(timer);
  }
}

function installViewport() {
  visualViewport?.addEventListener("resize", scheduleViewport);
  visualViewport?.addEventListener("scroll", scheduleViewport);
  window.addEventListener("resize", settleViewport);
  window.addEventListener("scroll", scheduleViewport, { passive: true });
  window.addEventListener("pageshow", settleViewport);
  window.addEventListener("orientationchange", () => {
    baselineHeight = 0;
    baselineWidth = 0;
    settleViewport();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) settleViewport();
  });
  document.addEventListener("focusin", event => {
    followBottom = event.target === input && nearBottom();
    settleViewport();
  });
  document.addEventListener("focusout", settleViewport);
  messagesDiv.addEventListener("touchstart", () => { followBottom = false; }, { passive: true });
  messagesDiv.addEventListener("wheel", () => { followBottom = false; }, { passive: true });
  syncViewport();
}

function renderMessages(person) {
  if (currentPerson !== person) return;
  messagesDiv.replaceChildren();
  let previousDate = null;

  for (const message of histories[person]) {
    const key = dateKey(message.timestamp);
    if (key !== previousDate) {
      const pill = document.createElement("div");
      pill.className = "wa-date-pill";
      pill.textContent = dateLabel(message.timestamp);
      messagesDiv.appendChild(pill);
      previousDate = key;
    }

    const bubble = document.createElement("div");
    bubble.className = `wa-msg-bubble ${message.who}${message.isError ? " error" : ""}`;

    if (message.type === "text") {
      const text = document.createElement("div");
      text.className = "wa-msg-text";
      renderContent(text, message.text, message.sources || []);
      bubble.appendChild(text);
    } else if (message.type === "image") {
      const image = document.createElement("img");
      image.className = "wa-img-preview";
      image.src = message.imageSrc;
      image.alt = message.fileName || "Bild";
      bubble.appendChild(image);
    } else {
      const row = document.createElement("div");
      row.className = "wa-doc-row";
      const icon = document.createElement("span");
      icon.className = "wa-doc-icon";
      icon.textContent = "📄";
      const name = document.createElement("span");
      name.textContent = message.fileName;
      row.append(icon, name);
      bubble.appendChild(row);
    }

    if (message.sources?.length) {
      const sourceBox = document.createElement("div");
      sourceBox.className = "web-sources";

      for (const source of message.sources) {
        const url = safeUrl(source.url);
        if (!url) continue;
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = `[${source.id}] ${source.title || new URL(url).hostname}`;
        sourceBox.appendChild(link);
      }

      bubble.appendChild(sourceBox);
    }

    if (message.warnings?.length) {
      const warning = document.createElement("div");
      warning.className = "technical-warning";
      warning.textContent = message.warnings.map(value => `ℹ️ ${value}`).join("\n");
      bubble.appendChild(warning);
    }

    const meta = document.createElement("div");
    meta.className = "wa-msg-meta";
    meta.textContent = timeLabel(message.timestamp);

    if (message.who === "user") {
      const ticks = document.createElement("span");
      ticks.className = "wa-blue-check";
      ticks.innerHTML = ticksSvg;
      meta.appendChild(ticks);
    }

    bubble.appendChild(meta);
    messagesDiv.appendChild(bubble);
  }

  if (pending.has(person)) {
    const typing = document.createElement("div");
    typing.className = "wa-typing";
    typing.setAttribute("aria-label", "Antwort wird erstellt");
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("div");
      dot.className = "wa-typing-dot";
      typing.appendChild(dot);
    }
    messagesDiv.appendChild(typing);
  }

  toBottom();
}

function updatePreview(person, text, timestamp) {
  $(`preview-${person}`).textContent = text;
  $(`time-${person}`).textContent = timeLabel(timestamp);
  $(`ticks-${person}`).classList.remove("hidden-element");
  items.prepend(items.querySelector(`[data-person="${person}"]`));
}

function updateComposer() {
  const busy = currentPerson ? pending.has(currentPerson) : false;
  const showSend = input.innerText.trim() && !recording && !speechStarting;
  $("micIcon").classList.toggle("hidden-element", Boolean(showSend));
  $("sendIcon").classList.toggle("hidden-element", !showSend);
  sendButton.disabled = busy || !currentPerson;
  uploadButton.disabled = busy || !currentPerson;
  fileInput.disabled = busy || !currentPerson;
  sendButton.classList.toggle("recording", recording || speechStarting);
  sendButton.setAttribute("aria-label",
    recording || speechStarting ? "Spracheingabe beenden" :
    showSend ? "Nachricht senden" : "Spracheingabe starten"
  );
}

function blurActive() {
  document.activeElement?.blur?.();
}

function showContent() {
  $("passwordPrompt").classList.add("hidden-element");
  $("studentPrompt").classList.add("hidden-element");
  messagesDiv.style.display = "flex";
  $("composerBar").style.display = "flex";
  renderMessages(currentPerson);
  updateComposer();
  settleViewport();
}

function clearNavigationTimers() {
  clearTimeout(startTimer);
  clearTimeout(finishTimer);
}

function clearSwipeStyles() {
  chatView.style.removeProperty("transition");
  chatView.style.removeProperty("transform");
  listView.style.removeProperty("transition");
  listView.style.removeProperty("transform");
  listView.style.removeProperty("opacity");
}

function finishOpen(token) {
  if (token !== navigationToken || navigationState !== "opening") return;
  clearTimeout(finishTimer);
  navigationState = "chat";
  items.querySelectorAll(".selected-tap").forEach(item => item.classList.remove("selected-tap"));
}

function finishClose(token) {
  if (token !== navigationToken || navigationState !== "closing") return;
  clearTimeout(finishTimer);
  chatView.classList.remove("is-visible");
  chatView.setAttribute("aria-hidden", "true");
  navigationState = "list";
  clearSwipeStyles();
  items.querySelectorAll(".selected-tap").forEach(item => item.classList.remove("selected-tap"));
}

function openChat(person) {
  if (navigationState !== "list") return;
  clearNavigationTimers();
  clearSwipeStyles();
  const token = ++navigationToken;
  navigationState = "opening";
  blurActive();
  currentPerson = person;

  items.querySelectorAll(".wa-chat-item").forEach(item => {
    item.classList.toggle("selected-tap", item.dataset.person === person);
  });

  $("chatName").textContent = profiles[person].name;
  $("chatRole").textContent = profiles[person].role;
  $("chatAvatar").src = profiles[person].avatar;

  $("passwordPrompt").classList.add("hidden-element");
  $("studentPrompt").classList.add("hidden-element");
  messagesDiv.style.display = "none";
  $("composerBar").style.display = "none";
  input.textContent = drafts[person];
  loadProfile();

  if (person === "frank" && !frankUnlocked) {
    $("passwordPrompt").classList.remove("hidden-element");
    $("passwordInput").value = "";
    $("passwordError").classList.add("hidden-element");
    $("frankNameFields").classList.toggle("hidden-element", Boolean(userProfile));
  } else if (person !== "frank" && !userProfile?.class) {
    $("studentPrompt").classList.remove("hidden-element");
    $("studentFirstNameInput").value = userProfile?.firstName || "";
    $("studentLastNameInput").value = userProfile?.lastName || "";
    $("studentClassSelect").value = "";
    $("studentError").classList.add("hidden-element");
  } else {
    showContent();
  }

  searchInput.disabled = true;
  chatView.classList.add("is-visible");
  chatView.setAttribute("aria-hidden", "false");
  followBottom = true;
  updateComposer();
  settleViewport();
  void chatView.offsetWidth;

  startTimer = setTimeout(() => {
    if (token !== navigationToken || navigationState !== "opening") return;
    chatView.classList.add("active-chat");
    listView.classList.add("in-background");
    if (reducedMotion.matches) finishOpen(token);
    else finishTimer = setTimeout(() => finishOpen(token), 420);
  }, reducedMotion.matches ? 0 : 140);
}

function backToList() {
  if (navigationState === "list" || navigationState === "closing") return;
  clearNavigationTimers();
  const token = ++navigationToken;
  stopRecording();
  if (currentPerson) drafts[currentPerson] = input.innerText;
  blurActive();
  navigationState = "closing";
  chatView.classList.remove("active-chat");
  listView.classList.remove("in-background");
  clearSwipeStyles();
  searchInput.disabled = false;
  currentPerson = null;
  followBottom = false;
  updateComposer();
  settleViewport();
  if (reducedMotion.matches) finishClose(token);
  else finishTimer = setTimeout(() => finishClose(token), 420);
}

chatView.addEventListener("transitionend", event => {
  if (event.target !== chatView || event.propertyName !== "transform") return;
  if (navigationState === "opening") finishOpen(navigationToken);
  if (navigationState === "closing") finishClose(navigationToken);
});

function buildMessages(person) {
  return histories[person]
    .filter(message => !message.isError)
    .map(message => {
      if (message.type === "image") {
        return {
          role: "user",
          content: [
            { type: "text", text: `[Bild: ${message.fileName}]` },
            { type: "image_url", image_url: { url: message.imageSrc } }
          ]
        };
      }
      if (message.type === "document") {
        return { role: "user", content: `[Dokument hochgeladen: ${message.fileName}]` };
      }
      return {
        role: message.who === "user" ? "user" : "assistant",
        content: message.text
      };
    });
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Bild konnte nicht gelesen werden."));
    reader.readAsDataURL(file);
  });
}

async function sendMessage(file = null) {
  const person = currentPerson;
  if (!person || pending.has(person)) return;
  stopRecording();

  const text = input.innerText.trim();
  if (!text && !file) return;

  if (file && file.size > 15 * 1024 * 1024) {
    alert("Bitte eine Datei unter 15 MB verwenden.");
    return;
  }

  const timestamp = new Date();
  pending.add(person);

  try {
    if (text) histories[person].push({ type: "text", text, who: "user", timestamp });
    const apiHistory = buildMessages(person);

    input.textContent = "";
    drafts[person] = "";
    updateComposer();

    if (file) {
      const message = {
        type: file.type.startsWith("image/") ? "image" : "document",
        fileName: file.name,
        who: "user",
        timestamp
      };
      if (message.type === "image") message.imageSrc = await readImage(file);
      histories[person].push(message);
    }

    updatePreview(person, text || file.name, timestamp);
    renderMessages(person);

    const body = {
      person,
      messages: apiHistory,
      documents: documents[person],
      firstName: userProfile?.firstName || "",
      lastName: userProfile?.lastName || "",
      studentClass: userProfile?.class || ""
    };

    let options;

    if (file) {
      const form = new FormData();
      form.append("file", file);
      for (const [key, value] of Object.entries(body)) {
        form.append(key, typeof value === "string" ? value : JSON.stringify(value));
      }
      options = { method: "POST", body: form };
    } else {
      options = {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      };
    }

    const response = await fetch("/api/chat", options);
    const raw = await response.text();
    let data;

    try { data = JSON.parse(raw); }
    catch { throw new Error(`Unlesbare Serverantwort (HTTP ${response.status}).`); }

    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    if (typeof data.message?.content !== "string") {
      throw new Error(data.error || "Keine Textantwort erhalten.");
    }

    if (data.uploadedDocument) {
      documents[person] = [
        ...documents[person].filter(item => item.id !== data.uploadedDocument.id),
        data.uploadedDocument
      ].slice(-5);
    }

    const botTime = new Date();
    histories[person].push({
      type: "text",
      text: data.message.content,
      sources: data.message.sources || [],
      warnings: data.warnings || [],
      who: "bot",
      timestamp: botTime
    });

    updatePreview(person, data.message.content, botTime);
  } catch (error) {
    console.error("Chat-Anfrage:", error);
    const failedAt = new Date();
    histories[person].push({
      type: "text",
      text: `Die Antwort konnte nicht geladen werden.\n\n${error.message}`,
      who: "bot",
      isError: true,
      timestamp: failedAt
    });
    updatePreview(person, "Antwort konnte nicht geladen werden.", failedAt);
  } finally {
    pending.delete(person);
    if (currentPerson === person) {
      renderMessages(person);
      updateComposer();
      scheduleViewport();
    }
  }
}

function drawSpeech(spokenText, active = true) {
  if (currentPerson !== recordingPerson) return;
  const base = recordingBase ? recordingBase + (spokenText ? " " : "") : "";
  speechDraft = base + spokenText;
  input.replaceChildren();
  input.appendChild(document.createTextNode(base));

  if (active && spokenText) {
    const characters = Array.from(spokenText);
    const before = characters.slice(0, Math.max(0, characters.length - 10)).join("");
    const last = characters.slice(-10).join("");
    input.appendChild(document.createTextNode(before));

    const highlight = document.createElement("span");
    highlight.className = "drift-sparks-wrap";
    highlight.textContent = last;
    input.appendChild(highlight);

    const cursor = document.createElement("span");
    cursor.className = "voice-cursor";
    cursor.contentEditable = "false";
    cursor.setAttribute("aria-hidden", "true");
    input.appendChild(cursor);
  } else {
    input.appendChild(document.createTextNode(spokenText));
    const mic = document.createElement("span");
    mic.className = "voice-inline-mic";
    mic.contentEditable = "false";
    mic.setAttribute("aria-label", "Aufnahme läuft");
    mic.innerHTML = `<svg viewBox="0 0 24 24"><path d="${micPath}"/></svg>`;
    input.appendChild(mic);
  }

  input.scrollTop = input.scrollHeight;
  scheduleViewport();
}

function finishSpeechDraft() {
  clearTimeout(silenceTimer);
  if (currentPerson === recordingPerson) {
    input.textContent = speechDraft;
    drafts[currentPerson] = speechDraft;
  }
}

function stopRecording() {
  if (!recognition && !recording && !speechStarting) return;
  const instance = recognition;
  finishSpeechDraft();
  recognition = null;
  recording = false;
  speechStarting = false;
  recordingPerson = null;

  if (instance) {
    instance.onstart = instance.onresult = instance.onend = instance.onerror = null;
    try { instance.abort(); } catch {}
  }
  updateComposer();
}

function startRecording() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    alert("Spracheingabe wird von diesem Browser nicht unterstützt.");
    return;
  }
  if (!currentPerson || pending.has(currentPerson) || recognition) return;

  const instance = new Recognition();
  recognition = instance;
  recordingPerson = currentPerson;
  recordingBase = input.innerText.trim();
  speechDraft = recordingBase;
  speechStarting = true;
  instance.lang = "de-DE";
  instance.continuous = true;
  instance.interimResults = true;
  updateComposer();

  instance.onstart = () => {
    if (recognition !== instance) return;
    recording = true;
    speechStarting = false;
    drawSpeech("", false);
    updateComposer();
  };

  instance.onresult = event => {
    if (recognition !== instance || currentPerson !== recordingPerson) return;
    const parts = [];
    for (let i = 0; i < event.results.length; i++) {
      parts.push(event.results[i][0].transcript.trim());
    }
    const spoken = parts.filter(Boolean).join(" ");
    drawSpeech(spoken, true);
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (recognition === instance && recording) drawSpeech(spoken, false);
    }, 1200);
  };

  const finish = () => {
    if (recognition !== instance) return;
    finishSpeechDraft();
    recognition = null;
    recording = false;
    speechStarting = false;
    recordingPerson = null;
    updateComposer();
  };

  instance.onend = finish;
  instance.onerror = event => {
    finish();
    if (event.error === "not-allowed") {
      alert("Bitte den Mikrofonzugriff erlauben.");
    }
  };

  try { instance.start(); }
  catch { finish(); alert("Spracheingabe konnte nicht gestartet werden."); }
}

$("backBtn").addEventListener("click", backToList);

sendButton.addEventListener("pointerdown", event => {
  if (document.activeElement === input && input.innerText.trim() && !recording && !speechStarting) {
    event.preventDefault();
  }
});

sendButton.addEventListener("click", () => {
  if (recording || speechStarting) stopRecording();
  else if (input.innerText.trim()) {
    followBottom = true;
    sendMessage();
  } else startRecording();
});

input.addEventListener("beforeinput", () => {
  if (recording || speechStarting) stopRecording();
});

input.addEventListener("input", () => {
  if (currentPerson && !recording && !speechStarting) {
    drafts[currentPerson] = input.innerText;
  }
  updateComposer();
  scheduleViewport();
});

input.addEventListener("paste", event => {
  event.preventDefault();
  if (recording || speechStarting) stopRecording();
  const selection = getSelection();
  if (!selection?.rangeCount) return;
  const range = selection.getRangeAt(0);
  range.deleteContents();
  const node = document.createTextNode(event.clipboardData.getData("text/plain"));
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
  input.dispatchEvent(new Event("input"));
});

uploadButton.addEventListener("click", () => {
  stopRecording();
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  fileInput.value = "";
  if (file && currentPerson) sendMessage(file);
});

$("studentConfirmBtn").addEventListener("click", () => {
  const firstName = $("studentFirstNameInput").value.trim();
  const lastName = $("studentLastNameInput").value.trim();
  const studentClass = $("studentClassSelect").value;
  if (!firstName || !lastName || !studentClass) {
    $("studentError").classList.remove("hidden-element");
    return;
  }
  saveProfile({ firstName, lastName, class: studentClass });
  blurActive();
  showContent();
});

$("passwordConfirmBtn").addEventListener("click", () => {
  const error = $("passwordError");

  // Bestehende Frontend-Freischaltung, keine serverseitige Authentifizierung.
  if ($("passwordInput").value !== "84307") {
    error.textContent = "Das Passwort ist nicht korrekt.";
    error.classList.remove("hidden-element");
    return;
  }

  if (!userProfile) {
    const firstName = $("frankFirstNameInput").value.trim();
    const lastName = $("frankLastNameInput").value.trim();
    if (!firstName || !lastName) {
      error.textContent = "Bitte Vorname und Nachname ausfüllen.";
      error.classList.remove("hidden-element");
      return;
    }
    saveProfile({ firstName, lastName, class: "" });
  }

  frankUnlocked = true;
  $("passwordInput").value = "";
  error.classList.add("hidden-element");
  blurActive();
  showContent();
});

$("passwordInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    $("passwordConfirmBtn").click();
  }
});

function normalizeSearch(text) {
  return String(text || "").toLowerCase()
    .replace(/ä/g, "ae").replace(/ö/g, "oe")
    .replace(/ü/g, "ue").replace(/ß/g, "ss").trim();
}

searchInput.addEventListener("input", () => {
  const query = normalizeSearch(searchInput.value);
  items.querySelectorAll(".wa-chat-item").forEach(item => {
    const person = item.dataset.person;
    const profile = profiles[person];
    const value = normalizeSearch([
      profile.name, profile.role, profile.desc,
      ...histories[person].map(message => message.text || message.fileName || "")
    ].join(" "));
    item.classList.toggle("hidden-element", Boolean(query) && !value.includes(query));
  });
});

/* Mitlaufende Zurück-Geste: 80 Pixel Startbereich, 50 Pixel Schwelle. */
chatView.addEventListener("touchstart", event => {
  if (event.touches.length !== 1 || navigationState !== "chat") return;
  const touch = event.touches[0];
  const localX = touch.clientX - phone.getBoundingClientRect().left;
  if (
    localX > 80 ||
    event.target.closest(".wa-formula, input, select, [contenteditable], button, a")
  ) {
    swipe = null;
    return;
  }
  swipe = { x: touch.clientX, y: touch.clientY, delta: 0, active: false };
}, { passive: true });

chatView.addEventListener("touchmove", event => {
  if (!swipe || event.touches.length !== 1) return;
  const touch = event.touches[0];
  const dx = touch.clientX - swipe.x;
  const dy = Math.abs(touch.clientY - swipe.y);

  if (!swipe.active) {
    if (dy > 12 && dy >= dx) {
      swipe = null;
      return;
    }
    if (dx < 10 || dx <= dy) return;
    swipe.active = true;
  }

  if (event.cancelable) event.preventDefault();

  swipe.delta = Math.max(0, Math.min(dx, phone.clientWidth));
  const progress = swipe.delta / phone.clientWidth;

  chatView.style.transition = "none";
  listView.style.transition = "none";
  chatView.style.transform = `translate3d(${swipe.delta}px,0,0)`;
  listView.style.transform = `translate3d(${-20 + 20 * progress}%,0,0)`;
  listView.style.opacity = String(0.6 + 0.4 * progress);
}, { passive: false });

function endSwipe(cancelled = false) {
  if (!swipe) return;
  const gesture = swipe;
  swipe = null;
  if (!gesture.active) return;

  // Aktuelle Fingerposition vor dem Wiederaktivieren der Transition festhalten.
  void chatView.offsetWidth;
  chatView.style.removeProperty("transition");
  listView.style.removeProperty("transition");
  void chatView.offsetWidth;

  if (!cancelled && gesture.delta > 50) {
    backToList();
  } else {
    chatView.style.removeProperty("transform");
    listView.style.removeProperty("transform");
    listView.style.removeProperty("opacity");
  }
}

chatView.addEventListener("touchend", () => endSwipe(false), { passive: true });
chatView.addEventListener("touchcancel", () => endSwipe(true), { passive: true });

window.addEventListener("DOMContentLoaded", () => {
  if (currentPerson) renderMessages(currentPerson);
  settleViewport();
  setTimeout(() => {
    const splash = $("splashOverlay");
    if (!splash) return;
    splash.classList.add("fade-out");
    setTimeout(() => splash.remove(), 500);
  }, 2200);
});

loadProfile();
buildList();
updateComposer();
installViewport();
</script>
