<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
/>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CWE Chat" />
<title>CWE Chat</title>

<link rel="preload" as="image" href="Startbildschirm.png" />
<link rel="preload" as="image" href="Logo-sw.png" />

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
/>
<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
></script>

<style>
:root {
  --wa-bg: #0a0a0a;
  --wa-header-bg: #0a0a0a;
  --wa-composer-bg: #0a0a0a;
  --wa-chat-area-bg: #101010;
  --wa-pill-profile-bg: #18222c;
  --wa-pill-back-bg: #18222c;
  --wa-input-pill-bg: #282828;
  --wa-bubble-user: #04488f;
  --wa-bubble-bot: #242625;
  --wa-text: #ffffff;
  --wa-text-dim: #8e8e93;
  --wa-border: #1e2833;
  --wa-search-bg: #1c1c1e;
  --wa-blue-ticks: #34b7f1;
  --wa-pill-bg: #161616;
  --wa-highlight: #2c2c2e;
  --wa-scrollbar-blue: #007aff;
  --wa-scrollbar-track: #000000;
  --chat-font: -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  position: fixed;
  inset: 0;
  background: var(--wa-bg);
  color: var(--wa-text);
  font-family: var(--chat-font);
  font-size: 16px;
  overscroll-behavior: none;
}

body {
  display: flex;
  justify-content: center;
  align-items: stretch;
}

button,
input,
select {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: 2px solid #007aff;
  outline-offset: 3px;
}

.phone {
  width: 100%;
  max-width: 600px;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: var(--wa-bg);
}

#splashOverlay {
  position: absolute;
  inset: 0;
  background: var(--wa-bg);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease, visibility 0.5s ease;
  pointer-events: none;
}

#splashOverlay.fade-out {
  opacity: 0;
  visibility: hidden;
}

#splashGraphic {
  max-height: 240px;
  max-width: 80%;
  object-fit: contain;
  user-select: none;
}

#chatListView {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--wa-bg);
  transition: transform 0.32s ease, opacity 0.32s ease;
  z-index: 40;
}

#chatListView.in-background {
  transform: translate3d(-20%, 0, 0);
  opacity: 0.6;
  pointer-events: none;
}

.wa-list-header {
  padding: max(16px, env(safe-area-inset-top)) 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex-shrink: 0;
}

.wa-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 42px;
  gap: 12px;
}

.wa-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin: 0;
  line-height: 1;
}

.header-logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 32px;
  flex-shrink: 0;
}

.header-logo-group img {
  height: 32px;
  width: auto;
  object-fit: contain;
}

.header-logo-group svg {
  width: 32px;
  height: 32px;
  fill: #ffffff;
}

.wa-search-box {
  background: var(--wa-search-bg);
  border-radius: 10px;
  display: flex;
  align-items: center;
  padding: 8px 12px;
  gap: 8px;
}

.wa-search-box svg {
  width: 18px;
  height: 18px;
  fill: var(--wa-text-dim);
  flex-shrink: 0;
}

.wa-search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--wa-text);
  font-size: 16px;
  width: 100%;
  min-width: 0;
}

.wa-search-box input::placeholder {
  color: var(--wa-text-dim);
}

.wa-chat-items {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.wa-chat-item {
  width: 100%;
  display: flex;
  text-align: left;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  cursor: pointer;
  border: none;
  border-bottom: 0.5px solid #1c1c1e;
  color: var(--wa-text);
  background: transparent;
  user-select: none;
}

.wa-chat-item.selected-tap {
  background: var(--wa-highlight);
}

.avatar-wrap {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
}

.avatar-wrap img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
}

.wa-chat-item .info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.info-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}

.wa-chat-item .name {
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wa-chat-item .time {
  font-size: 13px;
  color: var(--wa-text-dim);
  flex-shrink: 0;
}

.role-subtitle {
  font-size: 13px;
  color: var(--wa-text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.info-bottom {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 18px;
  font-size: 14px;
  color: var(--wa-text-dim);
  overflow: hidden;
}

.ticks-preview {
  display: inline-flex;
  flex-shrink: 0;
}

.ticks-preview svg,
.wa-blue-check svg {
  width: 15px;
  height: 15px;
  fill: var(--wa-blue-ticks);
  display: block;
}

.last-msg {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#chatWindowView {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--wa-chat-area-bg);
  transform: translate3d(100%, 0, 0);
  transition: transform 0.32s ease;
  z-index: 50;
  pointer-events: none;
  visibility: hidden;
}

#chatWindowView.active-chat {
  transform: translate3d(0, 0, 0);
  pointer-events: auto;
  visibility: visible;
}

.wa-chat-topbar {
  background: var(--wa-header-bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(16px, env(safe-area-inset-top)) 12px 10px;
  gap: 10px;
  border-bottom: 0.5px solid #1c1c1e;
  flex-shrink: 0;
}

.wa-topbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.wa-back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--wa-pill-back-bg);
  border-radius: 50%;
  width: 42px;
  height: 42px;
  padding: 0;
  flex-shrink: 0;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
}

.wa-back-btn svg {
  width: 22px;
  height: 22px;
  fill: #ffffff;
}

.wa-topbar-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
  background: var(--wa-pill-profile-bg);
  border-radius: 24px;
  padding: 4px 14px 4px 4px;
  height: 44px;
  border: 0.5px solid rgba(255, 255, 255, 0.08);
}

.wa-topbar-profile img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  background: #2c2c2e;
  flex-shrink: 0;
}

.wa-topbar-info {
  min-width: 0;
}

.wa-topbar-info .name,
.wa-topbar-info .role {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.wa-topbar-info .name {
  font-size: 15px;
  font-weight: 600;
}

.wa-topbar-info .role {
  font-size: 11px;
  color: var(--wa-text-dim);
}

.wa-messages-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
}

.wa-date-pill {
  align-self: center;
  background: var(--wa-pill-bg);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 8px;
  margin: 10px 0;
  user-select: none;
}

.wa-msg-bubble {
  max-width: 92%;
  min-width: 0;
  flex-shrink: 0;
  padding: 8px 12px 6px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.38;
  position: relative;
  display: flex;
  flex-direction: column;
}

.wa-msg-bubble.user {
  background: var(--wa-bubble-user);
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}

.wa-msg-bubble.bot {
  background: var(--wa-bubble-bot);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}

.wa-msg-bubble.error {
  border: 1px solid rgba(255, 100, 100, 0.5);
}

.wa-msg-text {
  min-width: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.wa-prose {
  white-space: pre-wrap;
}

.wa-prose strong {
  font-weight: 700;
}

.wa-prose em {
  font-style: italic;
}

/* Nur der äußere Formelbereich scrollt. */
.wa-formula {
  display: block;
  max-width: 100%;
  min-width: 0;
  margin: 1.25em 0;
  padding: 0.45em 0.15em 0.65em;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  overflow-wrap: normal;
  word-break: normal;
  -webkit-overflow-scrolling: touch;
}

.wa-formula .katex-display {
  margin: 0;
  text-align: left;
}

.wa-formula .katex-display > .katex {
  text-align: left;
}

.wa-formula .katex {
  font-size: 1em;
}

/*
  Text innerhalb von \text{...} folgt der Chatsystemschrift.
  Mathematische Symbole behalten ihre KaTeX-Schriften.
  Keine pauschale Überschreibung von .katex *.
*/
.wa-formula .katex .text,
.wa-formula .katex .text .textrm {
  font-family: var(--chat-font);
}

.wa-formula-fallback {
  font-family: var(--chat-font);
  font-size: 0.95em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #ffd59a;
}

.wa-msg-meta {
  align-self: flex-end;
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: 2px;
  margin-left: 12px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.65);
  user-select: none;
}

.wa-msg-bubble.bot .wa-msg-meta {
  color: var(--wa-text-dim);
}

.wa-doc-row {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-wrap: anywhere;
}

.wa-doc-icon {
  font-size: 22px;
}

.wa-img-preview {
  max-width: 100%;
  max-height: 400px;
  object-fit: contain;
  border-radius: 10px;
  margin-bottom: 4px;
}

.wa-typing {
  align-self: flex-start;
  flex-shrink: 0;
  background: var(--wa-bubble-bot);
  padding: 10px 14px;
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  display: flex;
  gap: 5px;
}

.wa-typing-dot {
  width: 7px;
  height: 7px;
  background: var(--wa-text-dim);
  border-radius: 50%;
  animation: waBounce 1.2s infinite ease-in-out;
}

.wa-typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.wa-typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes waBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

.wa-composer {
  background: var(--wa-composer-bg);
  border-top: 0.5px solid #1c1c1e;
  padding: 14px 10px max(14px, env(safe-area-inset-bottom));
  display: flex;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
}

.wa-composer.keyboard-open {
  padding-top: 10px;
  padding-bottom: 8px;
}

.wa-action-icon-btn,
.wa-mic-btn {
  width: 38px;
  height: 38px;
  padding: 0;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.wa-action-icon-btn {
  color: var(--wa-text-dim);
  background: transparent;
}

.wa-action-icon-btn svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}

.wa-mic-btn {
  border-radius: 50%;
  background: #007aff;
  color: #ffffff;
}

.wa-mic-btn.recording {
  background: #e23d3d;
}

.wa-mic-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

.wa-input-pill {
  flex: 1;
  min-width: 0;
  background: var(--wa-input-pill-bg);
  border-radius: 20px;
  padding: 8px 14px;
  min-height: 38px;
}

.input-field {
  width: 100%;
  min-height: 22px;
  max-height: 100px;
  color: var(--wa-text);
  font-size: 16px;
  line-height: 1.35;
  overflow-y: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  outline: none;
  user-select: text;
  -webkit-user-select: text;
}

.input-field:empty::before {
  content: attr(placeholder);
  color: var(--wa-text-dim);
  pointer-events: none;
}

.voice-inline-mic {
  display: inline-block;
  margin-left: 5px;
  color: #69adff;
  font-size: 14px;
}

.wa-prompt-container {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px;
  text-align: center;
}

.wa-prompt-card {
  background: var(--wa-header-bg);
  border: 1px solid var(--wa-border);
  border-radius: 16px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
}

.wa-prompt-card h3 {
  margin: 0;
  font-size: 18px;
}

.wa-prompt-card p {
  margin: 0 0 4px;
  font-size: 14px;
  color: var(--wa-text-dim);
  line-height: 1.4;
}

.wa-prompt-input,
.wa-prompt-select {
  padding: 12px 14px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid var(--wa-border);
  background: #282828;
  color: var(--wa-text);
  width: 100%;
}

.wa-prompt-btn {
  padding: 12px 20px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  background: #007aff;
  color: #ffffff;
  cursor: pointer;
  font-weight: 600;
}

.prompt-error {
  color: #ff7068;
  font-size: 14px;
}

#frankNameFields {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hidden-element {
  display: none !important;
}

.wa-chat-items,
.wa-messages-area,
.input-field,
.wa-formula {
  scrollbar-color: var(--wa-scrollbar-blue) var(--wa-scrollbar-track);
  scrollbar-width: thin;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--wa-scrollbar-track);
}

::-webkit-scrollbar-thumb {
  background: var(--wa-scrollbar-blue);
  border-radius: 3px;
}

@media (max-width: 380px) {
  .wa-chat-topbar .header-logo-group {
    gap: 5px;
  }

  .wa-chat-topbar .header-logo-group img,
  .wa-chat-topbar .header-logo-group svg {
    height: 25px;
  }

  .wa-chat-topbar .header-logo-group svg {
    width: 25px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="phone" id="phoneContainer">
  <div id="splashOverlay">
    <img
      id="splashGraphic"
      src="Startbildschirm.png"
      alt="CWE Chat"
      fetchpriority="high"
    />
  </div>

  <div id="chatListView">
    <div class="wa-list-header">
      <div class="wa-title-row">
        <h1 class="wa-title">Chats</h1>
        <div class="header-logo-group">
          <img src="Logo-sw.png" alt="Schullogo" />
          <span class="chat-brand-icon" aria-hidden="true"></span>
        </div>
      </div>

      <div class="wa-search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1 1 9.5 5a4.5 4.5 0 0 1 0 9z"/>
        </svg>
        <input
          id="searchInput"
          type="search"
          placeholder="Suchen"
          aria-label="Chats durchsuchen"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>
    </div>

    <div class="wa-chat-items" id="chatItemsContainer"></div>
  </div>

  <div id="chatWindowView" aria-hidden="true">
    <div class="wa-chat-topbar">
      <div class="wa-topbar-left">
        <button
          class="wa-back-btn"
          id="backBtn"
          type="button"
          aria-label="Zurück zur Übersicht"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>

        <div class="wa-topbar-profile">
          <img id="chatAvatar" alt="" />
          <div class="wa-topbar-info">
            <div class="name" id="chatName"></div>
            <div class="role" id="chatRole"></div>
          </div>
        </div>
      </div>

      <div class="header-logo-group">
        <img src="Logo-sw.png" alt="Schullogo" />
        <span class="chat-brand-icon" aria-hidden="true"></span>
      </div>
    </div>

    <div id="passwordPrompt" class="wa-prompt-container hidden-element">
      <div class="wa-prompt-card">
        <h3>Lehrkräfte-Zugang</h3>
        <p>Frank Hiller steht ausschließlich Lehrkräften zur Verfügung.</p>

        <div id="frankNameFields" class="hidden-element">
          <input
            id="frankFirstNameInput"
            class="wa-prompt-input"
            placeholder="Vorname"
            aria-label="Vorname"
            autocomplete="given-name"
          />
          <input
            id="frankLastNameInput"
            class="wa-prompt-input"
            placeholder="Nachname"
            aria-label="Nachname"
            autocomplete="family-name"
          />
        </div>

        <input
          type="password"
          id="passwordInput"
          class="wa-prompt-input"
          placeholder="Passwort"
          aria-label="Lehrkräfte-Passwort"
          autocomplete="off"
        />

        <button id="passwordConfirmBtn" class="wa-prompt-btn" type="button">
          Chat freischalten
        </button>

        <div id="passwordError" class="prompt-error hidden-element" role="alert">
          Bitte alle Angaben korrekt ausfüllen.
        </div>
      </div>
    </div>

    <div id="studentPrompt" class="wa-prompt-container hidden-element">
      <div class="wa-prompt-card">
        <h3>Willkommen im Chat! 👋</h3>
        <p>Bitte gib deinen Namen ein und wähle deine Klasse aus:</p>

        <input
          id="studentFirstNameInput"
          class="wa-prompt-input"
          placeholder="Vorname"
          aria-label="Vorname"
          autocomplete="given-name"
        />
        <input
          id="studentLastNameInput"
          class="wa-prompt-input"
          placeholder="Nachname"
          aria-label="Nachname"
          autocomplete="family-name"
        />

        <select
          id="studentClassSelect"
          class="wa-prompt-select"
          aria-label="Klasse"
        >
          <option value="" disabled selected>Klasse auswählen …</option>
          <option>EiH 10a</option>
          <option>EiH 10b</option>
          <option>EiH 10c</option>
          <option>EiH 11a</option>
          <option>EiH 11b</option>
          <option>EiH 11c</option>
          <option>EiH 12</option>
        </select>

function escapeHtml(text) {

function writeStored(key, value) {

function formatTime(date) {
  return new Date(date).toLocaleTimeString("de-DE", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function dateKey(date) {
  const value = new Date(date);
  return `${value.getFullYear()}-${value.getMonth()}-${value.getDate()}`;
}

function formatDatePill(date) {
  const value = new Date(date);
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);

  if (dateKey(value) === dateKey(today)) return "Heute";
  if (dateKey(value) === dateKey(yesterday)) return "Gestern";

  return value.toLocaleDateString("de-DE", {
    weekday: "short",
    day: "numeric",
    month: "short"
  });
}

/*
  Formeln werden vor jeder Textformatierung isoliert.
  Der Inhalt eines Formelabschnitts wird nicht normalisiert
  und nicht als Markdown verarbeitet.
*/
function splitMessageIntoSegments(text) {
  const segments = [];
  const delimiters = [
    { open: "\\(", close: "\\)" },
    { open: "\\[", close: "\\]" },
    { open: "$$", close: "$$" }
  ];

  let cursor = 0;

  while (cursor < text.length) {
    let next = null;

    for (const delimiter of delimiters) {
      const start = text.indexOf(delimiter.open, cursor);

      if (
        start !== -1 &&
        (!next || start < next.start)
      ) {
        next = { ...delimiter, start };
      }
    }

    if (!next) {
      segments.push({
        type: "text",
        value: text.slice(cursor)
      });
      break;
    }

    if (next.start > cursor) {
      segments.push({
        type: "text",
        value: text.slice(cursor, next.start)
      });
    }

    const formulaStart = next.start + next.open.length;
    const end = text.indexOf(next.close, formulaStart);

    if (end === -1) {
      segments.push({
        type: "text",
        value: text.slice(next.start)
      });
      break;
    }

    segments.push({
      type: "math",
      value: text.slice(formulaStart, end)
    });

    cursor = end + next.close.length;
  }

  return segments;
}

function normalizeCurrencyValues(text) {
  return text.replace(
    /(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)[ \t]*(?:EUR\b|Euro\b|€)/gi,
    (match, numberText) => {
      const number = Number(
        numberText.replace(/\./g, "").replace(",", ".")
      );

      if (!Number.isFinite(number)) return match;

      return (
        number.toLocaleString("de-DE", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " EUR"
      );
    }
  );
}

function normalizeUnitSpacing(text) {
  return text.replace(
    /(\d)[ \t]*(EUR\b|Euro\b|€|Stück\b|Stk\.?(?!\w)|kg\b|g\b|t\b|l\b|cm\b|mm\b|km\b|m\b|Prozent\b|%)/gi,
    (match, number, unit) => {
      const normalizedUnit =
        /^(euro|€)$/i.test(unit) ? "EUR" : unit;

      return `${number} ${normalizedUnit}`;
    }
  );
}

function formatProse(text) {
  const normalized = normalizeUnitSpacing(
    normalizeCurrencyValues(text)
  );

  return escapeHtml(normalized)
    .replace(/\*\*([^\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(
      /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
      "<strong>$1</strong>"
    )
    .replace(
      /(?<![\w_])_([^_\n]+)_(?![\w_])/g,
      "<em>$1</em>"
    )
    .replace(/~([^~\n]+)~/g, "<del>$1</del>");
}

function renderFormula(formula, container) {
  if (!window.katex) {
    container.classList.add("wa-formula-fallback");
    container.textContent = formula;
    container.title = "Formeldarstellung konnte nicht geladen werden.";
    return;
  }

  try {
    window.katex.render(formula, container, {
      displayMode: true,
      throwOnError: true,
      trust: false,
      strict: "warn",
      output: "htmlAndMathml"
    });
  } catch (error) {
    container.classList.add("wa-formula-fallback");
    container.textContent = formula;
    container.title = "Diese Formel konnte nicht dargestellt werden.";
    console.warn("KaTeX-Renderfehler:", error.message);
  }
}

function renderMessageContent(container, text) {
  const segments = splitMessageIntoSegments(String(text || ""));

  segments.forEach((segment, index) => {
    if (segment.type === "math") {
      const formulaContainer = document.createElement("div");
      formulaContainer.className = "wa-formula";
      renderFormula(segment.value, formulaContainer);
      container.appendChild(formulaContainer);
      return;
    }

    let value = segment.value;

    /*
      Bereits vorhandene Leerzeilen direkt neben einer Formel
      werden durch den einheitlichen CSS-Abstand ersetzt.
    */
    if (segments[index - 1]?.type === "math") {
      value = value.replace(/^[ \t]*\r?\n(?:[ \t]*\r?\n)*/, "");
    }

    if (segments[index + 1]?.type === "math") {
      value = value.replace(/(?:\r?\n[ \t]*)+$/, "");
    }

    if (!value) return;

    const prose = document.createElement("span");
    prose.className = "wa-prose";
    prose.innerHTML = formatProse(value);
    container.appendChild(prose);
  });
}

function scrollToBottom(smooth = false) {
  requestAnimationFrame(() => {
    messagesDiv.scrollTo({
      top: messagesDiv.scrollHeight,
      behavior: smooth ? "smooth" : "auto"
    });
  });
}

function renderMessages(person) {
  if (currentPerson !== person) return;

  messagesDiv.replaceChildren();
  let lastDate = null;

  for (const message of chatHistory[person]) {
    const key = dateKey(message.timestamp);

    if (key !== lastDate) {
      const pill = document.createElement("div");
      pill.className = "wa-date-pill";
      pill.textContent = formatDatePill(message.timestamp);
      messagesDiv.appendChild(pill);
      lastDate = key;
    }

    const bubble = document.createElement("div");
    bubble.className =
      `wa-msg-bubble ${message.who}` +
      (message.isError ? " error" : "");

    if (message.type === "text") {
      const textContainer = document.createElement("div");
      textContainer.className = "wa-msg-text";
      renderMessageContent(textContainer, message.text);
      bubble.appendChild(textContainer);
    } else if (message.type === "image") {
      const image = document.createElement("img");
      image.className = "wa-img-preview";
      image.src = message.imageSrc;
      image.alt = message.fileName || "Hochgeladenes Bild";
      bubble.appendChild(image);
    } else if (message.type === "document") {
      const row = document.createElement("div");
      row.className = "wa-doc-row";

      const icon = document.createElement("span");
      icon.className = "wa-doc-icon";
      icon.textContent = "📄";

      const name = document.createElement("span");
      name.textContent = message.fileName;

      row.append(icon, name);
      bubble.appendChild(row);
    }

    const meta = document.createElement("div");
    meta.className = "wa-msg-meta";
    meta.appendChild(
      document.createTextNode(formatTime(message.timestamp))
    );

    if (message.who === "user") {
      const ticks = document.createElement("span");
      ticks.className = "wa-blue-check";
      ticks.innerHTML = ticksSvg;
      meta.appendChild(ticks);
    }

    bubble.appendChild(meta);
    messagesDiv.appendChild(bubble);
  }

  if (pendingRequests.has(person)) {
    const typing = document.createElement("div");
    typing.className = "wa-typing";
    typing.setAttribute("aria-label", "Antwort wird erstellt");

    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("div");
      dot.className = "wa-typing-dot";
      typing.appendChild(dot);
    }

    messagesDiv.appendChild(typing);
  }

  scrollToBottom();
}

function updatePreview(person, text, timestamp) {
  $(`preview-${person}`).textContent = text;
  $(`time-${person}`).textContent = formatTime(timestamp);
  $(`ticks-${person}`).classList.remove("hidden-element");

  const item = chatItemsContainer.querySelector(
    `[data-person="${person}"]`
  );

  chatItemsContainer.prepend(item);
}

function updateComposerState() {
  const pending = currentPerson
    ? pendingRequests.has(currentPerson)
    : false;

  const hasText = inputField.innerText.trim().length > 0;
  const showSend = hasText && !isRecording;

  $("micIcon").classList.toggle("hidden-element", showSend);
  $("sendIcon").classList.toggle("hidden-element", !showSend);

  micOrSendBtn.disabled = pending || !currentPerson;
  uploadBtn.disabled = pending || !currentPerson;
  fileInput.disabled = pending || !currentPerson;

  inputField.contentEditable = pending ? "false" : "true";

  micOrSendBtn.classList.toggle("recording", isRecording);
  micOrSendBtn.setAttribute(
    "aria-label",
    isRecording
      ? "Spracheingabe beenden"
      : showSend
        ? "Nachricht senden"
        : "Spracheingabe starten"
  );
}

function showChatContent() {

  $("studentPrompt").classList.add("hidden-element");

function openChat(person) {
  if (currentPerson) {
    stopRecording();
    drafts[currentPerson] = inputField.innerText;
  }

  currentPerson = person;

  document.querySelectorAll(".wa-chat-item").forEach(item => {
    item.classList.toggle("selected-tap", item.dataset.person === person);
  });

  $("chatName").textContent = profiles[person].name;
  $("chatRole").textContent = profiles[person].role;
  $("chatAvatar").src = profiles[person].avatar;

  $("passwordPrompt").classList.add("hidden-element");
  $("studentPrompt").classList.add("hidden-element");
  messagesDiv.style.display = "none";
  composerBar.style.display = "none";

  inputField.textContent = drafts[person];
  loadUserProfile();

  if (person === "frank" && !frankSessionUnlocked) {
    $("passwordPrompt").classList.remove("hidden-element");
    $("passwordInput").value = "";
    $("passwordError").classList.add("hidden-element");
    $("frankNameFields").classList.toggle(
      "hidden-element",
      Boolean(userProfile)
    );
  } else if (person !== "frank" && !userProfile?.class) {
    $("studentPrompt").classList.remove("hidden-element");
    $("studentFirstNameInput").value = userProfile?.firstName || "";
    $("studentLastNameInput").value = userProfile?.lastName || "";
    $("studentClassSelect").value = "";

    showChatContent();
  }

  searchInput.blur();
  chatWindowView.classList.add("active-chat");
  chatWindowView.setAttribute("aria-hidden", "false");
  chatListView.classList.add("in-background");
  updateComposerState();
}

function backToChatList() {
  stopRecording();

  if (currentPerson) {
    drafts[currentPerson] = inputField.innerText;
  }

  inputField.blur();
  chatWindowView.classList.remove("active-chat");
  chatWindowView.setAttribute("aria-hidden", "true");
  chatListView.classList.remove("in-background");

  document.querySelectorAll(".wa-chat-item").forEach(item => {
    item.classList.remove("selected-tap");
  });

  currentPerson = null;
  updateComposerState();
}

function buildApiMessages(person) {
  return chatHistory[person]
    .filter(message => !message.isError && message.type !== "document")
    .map(message => {
      if (message.type === "image") {
        return {
          role: "user",
          content: [
            { type: "text", text: "[Foto hochgeladen]" },
            {
              type: "image_url",
              image_url: { url: message.imageSrc }
            }
          ]
        };
      }

      return {
        role: message.who === "user" ? "user" : "assistant",
        content: message.text
      };
    });
}

async function sendMessage(file = null, targetPerson = currentPerson) {
  const person = targetPerson;

  if (!person || pendingRequests.has(person)) return;
  if (person !== currentPerson) return;

  stopRecording();

  const text = inputField.innerText.trim();

  if (!text && !file) return;

  const timestamp = new Date();

  if (text) {
    chatHistory[person].push({
      type: "text",
      text,
      who: "user",
      timestamp
    });
  }

  /*
    Der API-Verlauf wird vor der Dateivorschau aufgebaut:
    Die neue Datei wird separat als Multipart-Datei gesendet.
  */
  const apiMessages = buildApiMessages(person);

  if (file) {
    const preview = {
      type: file.type.startsWith("image/") ? "image" : "document",
      who: "user",
      fileName: file.name,
      timestamp
    };

    if (preview.type === "image") {
      preview.imageSrc = URL.createObjectURL(file);
    }

    chatHistory[person].push(preview);
  }

  inputField.textContent = "";
  drafts[person] = "";
  pendingRequests.add(person);

  updatePreview(person, text || file.name, timestamp);
  renderMessages(person);
  updateComposerState();

  try {
    const requestData = {
      person,
      messages: apiMessages,
      firstName: userProfile?.firstName || "",
      lastName: userProfile?.lastName || "",
      studentClass: userProfile?.class || ""
    };

    let options;

    if (file) {
      const form = new FormData();
      form.append("file", file);
      form.append("person", requestData.person);
      form.append("messages", JSON.stringify(requestData.messages));
      form.append("firstName", requestData.firstName);
      form.append("lastName", requestData.lastName);
      form.append("studentClass", requestData.studentClass);

      options = {
        method: "POST",
        body: form
      };
    } else {
      options = {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestData)
      };
    }

    const response = await fetch("/api/chat", options);
    const rawBody = await response.text();

    let data;

    try {
      data = JSON.parse(rawBody);
    } catch {
      console.error(
        "Unerwartete Serverantwort:",
        response.status,
        rawBody.slice(0, 500)
      );

      throw new Error(
        `Der Server hat keine lesbare Antwort geliefert (HTTP ${response.status}).`
      );
    }

    if (!response.ok) {
      throw new Error(
        typeof data.error === "string"
          ? data.error
          : `Serverfehler (HTTP ${response.status}).`
      );
    }

    const answer = data.message?.content;

    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error(
        typeof data.error === "string"
          ? data.error
          : "Der Server hat keine Textantwort zurückgegeben."
      );
    }

    const botTimestamp = new Date();

    chatHistory[person].push({
      type: "text",
      text: answer,
      who: "bot",
      timestamp: botTimestamp
    });

    updatePreview(person, answer, botTimestamp);
  } catch (error) {
    console.error("Chat-Anfrage fehlgeschlagen:", error);

    const timestamp = new Date();
    const description =
      error instanceof TypeError
        ? "Die Verbindung zum Server konnte nicht hergestellt werden."
        : error.message;

    const errorText = `Die Antwort konnte nicht geladen werden.\n\n${description}`;

    chatHistory[person].push({
      type: "text",
      text: errorText,
      who: "bot",
      timestamp,
      isError: true
    });

    updatePreview(person, "Antwort konnte nicht geladen werden.", timestamp);
  } finally {
    pendingRequests.delete(person);

    if (currentPerson === person) {
      renderMessages(person);
      updateComposerState();
    }
  }
}

function stopRecording() {
  if (!recognition && !isRecording) return;

  const activeRecognition = recognition;

  recognition = null;
  isRecording = false;

  if (currentPerson === recordingPerson) {
    inputField.textContent = speechDraft;
  }

  recordingPerson = null;

  if (activeRecognition) {
    activeRecognition.onresult = null;
    activeRecognition.onend = null;
    activeRecognition.onerror = null;

    try {
      activeRecognition.abort();
    } catch {
      // Aufnahme war bereits beendet.
    }
  }

  updateComposerState();
}

function startRecording() {
  const Recognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Spracheingabe wird von diesem Browser nicht unterstützt.");
    return;
  }

  if (!currentPerson || pendingRequests.has(currentPerson)) return;

  const instance = new Recognition();

  recognition = instance;
  recordingPerson = currentPerson;
  recordingBaseText = inputField.innerText.trim();
  speechDraft = recordingBaseText;

  instance.lang = "de-DE";
  instance.continuous = true;
  instance.interimResults = true;

  instance.onstart = () => {
    if (recognition !== instance) return;

    isRecording = true;
    updateComposerState();
  };

  instance.onresult = event => {
    if (
      recognition !== instance ||
      currentPerson !== recordingPerson
    ) {
      return;
    }

    let spokenText = "";

    for (let i = 0; i < event.results.length; i++) {
      spokenText += event.results[i][0].transcript + " ";
    }

    speechDraft = [
      recordingBaseText,
      spokenText.trim()
    ].filter(Boolean).join(" ");

    inputField.textContent = speechDraft;

    const indicator = document.createElement("span");
    indicator.className = "voice-inline-mic";
    indicator.contentEditable = "false";
    indicator.textContent = "●";
    indicator.setAttribute("aria-label", "Aufnahme läuft");
    inputField.appendChild(indicator);
  };

  const finish = () => {
    if (recognition !== instance) return;

    if (currentPerson === recordingPerson) {
      inputField.textContent = speechDraft;
    }

    recognition = null;
    recordingPerson = null;
    isRecording = false;
    updateComposerState();
  };

  instance.onend = finish;

  instance.onerror = event => {
    console.warn("Spracheingabe:", event.error);
    finish();

    if (event.error === "not-allowed") {
      alert("Bitte erlaube dem Browser den Zugriff auf das Mikrofon.");
    }
  };

  try {
    instance.start();
  } catch (error) {
    finish();
    alert("Die Spracheingabe konnte nicht gestartet werden.");
  }
}

function updateViewportHeight() {
  const height = window.visualViewport
    ? window.visualViewport.height
    : window.innerHeight;

  phoneContainer.style.height = `${height}px`;

  composerBar.classList.toggle(
    "keyboard-open",
    height < window.innerHeight * 0.85
  );
}

$("backBtn").addEventListener("click", backToChatList);

inputField.addEventListener("input", () => {
  if (currentPerson && !isRecording) {
    drafts[currentPerson] = inputField.innerText;
  }

  updateComposerState();
});

inputField.addEventListener("paste", event => {
  event.preventDefault();

  const text = event.clipboardData.getData("text/plain");
  const selection = window.getSelection();

  if (!selection || !selection.rangeCount) return;

  const range = selection.getRangeAt(0);
  range.deleteContents();

  const node = document.createTextNode(text);
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);

  inputField.dispatchEvent(new Event("input"));
});

micOrSendBtn.addEventListener("click", () => {
  if (isRecording) {
    stopRecording();
  } else if (inputField.innerText.trim()) {
    sendMessage();
  } else {
    startRecording();
  }
});

uploadBtn.addEventListener("click", () => {
  stopRecording();
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  fileInput.value = "";

  if (!file || !currentPerson) return;

  sendMessage(file);
});

$("studentConfirmBtn").addEventListener("click", () => {
  const firstName = $("studentFirstNameInput").value.trim();
  const lastName = $("studentLastNameInput").value.trim();
  const studentClass = $("studentClassSelect").value;

  if (!firstName || !lastName || !studentClass) {
    $("studentError").classList.remove("hidden-element");
    return;
  }

  saveUserProfile({
    firstName,
    lastName,
    class: studentClass
  });

  showChatContent();
});

$("passwordConfirmBtn").addEventListener("click", () => {
  const error = $("passwordError");

  /*
    Bestehende Frontend-Freischaltung.
    Eine echte Zugriffskontrolle muss zusätzlich serverseitig erfolgen.
  */
  if ($("passwordInput").value !== "84307") {
    error.textContent = "Das Passwort ist nicht korrekt.";
    error.classList.remove("hidden-element");
    return;
  }

  if (!userProfile) {
    const firstName = $("frankFirstNameInput").value.trim();
    const lastName = $("frankLastNameInput").value.trim();

    if (!firstName || !lastName) {
      error.textContent = "Bitte Vorname und Nachname ausfüllen.";
      error.classList.remove("hidden-element");
      return;
    }

    saveUserProfile({
      firstName,
      lastName,
      class: ""
    });
  }

  frankSessionUnlocked = true;
  $("passwordInput").value = "";
  error.classList.add("hidden-element");
  showChatContent();
});

$("passwordInput").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    $("passwordConfirmBtn").click();
  }
});

function normalizeSearch(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/ä/g, "ae")
    .replace(/ö/g, "oe")
    .replace(/ü/g, "ue")
    .replace(/ß/g, "ss")
    .trim();
}

searchInput.addEventListener("input", () => {
  const query = normalizeSearch(searchInput.value);

  document.querySelectorAll(".wa-chat-item").forEach(item => {
    const person = item.dataset.person;
    const profile = profiles[person];

    const searchable = normalizeSearch([
      profile.name,
      profile.role,
      profile.desc,
      ...chatHistory[person].map(message => {
        return message.text || message.fileName || "";
      })
    ].join(" "));

    item.classList.toggle(
      "hidden-element",
      Boolean(query) && !searchable.includes(query)
    );
  });
});

let swipeStart = null;

chatWindowView.addEventListener("touchstart", event => {
  if (event.touches.length !== 1) return;

  const touch = event.touches[0];
  const target = event.target;

  if (
    touch.clientX > 40 ||
    target.closest(".wa-formula, input, select, [contenteditable]")
  ) {
    swipeStart = null;
    return;
  }

  swipeStart = {
    x: touch.clientX,
    y: touch.clientY
  };
}, { passive: true });

chatWindowView.addEventListener("touchend", event => {
  if (!swipeStart || !event.changedTouches.length) return;

  const touch = event.changedTouches[0];
  const deltaX = touch.clientX - swipeStart.x;
  const deltaY = Math.abs(touch.clientY - swipeStart.y);

  if (deltaX > 90 && deltaY < 60) {
    backToChatList();
  }

  swipeStart = null;
}, { passive: true });

chatWindowView.addEventListener("touchcancel", () => {
  swipeStart = null;
}, { passive: true });

window.addEventListener("resize", updateViewportHeight);

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    updateViewportHeight();

    if (currentPerson) {
      scrollToBottom();
    }
  });
}

window.addEventListener("DOMContentLoaded", () => {
  /*
    Falls bereits Nachrichten vor dem Laden von KaTeX sichtbar waren,
    werden sie jetzt erneut mit dem geladenen Renderer aufgebaut.
  */
  if (currentPerson) {
    renderMessages(currentPerson);
  }

  setTimeout(() => {
    $("splashOverlay").classList.add("fade-out");

    setTimeout(() => {
      $("splashOverlay").remove();
    }, 500);
  }, 2200);
});

loadUserProfile();
buildChatList();
updateViewportHeight();
updateComposerState();
</script>
